<!-- View.Shell — kerangka: navigasi samping, bilah atas (kembali + cari), bilah filter periode, dan halaman. -->
<aside class="sidebar" :class="$store.app.sidebarOpen && 'open'" aria-label="Navigasi utama">
  <button class="brand" style="border:0;background:none;cursor:pointer;width:100%;text-align:left" @click="$store.app.home()" title="Halaman depan">
    <img class="brand-logo" :src="$store.app.sidebarMini ? KAI_LOGO.mark : KAI_LOGO.dark" alt="KAI">
    <div class="brand-text"><div class="brand-name">Gangguan Operasional</div><div class="brand-sub" x-text="'Dashboard v' + (($store.app.config && $store.app.config.appVersion) || '3.9.0')">Dashboard</div></div>
  </button>
  <nav class="nav">
    <template x-for="(r, i) in KAI.ROUTES" :key="r.id">
      <div>
        <div class="nav-label" x-show="i === 0 || KAI.ROUTES[i - 1].group !== r.group" x-text="r.group"></div>
        <button class="nav-item" :class="$store.app.route === r.id && 'active'" :aria-current="$store.app.route === r.id ? 'page' : null" :title="r.title" @click="$store.app.go(r.id, r.id === 'telusuri' ? {} : null)">
          <svg class="i"><use :href="'#' + r.icon"/></svg><span x-text="r.title"></span>
        </button>
      </div>
    </template>
  </nav>
  <div class="sidebar-foot">
    <button class="nav-item" @click="$store.app.toggleMini()" :title="$store.app.sidebarMini ? 'Lebarkan menu' : 'Ciutkan menu'"><svg class="i"><use href="#i-side"/></svg><span x-text="$store.app.sidebarMini ? 'Lebarkan' : 'Ciutkan menu'"></span></button>
  </div>
</aside>
<div class="scrim" x-show="$store.app.sidebarOpen" x-transition.opacity @click="$store.app.sidebarOpen = false" style="z-index:25"></div>

<div class="main">
  <header class="topbar">
    <div class="topbar-row">
      <button class="btn ghost sm menu-btn" @click="$store.app.sidebarOpen = true" aria-label="Buka menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <button class="btn sm back-btn" @click="$store.app.back()" :disabled="!$store.app.canBack()" aria-label="Kembali" title="Kembali (Alt+←)"><svg class="i"><use href="#i-back"/></svg><span class="hide-sm">Kembali</span></button>
      <h1 class="page-title" x-text="$store.app.routeTitle()"></h1>
      <div class="gsearch" @click.outside="$store.app.sopen = false">
        <svg class="i"><use href="#i-search"/></svg>
        <input type="search" class="ctl" placeholder="Cari sarana, stasiun, petak, Daop/Divre, depo, KA, JPL…" aria-label="Pencarian global"
          x-model="$store.app.sq" @input.debounce.150ms="$store.app.doSearch()" @focus="$store.app.sq && ($store.app.sopen = true)" @keydown="$store.app.skey($event)">
        <div class="gs-pop" x-show="$store.app.sopen" x-transition.opacity>
          <template x-if="!$store.app.refReady"><div class="gs-empty">Data referensi sedang dimuat…</div></template>
          <template x-if="$store.app.refReady && !$store.app.sres.length"><div class="gs-empty">Tidak ditemukan. Tekan Enter untuk mencari di uraian kejadian.</div></template>
          <template x-for="(e, i) in $store.app.sres" :key="e.type + e.id">
            <button class="gs-item" :class="i === $store.app.sidx && 'on'" @mouseenter="$store.app.sidx = i" @click="$store.app.pick(e)">
              <span class="gs-type" :data-t="e.type" x-text="{sarana:'Sarana',stasiun:'Stasiun',petak:'Petak',wilayah:'Wilayah',depo:'Depo',lintas:'Lintas',ka:'KA',jpl:'JPL',kejadian:'Kejadian'}[e.type]"></span>
              <span class="gs-text"><b x-text="e.label"></b><small x-text="e.sub"></small></span>
            </button>
          </template>
        </div>
      </div>
      <span class="data-chip hide-md" x-show="$store.app.meta" :title="$store.app.status && $store.app.status.message">
        <span class="dot" :class="$store.app.status && !$store.app.status.ok ? 'bad' : ''"></span>
        <span x-text="'s.d. ' + KAI.fmt.day($store.app.dates.max) + ' · ' + KAI.fmt.time($store.app.meta && $store.app.meta.builtAt)"></span>
      </span>
      <div class="bell-wrap" @click.outside="$store.app.notif.open = false">
        <button class="bell" :class="$store.app.notif.has && 'on'" @click="$store.app.notif.open = !$store.app.notif.open; $store.app.checkUpdates()"
          :aria-label="$store.app.notif.has ? 'Ada pembaruan data' : 'Notifikasi pembaruan data'" :title="$store.app.notif.has ? 'Ada pembaruan data' : 'Tidak ada pembaruan baru'">
          <svg class="i"><use href="#i-bell"/></svg><span class="bell-dot" x-show="$store.app.notif.has" x-text="$store.app.notif.items.length"></span>
        </button>
        <div class="bell-pop" x-show="$store.app.notif.open" x-transition.opacity x-cloak>
          <div class="bell-h"><b x-text="$store.app.notif.has ? 'Data baru tersedia' : 'Pembaruan data'"></b><span class="note" x-text="'Dimuat: ' + KAI.fmt.time($store.app.meta && $store.app.meta.builtAt)"></span></div>
          <template x-if="$store.app.notif.has">
            <div class="bell-cta"><span x-text="$store.app.notif.summary"></span><button class="btn sm primary" @click="$store.app.applyUpdate()">Muat data terbaru</button></div>
          </template>
          <div class="bell-list">
            <template x-for="it in $store.app.notif.log" :key="it.version">
              <div class="bell-it" :class="it.isNew && 'new'">
                <div class="bell-it-h"><b x-text="KAI.fmt.time(it.at)"></b><span class="tag" x-text="it.kind === 'aplikasi' ? 'Versi aplikasi' : it.kind === 'awal' ? 'Data awal' : 'Pembaruan data'"></span><span class="tag good" x-show="it.isNew">Baru</span></div>
                <div class="note" x-text="KAI.fmt.n(it.rows) + ' kejadian · ' + (it.kind === 'awal' ? 'snapshot pertama' : (it.dRows >= 0 ? '+' : '') + KAI.fmt.n(it.dRows) + ' kejadian, ' + (it.dMenit >= 0 ? '+' : '') + KAI.fmt.n(it.dMenit) + ' menit')"></div>
                <div class="note" x-show="it.months && it.months.length" x-text="'Bulan berubah: ' + (it.months || []).slice(0, 4).map(function (m) { return KAI.fmt.mon(m.ym) + ' (' + (m.dn >= 0 ? '+' : '') + m.dn + ' kej.)'; }).join(', ') + (it.monthsChanged > 4 ? ', +' + (it.monthsChanged - 4) + ' bulan lain' : '')"></div>
              </div>
            </template>
            <div class="note" style="padding:10px" x-show="!$store.app.notif.log.length">Belum ada catatan pembaruan. Riwayat muncul setelah sinkronisasi berikutnya.</div>
          </div>
        </div>
      </div>
      <button class="btn sm" @click="$store.app.go('unduh')" title="Unduh"><svg class="i"><use href="#i-download"/></svg><span class="hide-md">Unduh</span></button>
    </div>
    <div class="filterbar" role="group" aria-label="Filter global" x-show="['kejadian', 'gapeka'].indexOf($store.app.route) < 0">
      <div class="field">
        <span class="lbl">Periode</span>
        <div class="seg">
          <button :aria-pressed="$store.app.f.mode === 'month'" @click="$store.app.setF({ mode: 'month' })">Bulan</button>
          <button :aria-pressed="$store.app.f.mode === 'range'" @click="$store.app.setF({ mode: 'range' })">Rentang hari</button>
        </div>
      </div>
      <div class="field" x-show="$store.app.f.mode === 'month'">
        <select id="f-ym" class="ctl" aria-label="Bulan" :value="$store.app.f.ym" @change="$store.app.setF({ ym: $event.target.value })">
          <template x-for="m in $store.app.months.slice().reverse()" :key="m">
            <option :value="m" :selected="m === $store.app.f.ym" x-text="KAI.fmt.month(m)"></option>
          </template>
        </select>
      </div>
      <div class="field" x-show="$store.app.f.mode === 'range'">
        <input type="date" class="ctl" aria-label="Dari tanggal" :min="$store.app.dates.min" :max="$store.app.dates.max" :value="$store.app.f.from" @change="$event.target.value && $store.app.setF({ from: $event.target.value })">
        <span class="muted">–</span>
        <input type="date" class="ctl" aria-label="Sampai tanggal" :min="$store.app.dates.min" :max="$store.app.dates.max" :value="$store.app.f.to" @change="$event.target.value && $store.app.setF({ to: $event.target.value })">
        <div class="presets">
          <button class="chip sm" @click="$store.app.preset('7')">7 hari</button>
          <button class="chip sm" @click="$store.app.preset('30')">30 hari</button>
          <button class="chip sm" @click="$store.app.preset('ytd')">YTD</button>
          <button class="chip sm" @click="$store.app.preset('12')">12 bulan</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl"><svg class="i" style="width:15px;height:15px"><use href="#i-clock"/></svg> Jam</span>
        <select class="ctl" aria-label="Dari jam" :value="$store.app.f.h0" @change="$store.app.setHours($event.target.value, $store.app.f.h1)">
          <template x-for="h in 24" :key="h"><option :value="h - 1" :selected="h - 1 === $store.app.f.h0" x-text="(h - 1 < 10 ? '0' : '') + (h - 1) + ':00'"></option></template>
        </select>
        <span class="muted">–</span>
        <select class="ctl" aria-label="Sampai jam" :value="$store.app.f.h1" @change="$store.app.setHours($store.app.f.h0, $event.target.value)">
          <template x-for="h in 24" :key="h"><option :value="h - 1" :selected="h - 1 === $store.app.f.h1" x-text="(h - 1 < 10 ? '0' : '') + (h - 1) + ':59'"></option></template>
        </select>
      </div>
      <div class="field">
        <span class="lbl">Pembanding</span>
        <div class="seg">
          <button :aria-pressed="$store.app.f.cmp === 'prev'" @click="$store.app.setF({ cmp: 'prev' })" title="Periode sebelumnya dengan panjang sama">MoM</button>
          <button :aria-pressed="$store.app.f.cmp === 'yoy'" @click="$store.app.setF({ cmp: 'yoy' })" title="Periode yang sama tahun lalu">YoY</button>
        </div>
      </div>
      <div class="field multi" @click.outside="$store.app.wilayahOpen = false">
        <span class="lbl">Wilayah</span>
        <button class="btn sm" @click="$store.app.wilayahOpen = !$store.app.wilayahOpen" :aria-expanded="$store.app.wilayahOpen">
          <span x-text="$store.app.f.wilayah.length ? ($store.app.f.wilayah.length > 2 ? $store.app.f.wilayah.length + ' wilayah' : $store.app.f.wilayah.join(', ')) : 'Semua'"></span>
          <svg class="i"><use href="#i-chevron"/></svg>
        </button>
        <div class="multi-pop" x-show="$store.app.wilayahOpen" x-transition.origin.top.left>
          <label><input type="checkbox" :checked="!$store.app.f.wilayah.length" @change="$store.app.setF({ wilayah: [] })"> Semua wilayah</label>
          <template x-for="w in $store.app.wilayahList" :key="w">
            <label><input type="checkbox" :checked="$store.app.f.wilayah.indexOf(w) >= 0" @change="$store.app.toggleWilayah(w)"> <span x-text="w"></span></label>
          </template>
        </div>
      </div>
      <div class="field" style="flex-wrap:wrap">
        <template x-for="k in KAIA.CLASSES" :key="k">
          <button class="chip" :aria-pressed="$store.app.kelasOn(k)" :style="'color:' + KAI.classColor(k)" @click="$store.app.toggleKelas(k)">
            <span class="sw" :style="'background:' + KAI.classColor(k)"></span><span style="color:var(--ink)" x-text="$store.app.classLabel(k).split(',')[0]"></span>
          </button>
        </template>
      </div>
      <button class="btn sm ghost" @click="$store.app.resetFilters()" title="Kembalikan filter"><svg class="i"><use href="#i-refresh"/></svg><span class="hide-md">Atur ulang</span></button>
    </div>
    <div class="periodnote" x-show="$store.app.R && ['kejadian'].indexOf($store.app.route) < 0">
      <b x-text="$store.app.R && $store.app.R.label"></b>
      <span x-text="$store.app.R ? ' · MoM: ' + $store.app.R.prevP.base + ' · YoY: ' + $store.app.R.yoyP.base + ' · YTD: ' + $store.app.R.ytdP.base : ''"></span>
      <span class="warn-txt" x-show="$store.app.R && ($store.app.R.excluded.noDay || $store.app.R.excluded.noHour)"
        x-text="$store.app.R ? ' · tidak terhitung: ' + ($store.app.R.excluded.noDay ? $store.app.R.excluded.noDay + ' kejadian tanpa tanggal hari' : '') + ($store.app.R.excluded.noDay && $store.app.R.excluded.noHour ? ', ' : '') + ($store.app.R.excluded.noHour ? $store.app.R.excluded.noHour + ' kejadian tanpa jam' : '') : ''"></span>
    </div>
  </header>

  <main class="content" id="main" @keydown.alt.left.window="$store.app.back()">
    <template x-if="$store.app.phase === 'error'">
      <div class="card"><div class="card-b">
        <h2 style="margin-top:0">Data belum bisa dimuat</h2>
        <p x-text="$store.app.error"></p>
        <button class="btn primary" @click="$store.app.error = ''; $store.app.load()"><svg class="i"><use href="#i-refresh"/></svg>Coba lagi</button>
      </div></div>
    </template>
    <div x-show="$store.app.phase === 'ready'">
        <?!= include('View.Ringkasan'); ?>

        <?!= include('View.Tren'); ?>

        <?!= include('View.Perlintasan'); ?>

        <?!= include('View.Wilayah'); ?>

        <?!= include('View.Sarana'); ?>

        <?!= include('Part.RuteData'); ?>

        <?!= include('View.Eksposur'); ?>

        <?!= include('View.Gapeka'); ?>

        <?!= include('View.Telusuri'); ?>

        <?!= include('View.Cari'); ?>

        <?!= include('View.Profil'); ?>

        <?!= include('View.Kejadian'); ?>

        <?!= include('View.Unduh'); ?>

        <?!= include('View.Metodologi'); ?>

    </div>
  </main>
</div>
