<script>
/**
 * Js.Marey — grafik perjalanan KA (diagram Marey: waktu × kilometer) sesuai Lembar GAPEKA 2026.
 *
 * DATA (apiGapeka26 → 19_SeedGapeka26.gs):
 *   lintas[] = { id, lembar, wilayah, judul, halaman, berkas, sumber, st: [[kode, nama, km], ...] }  — urutan & km per judul lembar
 *   ka[]     = { no, nama, relasi, kelas, kat, f (fakultatif), v (terverifikasi), src, pts: [[kode, datangDetik, berangkatDetik], ...] }
 *   Detik = -1 bila tidak ada jam (langsung tanpa jam / berhenti sebentar) — titik itu dilewati, garis disambung lurus.
 *
 * TATA LETAK TANPA TUMPANG TINDIH:
 *   - label stasiun: posisi asli = skala km; bila terlalu rapat digeser (relaksasi maju-mundur, jarak minimum = tinggi huruf + 2 px)
 *     dan diberi garis penunjuk ke posisi aslinya. Tinggi kanvas ditambah bila jumlah stasiun tidak muat.
 *   - nomor KA: ditulis searah garis di kandidat titik; hanya ditulis bila kotaknya tidak menabrak nomor lain / label sumbu.
 *     Nomor yang tidak muat tetap bisa dilihat dengan mengarahkan kursor (tooltip).
 *   - sumbu jam: label jam diberi jarak minimum; menit hanya bila ruang cukup.
 * Fungsi tata letak murni (layoutLabels, tracks, intersects) diuji di Node; renderer memakai Canvas 2D.
 */
(function (root) {
  'use strict';
  var DAY = 86400;
  var KAT = {
    pjj: { label: 'KA penumpang jarak jauh', color: '#252271', width: 1.7, dash: [] },
    lokal: { label: 'KA lokal / bandara', color: '#275BC0', width: 1.3, dash: [] },
    krl: { label: 'Commuter Line (KRL)', color: '#0F766E', width: 1.0, dash: [] },
    barang: { label: 'KA barang', color: '#B45309', width: 1.4, dash: [7, 3] },
    dinas: { label: 'KA dinas', color: '#64748B', width: 1.1, dash: [2, 3] },
    lainnya: { label: 'Lainnya', color: '#64748B', width: 1.1, dash: [2, 3] }
  };
  var FAK_DASH = [9, 3, 2, 3];

  /* ---------------- data ---------------- */
  /** Versi GAPEKA yang tersedia (terbaru dulu). berlaku = tanggal mulai berlaku (WIB). */
  var VERSI = [
    { id: '2026', label: 'GAPEKA 2026', berlaku: '2026-12-01', dasar: 'KP-DJKA 116 Tahun 2026' },
    { id: '2025', label: 'GAPEKA 2025', berlaku: '2025-02-01', dasar: 'KP-DJKA 224–227 Tahun 2024' }
  ];
  /** Versi yang berlaku pada tanggal ymd (yyyy-mm-dd): yang terakhir mulai berlaku ≤ tanggal itu. */
  function versiBerlaku(ymd) {
    var v = VERSI.filter(function (x) { return x.berlaku <= ymd; });
    return (v[0] || VERSI[VERSI.length - 1]).id;
  }
  /** Ubah data GAPEKA (ka[].pts detik) ke baris jadwal format referensi: [no, nama, relasi, sumber, "kode|datang|berangkat|ket|catatan\n..."]. */
  function jadwalRowsOf(d) {
    var hm = function (t) { if (t == null || t < 0) return ''; var m = Math.round(t / 60) % 1440; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); };
    return d.ka.map(function (k) {
      var n = k.pts.length;
      return [k.no, k.nama, k.relasi, k.src, k.pts.map(function (p, i) {
        var ket = i === 0 ? 'A' : i === n - 1 ? 'Z' : (p[1] < 0 || p[2] < 0 || p[1] === p[2]) ? 'L' : 'H';
        return [p[0], hm(p[1]), hm(p[2]), ket, ''].join('|');
      }).join('\n')];
    });
  }
  var cache = {};
  function load(api, gunzip, tahun) {
    tahun = tahun || '2026';
    if (cache[tahun]) return Promise.resolve(cache[tahun]);
    return api('apiGapeka', tahun).then(function (r) { return gunzip(r.gz); }).then(function (d) { cache[tahun] = index(d); cache[tahun].tahun = tahun; return cache[tahun]; });
  }
  function index(d) {
    var groups = [], byLembar = {};
    d.lintas.forEach(function (l) {
      if (!byLembar[l.lembar]) { byLembar[l.lembar] = { lembar: l.lembar, wilayah: l.wilayah, halaman: l.halaman, berkas: l.berkas, items: [] }; groups.push(byLembar[l.lembar]); }
      byLembar[l.lembar].items.push(l);
    });
    var byCode = {};
    d.ka.forEach(function (k, i) {
      k.idx = i;
      k.pts.forEach(function (p) { (byCode[p[0]] = byCode[p[0]] || []).push(i); });
    });
    d.groups = groups; d.byCode = byCode;
    d.lintasById = {}; d.lintas.forEach(function (l) { d.lintasById[l.id] = l; });
    return d;
  }

  /**
   * Lintasan KA pada satu lintas: daftar run berisi titik {t (detik, sudah di-unwrap lewat tengah malam), km, kode, jenis}.
   * Run terputus bila KA keluar dari lintas lalu masuk lagi. Run < 2 titik berjam dibuang.
   */
  function tracks(d, lintas, opt) {
    opt = opt || {};
    var kmOf = {}, ordOf = {};
    lintas.st.forEach(function (s, i) { kmOf[s[0]] = s[2]; ordOf[s[0]] = i; });
    var seen = {}, out = [];
    lintas.st.forEach(function (s) { (d.byCode[s[0]] || []).forEach(function (i) { seen[i] = 1; }); });
    Object.keys(seen).forEach(function (key) {
      var k = d.ka[+key];
      if (opt.kat && !opt.kat[k.kat]) return;
      if (opt.verifOnly && !k.v) return;
      var runs = [], cur = null, off = 0, prevT = null, prevOrd = null;
      k.pts.forEach(function (p) {
        var inL = kmOf.hasOwnProperty(p[0]);
        if (!inL) { if (cur && cur.length) { runs.push(cur); } cur = null; prevOrd = null; return; }
        // stasiun harus bertetangga di lintas (selisih urutan kecil) agar tidak menarik garis melintasi cabang
        if (cur && prevOrd != null && Math.abs(ordOf[p[0]] - prevOrd) > 12) { runs.push(cur); cur = null; }
        if (!cur) cur = [];
        prevOrd = ordOf[p[0]];
        [p[1], p[2]].forEach(function (t, j) {
          if (t < 0) return;
          if (prevT != null && t + off < prevT - 6 * 3600) off += DAY;
          var tt = t + off;
          if (prevT != null && tt < prevT) return;   // jam mundur (salah baca sumber) tidak digambar mundur
          prevT = tt;
          cur.push({ t: tt, km: kmOf[p[0]], kode: p[0], j: j });
        });
      });
      if (cur && cur.length) runs.push(cur);
      runs = runs.filter(function (r) { return r.length >= 2 && r.some(function (x) { return x.km !== r[0].km; }); });
      if (runs.length) out.push({ ka: k, runs: runs });
    });
    out.sort(function (a, b) { return a.runs[0][0].t - b.runs[0][0].t; });
    return out;
  }

  /**
   * Relaksasi label 1-D: tiap label punya posisi ideal y; hasil y' terurut dengan selisih ≥ gap, dalam [lo, hi] bila muat.
   * Mengembalikan { y: [...], need: tinggi minimum yang dibutuhkan }.
   */
  function layoutLabels(ys, gap, lo, hi) {
    var n = ys.length, y = ys.slice(), i, it;
    if (!n) return { y: [], need: 0 };
    var need = (n - 1) * gap;
    for (it = 0; it < 4; it++) {
      for (i = 1; i < n; i++) if (y[i] < y[i - 1] + gap) y[i] = y[i - 1] + gap;
      if (y[n - 1] > hi) { y[n - 1] = hi; for (i = n - 2; i >= 0; i--) if (y[i] > y[i + 1] - gap) y[i] = y[i + 1] - gap; }
      if (y[0] < lo) { y[0] = lo; for (i = 1; i < n; i++) if (y[i] < y[i - 1] + gap) y[i] = y[i - 1] + gap; }
      // tarik kelompok yang bergeser kembali ke rata-rata posisi idealnya (tanpa melanggar jarak)
      var s = 0;
      while (s < n) {
        var e = s;
        while (e + 1 < n && y[e + 1] - y[e] <= gap + 0.01) e++;
        if (e > s) {
          var shift = 0;
          for (i = s; i <= e; i++) shift += ys[i] - y[i];
          shift /= (e - s + 1);
          var minShift = (s > 0 ? y[s - 1] + gap : lo) - y[s], maxShift = (e < n - 1 ? y[e + 1] - gap : hi) - y[e];
          shift = Math.max(minShift, Math.min(maxShift, shift));
          for (i = s; i <= e; i++) y[i] += shift;
        }
        s = e + 1;
      }
    }
    return { y: y, need: need };
  }

  function intersects(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
  function anyOverlap(rects) {
    for (var i = 0; i < rects.length; i++) for (var j = i + 1; j < rects.length; j++) if (intersects(rects[i], rects[j])) return [i, j];
    return null;
  }
  /** Kotak pembatas (AABB) teks yang diputar sudut a di titik pusat (cx, cy). */
  function rotBox(cx, cy, w, h, a) {
    var c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a)), W = w * c + h * s, H = w * s + h * c;
    return { x: cx - W / 2, y: cy - H / 2, w: W, h: H };
  }
  function hms(t) {
    t = ((Math.round(t) % DAY) + DAY) % DAY;
    var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + (s ? ':' + (s < 10 ? '0' : '') + s : '');
  }

  /* ---------------- renderer ---------------- */
  /**
   * Gambar diagram ke elemen kontainer. opt: { lintas, tracks, t0, t1 (detik), pxKm, showNo, highlight (no KA), font }
   * Mengembalikan objek tata letak (dipakai tooltip & uji tumpang tindih).
   */
  function draw(host, opt) {
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    var cv = host.querySelector('canvas.mr-base');
    if (!cv) { cv = document.createElement('canvas'); cv.className = 'mr-base'; host.appendChild(cv); }
    var ctx = cv.getContext('2d');
    var W = Math.max(320, host.clientWidth), FS = opt.font || 12, LH = FS + 3;
    var st = opt.lintas.st, kmMax = st[st.length - 1][2] || 1;
    ctx.font = '600 ' + FS + 'px Inter, Arial, sans-serif';   // ukur dengan huruf tebal (lebar maksimum)
    var narrow = W < 640;
    var labels = st.map(function (s) { return narrow ? s[0] : (s[1] || s[0]) + ' (' + s[0] + ')'; });   // layar sempit: kode saja
    var kmTxt = st.map(function (s) { return KAIM.km(s[2]); });
    var lw = 0, kw = 0;
    labels.forEach(function (t) { lw = Math.max(lw, ctx.measureText(t).width); });
    kmTxt.forEach(function (t) { kw = Math.max(kw, ctx.measureText(t).width); });
    var padL = Math.ceil(lw + kw + 30), padR = 14, padT = 34, padB = 30;
    var plotW = Math.max(160, W - padL - padR);
    // tinggi: skala km (pxKm) tetapi minimal cukup untuk semua label tanpa tumpuk
    var hKm = kmMax * opt.pxKm, hLab = (st.length - 1) * LH;
    var plotH = Math.max(220, Math.ceil(Math.max(hKm, hLab)));   // selalu cukup untuk semua label stasiun
    var Hh = plotH + padT + padB;
    cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); cv.style.width = W + 'px'; cv.style.height = Hh + 'px';
    host.style.height = Hh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, Hh);
    ctx.font = FS + 'px Inter, Arial, sans-serif'; ctx.textBaseline = 'middle';
    var t0 = opt.t0, t1 = opt.t1;
    function X(t) { return padL + (t - t0) / (t1 - t0) * plotW; }
    function Y(km) { return padT + km / kmMax * plotH; }
    var L = { padL: padL, padT: padT, plotW: plotW, plotH: plotH, W: W, H: Hh, X: X, Y: Y, t0: t0, t1: t1, kmMax: kmMax, stationRects: [], trainRects: [], axisRects: [], segs: [] };

    // ---- label stasiun (relaksasi) ----
    var ideal = st.map(function (s) { return Y(s[2]); });
    var lay = layoutLabels(ideal, LH, padT, padT + plotH);
    var bold = {};
    (opt.lintas.judul || '').split(' - ').forEach(function (n) { bold[String(n).toUpperCase().replace(/[^A-Z0-9]/g, '')] = 1; });
    st.forEach(function (s, i) {
      var y = lay.y[i], yi = ideal[i];
      var isMain = bold[String(s[1] || '').toUpperCase().replace(/[^A-Z0-9]/g, '')] || i === 0 || i === st.length - 1;
      ctx.fillStyle = isMain ? '#17223B' : '#3A4458';
      ctx.font = (isMain ? '600 ' : '') + FS + 'px Inter, Arial, sans-serif';
      var txt = labels[i];
      ctx.textAlign = 'left';
      ctx.fillText(txt, 6, y);
      var tw = ctx.measureText(txt).width;
      ctx.font = FS - 1 + 'px Inter, Arial, sans-serif'; ctx.fillStyle = '#5B6475'; ctx.textAlign = 'right';
      ctx.fillText(kmTxt[i], padL - 14, y);
      L.stationRects.push({ x: 6, y: y - LH / 2 + 1, w: tw, h: LH - 2, kind: 'stasiun' });
      L.stationRects.push({ x: padL - 14 - ctx.measureText(kmTxt[i]).width, y: y - LH / 2 + 1, w: ctx.measureText(kmTxt[i]).width, h: LH - 2, kind: 'km' });
      // garis penunjuk bila label digeser
      ctx.strokeStyle = '#B7C0D2'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL - 11, y); ctx.lineTo(padL - 4, yi); ctx.lineTo(padL, yi); ctx.stroke();
      // garis stasiun
      ctx.strokeStyle = isMain ? '#C9D1E0' : '#E8ECF3'; ctx.lineWidth = isMain ? 1 : 0.8;
      ctx.beginPath(); ctx.moveTo(padL, yi + 0.5); ctx.lineTo(padL + plotW, yi + 0.5); ctx.stroke();
    });

    // ---- sumbu jam ----
    var span = t1 - t0, pxPerMin = plotW / (span / 60);
    var minorStep = pxPerMin * 10 >= 9 ? 600 : pxPerMin * 30 >= 9 ? 1800 : 3600;
    var majorStep = 3600;
    while (plotW / (span / majorStep) < 46) majorStep *= 2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var t = Math.ceil(t0 / minorStep) * minorStep; t <= t1 + 1e-6; t += minorStep) {
      var x = Math.round(X(t)) + 0.5, isH = t % 3600 === 0;
      ctx.strokeStyle = isH ? '#C9D1E0' : '#EEF1F6'; ctx.lineWidth = isH ? 1 : 0.8;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
      if (t % majorStep === 0) {
        ctx.fillStyle = '#17223B'; ctx.font = '600 ' + (FS - 1) + 'px Inter, Arial, sans-serif';
        var lab = hms(t).slice(0, 5), w2 = ctx.measureText(lab).width;
        var xl = Math.max(padL - 4 + w2 / 2, Math.min(W - 3 - w2 / 2, x));   // jaga label tetap di dalam kanvas
        [padT - 14, padT + plotH + 15].forEach(function (yy) {
          var r = { x: xl - w2 / 2 - 2, y: yy - 7, w: w2 + 4, h: 14, kind: 'jam' };
          if (!L.axisRects.some(function (q) { return intersects(q, r); })) { ctx.fillText(lab, xl, yy); L.axisRects.push(r); }
        });
      }
    }
    ctx.strokeStyle = '#8A94A8'; ctx.lineWidth = 1; ctx.strokeRect(padL + 0.5, padT + 0.5, plotW, plotH);

    // ---- garis KA ----
    ctx.save();
    ctx.beginPath(); ctx.rect(padL, padT, plotW, plotH); ctx.clip();
    var hi = opt.highlight ? String(opt.highlight).toUpperCase() : '';
    var order = opt.tracks.slice().sort(function (a, b) { return (a.ka.no.toUpperCase() === hi) - (b.ka.no.toUpperCase() === hi); });
    order.forEach(function (tr) {
      var k = tr.ka, sty = KAT[k.kat] || KAT.lainnya, isHi = hi && k.no.toUpperCase() === hi;
      ctx.strokeStyle = isHi ? '#F06A25' : sty.color;
      ctx.globalAlpha = hi && !isHi ? 0.28 : (k.v ? 1 : 0.55);
      ctx.lineWidth = isHi ? 3 : sty.width;
      ctx.setLineDash(k.f ? FAK_DASH : sty.dash);
      tr.runs.forEach(function (run) {
        [0, -DAY, DAY].forEach(function (shift) {
          var a = run[0].t + shift, b = run[run.length - 1].t + shift;
          if (b < t0 || a > t1) return;
          ctx.beginPath();
          run.forEach(function (p, i) { var px = X(p.t + shift), py = Y(p.km); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
          ctx.stroke();
          for (var i = 1; i < run.length; i++) {
            var x1 = X(run[i - 1].t + shift), y1 = Y(run[i - 1].km), x2 = X(run[i].t + shift), y2 = Y(run[i].km);
            if (Math.max(x1, x2) < padL || Math.min(x1, x2) > padL + plotW) continue;
            L.segs.push({ x1: x1, y1: y1, x2: x2, y2: y2, tr: tr, a: run[i - 1], b: run[i] });
          }
        });
      });
    });
    ctx.restore(); ctx.globalAlpha = 1; ctx.setLineDash([]);

    // ---- nomor KA (tanpa tumpang tindih) ----
    if (opt.showNo) {
      ctx.font = '600 ' + (FS - 2) + 'px Inter, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var placed = [], skipped = 0, bySeg = {};
      L.segs.forEach(function (s) { var key = s.tr.ka.idx; (bySeg[key] = bySeg[key] || []).push(s); });
      var trs = order.slice().reverse();
      trs.forEach(function (tr) {
        var segs = (bySeg[tr.ka.idx] || []).filter(function (s) { return Math.hypot(s.x2 - s.x1, s.y2 - s.y1) > 26; });
        if (!segs.length) return;
        var txt = tr.ka.no, w = ctx.measureText(txt).width + 4, h = FS;
        var cands = [];
        segs.forEach(function (s) { [0.5, 0.3, 0.7].forEach(function (f) { cands.push({ s: s, f: f }); }); });
        var ok = null;
        for (var c = 0; c < cands.length && !ok; c++) {
          var s = cands[c].s, f = cands[c].f, cx = s.x1 + (s.x2 - s.x1) * f, cy = s.y1 + (s.y2 - s.y1) * f;
          var ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
          if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI;
          var box = rotBox(cx, cy, w, h, ang);
          if (box.x < padL + 1 || box.x + box.w > padL + plotW - 1 || box.y < padT + 1 || box.y + box.h > padT + plotH - 1) continue;
          if (placed.some(function (q) { return intersects(q, box); })) continue;
          ok = { cx: cx, cy: cy, ang: ang, box: box };
        }
        if (!ok) { skipped++; return; }
        placed.push(ok.box);
        L.trainRects.push(Object.assign({ no: tr.ka.no, kind: 'ka' }, ok.box));
        var sty = KAT[tr.ka.kat] || KAT.lainnya;
        ctx.save(); ctx.translate(ok.cx, ok.cy); ctx.rotate(ok.ang);
        ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.fillStyle = hi && tr.ka.no.toUpperCase() === hi ? '#C2410C' : sty.color;
        ctx.fillText(txt, 0, 0.5);
        ctx.restore();
      });
      L.skipped = skipped;
    }
    return L;
  }

  /** Segmen terdekat dari titik (x, y) dalam radius r piksel. */
  function hit(L, x, y, r) {
    var best = null, bd = r * r;
    L.segs.forEach(function (s) {
      var dx = s.x2 - s.x1, dy = s.y2 - s.y1, l2 = dx * dx + dy * dy, u = l2 ? Math.max(0, Math.min(1, ((x - s.x1) * dx + (y - s.y1) * dy) / l2)) : 0;
      var px = s.x1 + u * dx - x, py = s.y1 + u * dy - y, d = px * px + py * py;
      if (d < bd) { bd = d; best = { s: s, u: u }; }
    });
    return best;
  }

  var KAIM = {
    KAT: KAT, VERSI: VERSI, versiBerlaku: versiBerlaku, load: load, index: index, jadwalRowsOf: jadwalRowsOf, tracks: tracks, layoutLabels: layoutLabels, intersects: intersects, anyOverlap: anyOverlap,
    draw: draw, hit: hit, hms: hms,
    km: function (v) { var k = Math.floor(v + 1e-9), m = Math.round((v - k) * 1000); if (m === 1000) { k++; m = 0; } return k + '+' + (m < 100 ? (m < 10 ? '00' : '0') : '') + m; }
  };
  root.KAIM = KAIM;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
