<script>
/**
 * Js.Skenario — komponen Papan skenario GAPEKA (rute 'batubara'): grafik perjalanan kanvas yang bisa digeser + hasil efek domino.
 * Mesin: Js.Simulasi (KAISim). Jadwal: GAPEKA aplikasi sesuai switch global. Parameter: apiBatubara (SEED_BB).

 * KLB: salinan KA pola + "Cari slot kosong" (KAISim.findSlots). Antrean jalur terminal (bawaan aktif; ?aq=0 mati).
 * Bandingkan: skenario A disimpan di URL (?skA=…) lalu dibandingkan dengan skenario yang sedang disunting.
 * Skenario disimpan di URL (?page=batubara&sk=…&kor=…&urut=p) — tanpa menulis ke basis data (keputusan 24 Nov 2026).
 */
document.addEventListener('alpine:init', function () {
  var COL = { pen: '#F06A25', isi: '#1E1B5E', kosong: '#7C89A8', lain: '#4B5563', hit: '#C0392B', ghost: '#CBD2DC', edit: '#D9480F' };
  var TYC = { sambung: '#475569', headway: '#2563EB', silang: '#9333EA', siklus: '#0E9F6E', awak: '#B45309', tahan: '#D9480F', antrean: '#0891B2', klb: '#D9480F', tempuh: '#64748B', henti: '#64748B', jadwal: '#64748B' };
  var BBcache = null;
  Alpine.data('vSkenario', function () {
    return {
      busy: true, err: '', BB: null, P: null, base: null, sc: null, cmp: null, ver: '',
      kor: 'TMB-KPT', h0: 0, h1: 24, prio: false, edits: [], sel: -1, hover: null, drag: null, preview: null,
      form: { no: '', jenis: 'tahan', st: '', m: 30 }, tipX: 0, tipY: 0, tip: '',
      realOn: false, realDate: '', bt: null, P0: null, cap: null, antre: true, q: '', slots: null, A: null, Ares: null,
      init: function () {
        var self = this, p = self.$store.app.params || {};

        if (p.aq === '0') self.antre = false;
        if (p.q) self.q = String(p.q).slice(0, 40);
        if (p.skA) self.A = KAISim.decode(p.skA);
        if (p.sk) self.edits = KAISim.decode(p.sk);
        if (window.innerWidth < 700 && !p.sk) { self.h0 = 0; self.h1 = 8; }

        self.$watch('$store.app.gapeka', function () { self.load(); });
        self.$watch('kor', function () { self.sel = -1; self.sync(); self.draw(); });
        self.$watch('prio', function () { self.recalc(); });
        self.$watch('antre', function () { self.recalc(); });
        self.$watch('q', function () { self.sync(); self.draw(); });
        var ro = new ResizeObserver(KAI.debounce(function () { self.draw(); }, 80)); self.$nextTick(function () { self.$refs.wrap && ro.observe(self.$refs.wrap); });
      },

        Promise.all([bbP, KAIG.load(KAI.api, KAI.gunzipJson, ver)]).then(function (x) {

          if (!self.BB.cor.some(function (c) { return c.id === self.kor; })) self.kor = self.BB.cor[0].id;
          self.busy = false; self.recalc();
        }).catch(function (e) { self.busy = false; self.err = e.message || String(e); });
      },
      get cors() { return this.BB ? this.BB.cor : []; },
      get C() { var self = this; return this.BB ? this.BB.cor.filter(function (c) { return c.id === self.kor; })[0] : null; },
      /** Posisi km kumulatif stasiun koridor (dari PRASARANA_PETAK; petak tanpa data = 5 km, ditandai). */
      get Y() {

        var km = [0], miss = 0;

        return { km: km, idx: idx, tot: km[km.length - 1], miss: miss };
      },
      recalc: function () {
        if (!this.P) return;
        this.P = KAISim.withKlb(this.P0, this.edits);
        var res = KAISim.run(this.P, this.edits, this.opt());

      opt: function () { return { prioritas: this.prio, antrean: this.antre ? this.cap : null }; },

      addForm: function () {

        }

      },
      delEdit: function (i) { var e = this.edits[i]; this.edits.splice(i, 1); if (e.jenis === 'klb') this.edits = this.edits.filter(function (x) { return x.no !== e.no; }); this.recalc(); },
      klbNo: function () { var n = 1, used = {}; this.edits.forEach(function (e) { if (e.jenis === 'klb') used[e.no] = 1; }); while (used['KLB-' + n]) n++; return 'KLB-' + n; },
      /** Slot kosong untuk KLB berpola KA di form, keberangkatan dalam jendela waktu yang tampil. */
      findSlots: function () {

        if (!t) return this.$store.app.say('Isi nomor KA pola yang ada di ' + KAI.gapeka.label(this.ver) + ' wilayah Batubara.');
        var d0 = t.pts[0].d, self = this, id = this.klbNo(), c0 = this.cmp, L = [], runs = 0;
        // Kandidat dari benturan petak, lalu DIVERIFIKASI simulasi penuh: KLB tepat waktu dan tidak menambah dampak KA lain

          var probes = [Math.round((w.m0 + w.m1) / 2), w.m0 + 2, w.m1 - 2].filter(function (m, i, A) { return m >= w.m0 && m <= w.m1 && A.indexOf(m) === i; });
          probes.some(function (m) {
            if (runs++ > 24) return true;
            var ed = self.edits.concat([{ jenis: 'klb', no: id, pola: no, m: m }]), P2 = KAISim.withKlb(self.P0, ed), r = KAISim.run(P2, ed, self.opt());
            if (r.error) return false;
            var c = KAISim.compare(P2, self.base, r, ed), me = r.trains.filter(function (x) { return x.no === id; })[0];
            if (!me || me.max >= 1 || c.knock.length > c0.knock.length || c.menit > c0.menit) return false;
            L.push({ m: m, txt: self.hm(d0 + w.m0) + '–' + self.hm(d0 + w.m1), len: w.m1 - w.m0, at: self.hm(d0 + m) }); return true;
          });
          return L.length >= 6 || runs > 24;
        });

      },
      useSlot: function (w) { this.addEdit({ jenis: 'klb', no: this.klbNo(), pola: this.slots.no, m: w.m }); },
      /* ---------- bandingkan dua skenario ---------- */
      saveA: function () { this.A = JSON.parse(JSON.stringify(this.edits)); this.recalc(); this.$store.app.say('Skenario A disimpan. Ubah skenario untuk membandingkan.'); },
      clearA: function () { this.A = null; this.Ares = null; this.sync(); },
      get cmpRows() {
        var a = this.Ares, b = this.cmp; if (!a || !b || a.err) return [];
        var f = function (c) { return [c.knock.length, c.menit, c.pen, c.nextDay, c.over.length]; }, A = f(a), B = f(b);
        return ['KA terdampak efek domino', 'Menit tambahan di tujuan', 'KA penumpang terdampak', 'Merambat ke hari berikutnya', 'Stasiun melebihi jalur'].map(function (l, i) {
          return { l: l, a: A[i], b: B[i], d: B[i] - A[i] }; });
      },
      reset: function () { this.edits = []; this.sel = -1; this.recalc(); },
      editTxt: function (e) { if (e.jenis === 'klb') return e.no + ' pola KA ' + e.pola + ' (' + (e.m > 0 ? '+' : '') + e.m + ' menit)' + (this.P0 && !(e.pola in this.P0.byNo) ? ' [pola tidak ada]' : ''); return (this.P && !(e.no in this.P.byNo) ? '[tidak ada di ' + KAI.gapeka.label(this.ver) + '] ' : '') + (e.jenis === 'geser' ? 'KA ' + e.no + ' digeser ' + (e.m > 0 ? '+' : '') + e.m + ' menit' : e.jenis === 'tahan' ? 'KA ' + e.no + ' ditahan ' + e.m + ' menit di ' + e.st : 'KA ' + e.no + ' dibatalkan'); },
      kaList: function () { return this.P ? this.P.trains.map(function (t) { return { no: t.no, nama: t.nama || '' }; }) : []; },
      /* ---------- saring nomor / nama KA ---------- */
      get qn() { return String(this.q || '').trim().toLowerCase().replace(/\s+/g, ' '); },
      /** Nomor KA (hari-0 di P) yang cocok dengan kata pencarian: nomor diawali kata itu, atau nama/relasi memuat kata itu. */
      get qHit() {
        var q = this.qn, out = {}; if (!q || !this.P) return null;
        var qs = q.replace(/\s/g, '');
        this.P.trains.forEach(function (t) {
          var no = String(t.no).toLowerCase(), nm = String(t.nama || '').toLowerCase();
          if (no.indexOf(qs) === 0 || nm.indexOf(q) >= 0 || nm.replace(/\s/g, '').indexOf(qs) >= 0 || String(t.relasi || '').toLowerCase().indexOf(q) >= 0) out[t.no] = 1;
        });
        return out;
      },
      /** Daftar KA cocok yang lewat koridor ini (untuk chip). */
      get qList() {
        var H = this.qHit, Y = this.C, self = this; if (!H || !this.P || !Y) return [];
        var st = {}; Y.st.forEach(function (x) { st[x] = 1; });
        return this.P.trains.filter(function (t) { return H[t.no] && t.pts.some(function (p) { return st[p.c]; }); }).map(function (t) { return { no: t.no, nama: t.nama || '', relasi: t.relasi || '' }; })
          .sort(function (a, b) { return String(a.no).localeCompare(String(b.no), 'id', { numeric: true }); });
      },
      /** Ubah isian nama KA di formulir menjadi nomor bila cocok tepat satu. */
      noOf: function (v) {
        v = String(v || '').trim(); var up = v.toUpperCase(); if (!this.P || up in this.P.byNo) return up;
        var m = /^([A-Z0-9-]{1,12})\s*[·—-]\s/.exec(up); if (m && m[1] in this.P.byNo) return m[1];
        var lo = v.toLowerCase(), L = this.P.trains.filter(function (t) { return String(t.nama || '').toLowerCase() === lo; });
        if (L.length === 1) return L[0].no;
        L = this.P.trains.filter(function (t) { return String(t.nama || '').toLowerCase().indexOf(lo) >= 0; });
        return L.length === 1 ? L[0].no : up;
      },
      stList: function () { var no = String(this.form.no).trim().toUpperCase(), t = this.P && this.P.trains[this.P.byNo[no]]; return t ? t.pts.map(function (p) { return p.c; }) : []; },
      trainOf: function (ii) { return this.P.trains[this.sc.T[ii].ti]; },
      colorOf: function (t) { return t.pr === 3 ? COL.pen : /isi/i.test(t.muat) ? COL.isi : /kosong/i.test(t.muat) ? COL.kosong : COL.lain; },
      typeLabel: function (ty) { return KAISim.TYPES[ty] || ty; },
      typeColor: function (ty) { return TYC[ty] || '#64748B'; },
      /* ---------- ringkasan & pohon domino ---------- */
      get kpi() {
        var c = this.cmp; if (!c) return [];
        return [['KA terdampak efek domino', KAI.fmt.n(c.knock.length), c.knock.length ? 'di luar KA yang diubah' : 'tidak ada'],
          ['Menit tambahan di tujuan', KAI.fmt.n(c.menit), 'jumlah kelambatan tiba seluruh KA terdampak'],
          ['KA penumpang terdampak', KAI.fmt.n(c.pen), 'prioritas tertinggi'],
          ['Merambat ke hari berikutnya', KAI.fmt.n(c.nextDay), 'lewat siklus rangkaian'],
          ['Stasiun melebihi jalur', KAI.fmt.n(c.over.length), c.over.length ? c.over.map(function (o) { return o.st + ' ' + o.max + '/' + o.jalur; }).join(', ') : 'jumlah jalur M_STASIUN'],
          ['Antrean masuk terminal', this.antre ? KAI.fmt.n(this.sc ? this.sc.nQ || 0 : 0) : 'mati', this.antre ? 'KA menunggu jalur terminal kosong' : 'aktifkan di Aturan']];
      },
      get tree() {

        var L = sc.links.filter(function (l) { return !bl[sc.trains[l.a].no + '>' + sc.trains[l.b].no] && sc.trains[l.b].max >= 1; });
        var ch = {}; L.forEach(function (l) { (ch[l.a] = ch[l.a] || []).push(l); });

          (ch[ii] || []).sort(function (a, b) { return sc.trains[b.b].max - sc.trains[a.b].max; }).forEach(function (l) { walk(l.b, d + 1, l); });

      },
      get hitList() {

          var t = self.P.trains[x.ti]; return { ii: x.ii, no: x.no, nama: t.nama, relasi: t.relasi, grp: t.grp, muat: t.muat, day: x.day, max: x.max, end: x.end, st: x.stAt, cause: t.klb ? 'klb' : x.moved ? 'geser' : x.cause, src: x.src >= 0 ? self.sc.trains[x.src].no : '' };
        });
      },
      get selInfo() {

        }) };
      },
      hm: function (m) { if (m == null || m < -1e8) return '–'; var d = Math.floor(m / 1440), x = Math.round(m - d * 1440); if (x === 1440) { x = 0; d++; } return ('0' + Math.floor(x / 60)).slice(-2) + ':' + ('0' + x % 60).slice(-2) + (d ? ' (+' + d + ')' : ''); },
      selectNo: function (no, day) { var self = this; this.sc.T.forEach(function (I, ii) { if (self.P.trains[I.ti].no === no && I.day === (day || 0)) self.sel = ii; }); this.draw(); },
      /* ---------- kanvas ---------- */
      geom: function () {
        var cv = this.$refs.cv, wrap = this.$refs.wrap, Y = this.Y; if (!cv || !wrap || !Y) return null;

        return { W: W, H: H, L: L, R: R, Tp: Tp, B: B, x: function (m) { return L + (m - this.t0) / (this.t1 - this.t0) * (W - L - R); }, y: function (i) { return Tp + Y.km[i] / (Y.tot || 1) * (H - Tp - B); }, t0: this.h0 * 60, t1: this.h1 * 60 };
      },
      draw: function () {

        var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, g.W, g.H);
        var Y = this.Y, C = this.C, sc = this.preview || this.sc, N = sc.N;
        c.font = '11px Inter, system-ui, sans-serif'; c.textBaseline = 'middle';

          c.strokeStyle = term ? '#E6D3C3' : '#EEF1F5'; c.lineWidth = term ? 1.4 : 1; c.beginPath(); c.moveTo(g.L, y); c.lineTo(g.W - g.R, y); c.stroke();
          stag = y - lastY < 12 ? 1 - stag : 0; lastY = y;   // stasiun berdekatan: label bergantian kolom
          c.fillStyle = term ? '#9A3412' : '#334155'; c.font = (term ? '600 ' : '') + '11px Inter, system-ui, sans-serif'; c.fillText(st, stag ? (g.L < 100 ? 40 : 52) : 6, y);
          if (!stag && g.L >= 100) { c.fillStyle = '#94A3B8'; c.font = '10px Inter, system-ui, sans-serif'; c.fillText(Y.km[i].toFixed(1), 84, y); }
          if (i > 0) { var pk = KAISim.petakOf(self.BB, C.st[i - 1], st); if (pk && pk[0] === 1) { c.fillStyle = '#F1F5F9'; c.fillRect(g.L - 6, g.y(i - 1), 3, y - g.y(i - 1)); } }
        });
        // jam
        var pxh = g.x(60) - g.x(0), step = Math.max(1, Math.ceil(36 / pxh));   // label jam tidak bertumpuk di layar sempit
