<script>
/**
 * Js.Skenario — komponen Papan skenario GAPEKA (rute 'batubara'): grafik perjalanan kanvas yang bisa digeser + hasil efek domino.
 * Mesin: Js.Simulasi (KAISim). Jadwal: GAPEKA aplikasi sesuai switch global. Parameter: apiBatubara (SEED_BB).
 * Interaksi: seret garis KA = geser slot (menit); Shift + seret di titik stasiun = tahan di stasiun itu; klik = pilih KA.
 * Skenario disimpan di URL (?page=batubara&sk=…&kor=…&urut=p) — tanpa menulis ke basis data (keputusan 24 Nov 2026).
 */
document.addEventListener('alpine:init', function () {
  var COL = { pen: '#F06A25', isi: '#1E1B5E', kosong: '#7C89A8', lain: '#4B5563', hit: '#C0392B', ghost: '#CBD2DC', edit: '#D9480F' };
  var TYC = { sambung: '#475569', headway: '#2563EB', silang: '#9333EA', siklus: '#0E9F6E', awak: '#B45309', tahan: '#D9480F', tempuh: '#64748B', henti: '#64748B', jadwal: '#64748B' };
  var BBcache = null;
  Alpine.data('vSkenario', function () {
    return {
      busy: true, err: '', BB: null, P: null, base: null, sc: null, cmp: null, ver: '',
      kor: 'TMB-KPT', h0: 0, h1: 24, prio: false, edits: [], sel: -1, hover: null, drag: null, preview: null,
      form: { no: '', jenis: 'tahan', st: '', m: 30 }, tipX: 0, tipY: 0, tip: '',
      init: function () {

        if (p.urut === 'p') self.prio = true;
        if (p.sk) self.edits = KAISim.decode(p.sk);
        if (window.innerWidth < 700 && !p.sk) { self.h0 = 0; self.h1 = 8; }
        self.load();
        self.$watch('$store.app.gapeka', function () { self.load(); });
        self.$watch('kor', function () { self.sel = -1; self.sync(); self.draw(); });
        self.$watch('prio', function () { self.recalc(); });
        var ro = new ResizeObserver(KAI.debounce(function () { self.draw(); }, 80)); self.$nextTick(function () { self.$refs.wrap && ro.observe(self.$refs.wrap); });
      },
      load: function () {
        var self = this, ver = self.$store.app.gapeka || KAI.gapeka.initial();
        self.busy = true; self.err = '';
        var bbP = BBcache ? Promise.resolve(BBcache) : KAI.api('apiBatubara').then(function (r) { return KAI.gunzipJson(r.gz); }).then(function (d) { BBcache = d; return d; });
        Promise.all([bbP, KAIG.load(KAI.api, KAI.gunzipJson, ver)]).then(function (x) {
          self.BB = x[0]; self.ver = ver; self.P = KAISim.prepare(x[1], x[0], ver); self.base = KAISim.run(self.P, []);
          if (!self.BB.cor.some(function (c) { return c.id === self.kor; })) self.kor = self.BB.cor[0].id;
          self.busy = false; self.recalc();
        }).catch(function (e) { self.busy = false; self.err = e.message || String(e); });
      },
      get cors() { return this.BB ? this.BB.cor : []; },
      get C() { var self = this; return this.BB ? this.BB.cor.filter(function (c) { return c.id === self.kor; })[0] : null; },
      /** Posisi km kumulatif stasiun koridor (dari PRASARANA_PETAK; petak tanpa data = 5 km, ditandai). */
      get Y() {
        var C = this.C, BB = this.BB; if (!C) return null;
        var km = [0], miss = 0;
        for (var i = 1; i < C.st.length; i++) { var pk = KAISim.petakOf(BB, C.st[i - 1], C.st[i]); var d = pk && pk[3] ? pk[3] : (miss++, 5); km.push(km[i - 1] + d); }
        var idx = {}; C.st.forEach(function (c, i) { idx[c] = i; });
        return { km: km, idx: idx, tot: km[km.length - 1], miss: miss };
      },
      recalc: function () {
        if (!this.P) return;
        var res = KAISim.run(this.P, this.edits, { prioritas: this.prio });
        if (res.error) { this.err = 'Skenario membentuk kebuntuan (urutan saling menunggu). Ubah atau hapus perubahan terakhir.'; return; }
        this.err = ''; this.sc = res; this.cmp = KAISim.compare(this.P, this.base, res, this.edits); this.sync(); this.draw();
      },
      sync: function () {
        var p = { kor: this.kor }; if (this.edits.length) p.sk = KAISim.encode(this.edits); if (this.prio) p.urut = 'p';
        this.$store.app.params = p;
        if (window.google && google.script && google.script.history) google.script.history.replace({ route: 'batubara', params: p }, this.$store.app.urlQuery('batubara', p));
      },
      addEdit: function (e) {
        if (!e.no || !(e.no in this.P.byNo)) return this.$store.app.say('Nomor KA ' + e.no + ' tidak ada di ' + KAI.gapeka.label(this.ver) + ' wilayah Batubara.');
        var same = this.edits.filter(function (x) { return x.no === e.no && x.jenis === e.jenis && (x.st || '') === (e.st || ''); })[0];

        if (this.edits.length > 20) this.edits.shift();
        this.recalc();
      },
      addForm: function () {

        if (f.jenis === 'tahan') { e.st = KAISim.norm(f.st); var t = this.P.trains[this.P.byNo[no]]; if (!t || !t.pts.some(function (p) { return p.c === e.st; })) return this.$store.app.say('KA ' + no + ' tidak melewati stasiun ' + (f.st || '–') + '.'); }
        this.addEdit(e);
      },
      delEdit: function (i) { this.edits.splice(i, 1); this.recalc(); },
      reset: function () { this.edits = []; this.sel = -1; this.recalc(); },
      editTxt: function (e) { return (this.P && !(e.no in this.P.byNo) ? '[tidak ada di ' + KAI.gapeka.label(this.ver) + '] ' : '') + (e.jenis === 'geser' ? 'KA ' + e.no + ' digeser ' + (e.m > 0 ? '+' : '') + e.m + ' mnt' : e.jenis === 'tahan' ? 'KA ' + e.no + ' ditahan ' + e.m + ' mnt di ' + e.st : 'KA ' + e.no + ' dibatalkan'); },
      kaList: function () { return this.P ? this.P.trains.map(function (t) { return t.no; }) : []; },
      stList: function () { var no = String(this.form.no).trim().toUpperCase(), t = this.P && this.P.trains[this.P.byNo[no]]; return t ? t.pts.map(function (p) { return p.c; }) : []; },
      trainOf: function (ii) { return this.P.trains[this.sc.T[ii].ti]; },
      colorOf: function (t) { return t.pr === 3 ? COL.pen : /isi/i.test(t.muat) ? COL.isi : /kosong/i.test(t.muat) ? COL.kosong : COL.lain; },
      typeLabel: function (ty) { return KAISim.TYPES[ty] || ty; },
      typeColor: function (ty) { return TYC[ty] || '#64748B'; },
      /* ---------- ringkasan & pohon domino ---------- */
      get kpi() {
        var c = this.cmp; if (!c) return [];
        return [['KA terdampak efek domino', KAI.fmt.n(c.knock.length), c.knock.length ? 'di luar KA yang diubah' : 'tidak ada'],
          ['Menit tambahan di tujuan', KAI.fmt.n(c.menit), 'jumlah kelambatan tiba seluruh KA terdampak'],
          ['KA penumpang terdampak', KAI.fmt.n(c.pen), 'prioritas tertinggi'],
          ['Merambat ke hari berikutnya', KAI.fmt.n(c.nextDay), 'lewat siklus rangkaian'],
          ['Stasiun melebihi jalur', KAI.fmt.n(c.over.length), c.over.length ? c.over.map(function (o) { return o.st + ' ' + o.max + '/' + o.jalur; }).join(', ') : 'jumlah jalur M_STASIUN']];
      },
      get tree() {
        var sc = this.sc, base = this.base, self = this; if (!sc || !this.cmp) return [];
        var bl = {}; base.links.forEach(function (l) { bl[base.trains[l.a].no + '>' + base.trains[l.b].no] = 1; });
        var L = sc.links.filter(function (l) { return !bl[sc.trains[l.a].no + '>' + sc.trains[l.b].no] && sc.trains[l.b].max >= 1; });
        var ch = {}; L.forEach(function (l) { (ch[l.a] = ch[l.a] || []).push(l); });
        var roots = sc.trains.filter(function (x) { return self.edits.some(function (e) { return e.no === x.no; }) && x.day === 0; }), out = [], seen = {};
        var walk = function (ii, d, via) {
          if (seen[ii] || out.length > 80) return; seen[ii] = 1;
          var x = sc.trains[ii]; out.push({ ii: ii, d: d, no: x.no, day: x.day, max: x.max, end: x.end, via: via, nama: self.P.trains[x.ti].nama });
          (ch[ii] || []).sort(function (a, b) { return sc.trains[b.b].max - sc.trains[a.b].max; }).forEach(function (l) { walk(l.b, d + 1, l); });
        };
        roots.forEach(function (r) { walk(r.ii, 0, null); });
        return out;
      },
      get hitList() {
        var self = this; if (!this.cmp) return [];
        return this.cmp.hit.slice().sort(function (a, b) { return b.max - a.max; }).slice(0, 60).map(function (x) {
          var t = self.P.trains[x.ti]; return { ii: x.ii, no: x.no, nama: t.nama, relasi: t.relasi, grp: t.grp, muat: t.muat, day: x.day, max: x.max, end: x.end, st: x.stAt, cause: x.moved ? 'geser' : x.cause, src: x.src >= 0 ? self.sc.trains[x.src].no : '' };
        });
      },
      get selInfo() {
        if (this.sel < 0 || !this.sc) return null;
        var I = this.sc.T[this.sel], t = this.P.trains[I.ti], sc = this.sc, N = sc.N;
        return { no: t.no, nama: t.nama, relasi: t.relasi, grp: t.grp, muat: t.muat, day: I.day, rows: t.pts.map(function (p, s) {
          var a = I.a[s], d = I.d[s];
          return { c: p.c, pa: N[a].plan0, sa: sc.t[a], pd: N[d].plan0, sd: sc.t[d], dl: Math.round(sc.t[d] - N[d].plan0), by: sc.byT[d] };
        }) };
      },
      hm: function (m) { if (m == null || m < -1e8) return '–'; var d = Math.floor(m / 1440), x = Math.round(m - d * 1440); if (x === 1440) { x = 0; d++; } return ('0' + Math.floor(x / 60)).slice(-2) + ':' + ('0' + x % 60).slice(-2) + (d ? ' (+' + d + ')' : ''); },
      selectNo: function (no, day) { var self = this; this.sc.T.forEach(function (I, ii) { if (self.P.trains[I.ti].no === no && I.day === (day || 0)) self.sel = ii; }); this.draw(); },
      /* ---------- kanvas ---------- */
      geom: function () {
        var cv = this.$refs.cv, wrap = this.$refs.wrap, Y = this.Y; if (!cv || !wrap || !Y) return null;
        var W = wrap.clientWidth, H = Math.max(560, Math.min(1600, this.C.st.length * 27 + 60)), L = W < 600 ? 78 : 118, R = 16, Tp = 26, B = 22;
        return { W: W, H: H, L: L, R: R, Tp: Tp, B: B, x: function (m) { return L + (m - this.t0) / (this.t1 - this.t0) * (W - L - R); }, y: function (i) { return Tp + Y.km[i] / (Y.tot || 1) * (H - Tp - B); }, t0: this.h0 * 60, t1: this.h1 * 60 };
      },
      draw: function () {
        var self = this, g = this.geom(); if (!g || !this.sc) return;
        var cv = this.$refs.cv, dpr = window.devicePixelRatio || 1;
        cv.width = g.W * dpr; cv.height = g.H * dpr; cv.style.width = g.W + 'px'; cv.style.height = g.H + 'px';
        var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, g.W, g.H);
        var Y = this.Y, C = this.C, sc = this.preview || this.sc, N = sc.N;
        c.font = '11px Inter, system-ui, sans-serif'; c.textBaseline = 'middle';
        // kerangka stasiun
        var lastY = -99, stag = 0;
        C.st.forEach(function (st, i) {
          var y = g.y(i), info = self.BB.st[st], term = info && /MUAT|BONGKAR/.test(info[2] || '');
          c.strokeStyle = term ? '#E6D3C3' : '#EEF1F5'; c.lineWidth = term ? 1.4 : 1; c.beginPath(); c.moveTo(g.L, y); c.lineTo(g.W - g.R, y); c.stroke();
          stag = y - lastY < 12 ? 1 - stag : 0; lastY = y;   // stasiun berdekatan: label bergantian kolom
          c.fillStyle = term ? '#9A3412' : '#334155'; c.font = (term ? '600 ' : '') + '11px Inter, system-ui, sans-serif'; c.fillText(st, stag ? (g.L < 100 ? 40 : 52) : 6, y);
          if (!stag && g.L >= 100) { c.fillStyle = '#94A3B8'; c.font = '10px Inter, system-ui, sans-serif'; c.fillText(Y.km[i].toFixed(1), 84, y); }
          if (i > 0) { var pk = KAISim.petakOf(self.BB, C.st[i - 1], st); if (pk && pk[0] === 1) { c.fillStyle = '#F1F5F9'; c.fillRect(g.L - 6, g.y(i - 1), 3, y - g.y(i - 1)); } }
        });
        // jam
        var pxh = g.x(60) - g.x(0), step = Math.max(1, Math.ceil(36 / pxh));   // label jam tidak bertumpuk di layar sempit
        for (var h = Math.ceil(g.t0 / 60); h * 60 <= g.t1; h++) {
          var x = g.x(h * 60); c.strokeStyle = h % 24 === 0 ? '#94A3B8' : '#E2E8F0'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, g.Tp - 6); c.lineTo(x, g.H - g.B); c.stroke();
          if (h % step === 0) { c.fillStyle = '#64748B'; c.textAlign = 'center'; c.fillText(('0' + (h % 24)).slice(-2) + (pxh * step < 44 ? '' : ':00'), x, 10); c.textAlign = 'left'; }
          if (g.t1 - g.t0 <= 12 * 60) for (var q = 10; q < 60; q += 10) { var xq = g.x(h * 60 + q); if (xq > g.W - g.R) break; c.strokeStyle = '#F5F7FA'; c.beginPath(); c.moveTo(xq, g.Tp); c.lineTo(xq, g.H - g.B); c.stroke(); }
        }
        // garis KA
        var segs = [], labels = []; self._segs = segs;
        var hitSet = {}; (self.cmp ? self.cmp.hit : []).forEach(function (x) { hitSet[x.ii] = 1; });
        var drawTrain = function (I, ii, ghost) {
          var t = self.P.trains[I.ti], pts = [];
          t.pts.forEach(function (p, s) {
            var i = Y.idx[p.c]; if (i == null) { pts.push(null); return; }
            var ta = ghost ? N[I.a[s]].plan0 : sc.t[I.a[s]], td = ghost ? N[I.d[s]].plan0 : sc.t[I.d[s]];
            pts.push({ i: i, ta: ta, td: td, s: s });
          });
          var path = [];
          for (var s = 0; s < pts.length; s++) {
            var p = pts[s]; if (!p) { path.push(null); continue; }
            var prev = s > 0 ? pts[s - 1] : null;
            if (prev && Math.abs(prev.i - p.i) > 1) path.push(null);
            path.push([g.x(p.ta), g.y(p.i), p]); if (p.td > p.ta + 0.01) path.push([g.x(p.td), g.y(p.i), p]);
          }
          var vis = path.some(function (q) { return q && q[0] >= g.L - 50 && q[0] <= g.W + 50; }); if (!vis) return;
          var isSel = ii === self.sel, isEd = I.day === 0 && self.edits.some(function (e) { return e.no === t.no; }), isHit = hitSet[ii];
          c.lineWidth = ghost ? 1 : isSel ? 3.2 : isEd ? 2.6 : isHit ? 2 : 1.25;
          c.strokeStyle = ghost ? COL.ghost : isEd ? COL.edit : isHit ? COL.hit : self.colorOf(t);
          c.globalAlpha = ghost ? 0.9 : (self.sel >= 0 && !isSel && !isHit && !isEd ? 0.35 : 1);
          if (!ghost && /kosong/i.test(t.muat)) c.setLineDash([5, 3]); else c.setLineDash([]);
          c.beginPath(); var pen = false, lastPt = null;
          path.forEach(function (q) { if (!q) { pen = false; return; } if (!pen) { c.moveTo(q[0], q[1]); pen = true; } else { c.lineTo(q[0], q[1]); if (!ghost && lastPt) segs.push([lastPt[0], lastPt[1], q[0], q[1], ii, q[2].s]); } lastPt = q; });
          c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
          if (!ghost && (isHit || isEd || isSel)) {
            var lp = null; path.forEach(function (q) { if (q && q[0] <= g.W - g.R) lp = q; });
            var dl = self.sc && self.sc.trains[ii] ? self.sc.trains[ii].max : 0;
            if (lp) {
              var txt = t.no + (dl >= 1 ? ' +' + dl + "'" : ''); c.font = '600 10.5px Inter, system-ui, sans-serif';
              var tw = c.measureText(txt).width + 6, lx = Math.min(lp[0] + 4, g.W - tw - 4), ly = lp[1] - 7;
              for (var k2 = 0; k2 < 6 && labels.some(function (r) { return lx < r[0] + r[2] && lx + tw > r[0] && Math.abs(ly - r[1]) < 12; }); k2++) ly -= 13;
              labels.push([lx, ly, tw]);
              c.fillStyle = 'rgba(255,255,255,.85)'; c.fillRect(lx - 2, ly - 7, tw, 13);
              c.fillStyle = isEd ? COL.edit : COL.hit; c.fillText(txt, lx, ly);
            }
          }
        };
        var Tlist = sc.T;
        if (self.edits.length || self.preview) Tlist.forEach(function (I, ii) { if (hitSet[ii] || (I.day === 0 && self.edits.some(function (e) { return e.no === self.P.trains[I.ti].no; }))) drawTrain(I, ii, true); });
        Tlist.forEach(function (I, ii) { if (!hitSet[ii] && ii !== self.sel) drawTrain(I, ii, false); });
        Tlist.forEach(function (I, ii) { if (hitSet[ii] && ii !== self.sel) drawTrain(I, ii, false); });
        if (self.sel >= 0 && Tlist[self.sel]) drawTrain(Tlist[self.sel], self.sel, false);
        // panah sebab-akibat (skenario saja)
        if (self.sc && self.edits.length && !self.preview) self.tree.forEach(function (n) {
          if (!n.via) return; var l = n.via, A = sc.T[l.a], Bt = sc.T[l.b], i = Y.idx[l.st]; if (i == null) return;
          var tb = self.P.trains[Bt.ti], sB = tb.pts.findIndex(function (p) { return p.c === l.st; }); if (sB < 0) return;
          var ta = self.P.trains[A.ti], sA = -1; ta.pts.forEach(function (p, s) { if (Y.idx[p.c] != null && Math.abs(Y.idx[p.c] - i) <= 1 && sA < 0) sA = s; });
          var xb = g.x(sc.t[Bt.d[sB]]), yb = g.y(i); if (xb < g.L || xb > g.W) return;
          c.fillStyle = TYC[l.ty] || '#64748B'; c.beginPath(); c.arc(xb, yb, 4, 0, 6.3); c.fill();
          c.strokeStyle = TYC[l.ty] || '#64748B'; c.lineWidth = 1.5; c.setLineDash([3, 2]); c.beginPath(); c.moveTo(xb, yb); c.lineTo(g.x(sc.t[Bt.d[sB]] - l.m), yb); c.stroke(); c.setLineDash([]);
        });
        // kebuntuan stasiun
        (self.cmp ? self.cmp.over : []).forEach(function (o) { var i = Y.idx[o.st]; if (i == null) return; var x = g.x(o.t); if (x < g.L || x > g.W) return; c.fillStyle = '#B42318'; c.fillRect(x - 3, g.y(i) - 3, 6, 6); });
        if (self.drag && self.drag.label) { c.fillStyle = '#111827'; c.font = '600 12px Inter, system-ui, sans-serif'; c.fillText(self.drag.label, self.drag.x + 10, self.drag.y - 12); }
      },
      nearest: function (x, y) {
        var best = null, bd = 7;
        (this._segs || []).forEach(function (s) {
          var dx = s[2] - s[0], dy = s[3] - s[1], L = dx * dx + dy * dy, u = L ? Math.max(0, Math.min(1, ((x - s[0]) * dx + (y - s[1]) * dy) / L)) : 0;

        });
        return best;
      },
      pos: function (e) { var r = this.$refs.cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; },
      down: function (e) {
        var p = this.pos(e), s = this.nearest(p.x, p.y); if (!s) return;

        this.drag = { x0: p.x, x: p.x, y: p.y, no: t.no, st: st, m: 0, ppm: (g.W - g.L - g.R) / (g.t1 - g.t0) };
        this.$refs.cv.setPointerCapture(e.pointerId); e.preventDefault();
      },
      move: function (e) {

          if (s) { var I = this.sc.T[s[4]], t = this.P.trains[I.ti], x = this.sc.trains[s[4]]; this.tip = 'KA ' + t.no + ' ' + t.nama + ' · ' + t.relasi + (I.day ? ' · hari +1' : '') + (x.max >= 1 ? ' · terlambat ' + x.max + ' mnt (' + this.typeLabel(x.moved ? 'geser' : x.cause) + ')' : '') + '\nSeret: geser slot · Shift+seret: tahan di stasiun'; this.tipX = p.x + 14; this.tipY = p.y + 12; }
          else this.tip = '';

        var D = this.drag; D.x = p.x; D.y = p.y; D.m = Math.round((p.x - D.x0) / D.ppm);
        if (D.st) D.m = Math.max(0, D.m);
        D.label = D.st ? 'Tahan ' + D.no + ' di ' + D.st + ' ' + D.m + ' mnt' : 'Geser ' + D.no + ' ' + (D.m > 0 ? '+' : '') + D.m + ' mnt';
        this.tip = '';
        if (!D.raf) D.raf = requestAnimationFrame(function () {
          D.raf = 0; if (!self.drag) return;
          var ed = self.edits.concat(D.m ? [D.st ? { jenis: 'tahan', no: D.no, st: D.st, m: D.m } : { jenis: 'geser', no: D.no, m: D.m }] : []);
          var r = KAISim.run(self.P, ed, { prioritas: self.prio }); self.preview = r.error ? null : r; self.draw();
        });
      },
      up: function () {
        var D = this.drag; this.drag = null; this.preview = null;
        if (D && D.m) this.addEdit(D.st ? { jenis: 'tahan', no: D.no, st: D.st, m: D.m } : { jenis: 'geser', no: D.no, m: D.m });
        else this.draw();
      },
      setWin: function (a, b) { this.h0 = a; this.h1 = b; this.draw(); },
      png: function () { var a = document.createElement('a'); a.href = this.$refs.cv.toDataURL('image/png'); a.download = 'skenario-gapeka-' + this.kor + '.png'; a.click(); }
    };
  });
});
</script>
