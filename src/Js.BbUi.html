<script>
/**
 * Js.BbUi — store & komponen ruang kerja Batubara (keputusan 25 Nov 2026: alur cerita 4 langkah + 3 profil;
 * KPI utama = siklus rangkaian realisasi vs program GAPEKA).
 *   bb-hariini  "Apa yang terjadi?"            KPI utama + pengecualian hari terakhir data
 *   bb-capaian  "Seberapa jauh dari target?"   KPI wajib + program vs realisasi per relasi
 *   bb-siklus   "Mengapa?" (Penyebab)          8 tahap siklus · terminal · hambatan + PIC · awak · gangguan KA batubara
 *   batubara    Papan skenario GAPEKA (Js.Skenario)
 *   bb-profil   profil terminal / relasi / rangkaian (kepala profil + grafik saling menyaring)
 * Angka dari BBK (Js.BbData, definisi app WTT). Data: apiBatubaraPart (sinkron DB Batubara, 28_BatubaraSync.gs).
 */
document.addEventListener('alpine:init', function () {
  var STC = { ok: '#1F8A2E', warn: '#E0861A', bad: '#C0392B', na: '#94A3B8' };
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  Alpine.store('bb', {
    parts: {}, meta: null, busy: false, err: '', empty: false, tick: 0, ready: false,
    f: { m0: 1, m1: 9, wil: 'Sumsel', pem: 'Semua', mut: 'Semua', sm: '', sb: '', stat: 'mean' },
    months: [], _memo: {},
    /** Muat bagian data yang belum ada; semua halaman Batubara memanggil ini. */
    need: function (names) {
      var self = this, miss = names.filter(function (n) { return !self.parts[n]; });
      if (!miss.length) return Promise.resolve();
      self.busy = true; self.err = '';
      return Promise.all(miss.map(function (n) {
        return KAI.api('apiBatubaraPart', n).then(function (r) {
          if (r.empty) { self.empty = true; return null; }
          self.meta = r; return KAI.gunzipJson(r.gz).then(function (d) { BBK.addTables(d.t); self.parts[n] = 1; });
        });
      })).then(function () {
        if (self.parts.core && !self.ready) { BBK.buildIndex(); self.ready = true; }
        if (self.parts.perjalanan && !self.months.length) {
          var M = {}; BBK.rows('REAL_PERJALANAN').forEach(function (r) { var m = String(r.tanggal || '').slice(0, 7); if (m) M[m] = 1; });
          self.months = Object.keys(M).sort();
          if (self.months.length) { self.f.m0 = +self.months[0].slice(5); self.f.m1 = +self.months[self.months.length - 1].slice(5); }
        }
        self._memo = {}; self.busy = false; self.tick++;
      }).catch(function (e) { self.busy = false; self.err = e.message || String(e); });
    },
    get versi() { return 'GAPEKA ' + (Alpine.store('app').gapeka || KAI.gapeka.initial()); },
    /** Filter BBK (format app WTT); versi mengikuti switch GAPEKA global. */
    get F() { var f = this.f; return { versi: this.versi, m0: +f.m0, m1: +f.m1, wil: f.wil, pem: f.pem, mitra: '', nama: '', ka: '', sm: f.sm, sb: f.sb, mut: f.mut, stat: f.stat }; },
    key: function () { return JSON.stringify(this.F) + '|' + this.tick; },
    memo: function (name, fn) {
      var k = name + '|' + this.key(); if (this._memo[k] === undefined) { BBK.stat = this.f.stat; this._memo[k] = fn(); }
      return this._memo[k];
    },
    get KW() { var self = this; return this.ready && this.parts.core && this.parts.perjalanan && this.parts.terminal && this.parts.hambatan ? this.memo('kw', function () { return BBK.kpiWajib(self.F); }) : null; },
    get INS() { var self = this, KW = this.KW; return KW ? this.memo('ins', function () { return BBK.insight(self.F, KW); }) : []; },
    periodTxt: function () { var f = this.f; return MON[f.m0 - 1] + (f.m1 !== f.m0 ? '–' + MON[f.m1 - 1] : '') + ' ' + (this.months[0] || '2026').slice(0, 4); },
    stName: function (k) { return BBK.stName ? BBK.stName(k) : k; },
    relName: function (r) { return BBK.relName ? BBK.relName(r) : r; },
    open: function (type, id) { Alpine.store('app').go('bb-profil', { type: type, id: id }); },
    /**
     * KPI utama: siklus rangkaian (jam per putaran muat → isi → bongkar → kosong) realisasi vs program GAPEKA,
     * rata-rata tertimbang jumlah KA per relasi (relasi dengan program & realisasi keempat komponen lengkap; sumber K.siklus).
     */
    get north() {
      var KW = this.KW; if (!KW) return null;
      return this.memo('north', function () {
        var C = ['muat', 'isi', 'bongkar', 'kosong'], L = KW.SIK.filter(function (o) { return o.prgTotal != null && C.every(function (c) { return o.realT[c] != null; }); });
        var n = BBK.sum(L, function (o) { return o.nKa; }); if (!n) return null;
        var w = function (f) { return BBK.sum(L, function (o) { return f(o) * o.nKa; }) / n; };
        var comp = C.map(function (c) { return { id: c, n: { muat: 'Di terminal muat', isi: 'Perjalanan isi', bongkar: 'Di terminal bongkar', kosong: 'Perjalanan kosong' }[c], prog: w(function (o) { return o.prg[c]; }), real: w(function (o) { return o.realT[c]; }) }; });
        comp.forEach(function (c) { c.d = c.real - c.prog; });
        var prog = BBK.sum(comp, function (c) { return c.prog; }), real = BBK.sum(comp, function (c) { return c.real; });
        var worst = comp.slice().sort(function (a, b) { return b.d - a.d; })[0];
        return { prog: prog, real: real, d: real - prog, pct: prog ? (real - prog) / prog * 100 : null, comp: comp, worst: worst.d > 0 ? worst : null, nRel: L.length, nKa: n,
          tab: worst && (worst.id === 'muat' || worst.id === 'bongkar') ? 'terminal' : 'tahap' };
      });
    },
    /** Nomor KA batubara (M_KA, kedua nomor pasangan "4000-4001") untuk menautkan Gangguan_Induk. */
    get coalKa() {
      if (!this.ready) return {};
      return this.memo('coalKa', function () { var S = {}; BBK.rows('M_KA').forEach(function (k) { String(k.no_ka || '').split(/[-/]/).forEach(function (x) { x = x.trim().toUpperCase(); if (x) S[x] = k; }); }); return S; });
    },
    /** Gangguan_Induk dengan nomor KA batubara (M_KA) pada bulan filter Batubara (tahun data realisasi). */
    gangguan: function (allMonths) {
      var K = this.coalKa, y = (this.months[this.months.length - 1] || '2026').slice(0, 4), f = this.f;
      return this.memo('ggn' + (allMonths ? 'A' : ''), function () {
        return (KAI.data.all || []).filter(function (r) {
          if (!r.date || r.date.slice(0, 4) !== y) return false; var m = +r.date.slice(5, 7); if (!allMonths && (m < f.m0 || m > f.m1)) return false;
          var k = K[String(r.ka || '').toUpperCase().replace(/\s+/g, '')]; if (!k) return false;
          if (f.wil !== 'Sumsel' && k.divre_asal !== f.wil.toUpperCase() && k.divre_tujuan !== f.wil.toUpperCase()) return false;
          if (f.mut !== 'Semua' && k.muatan !== f.mut) return false;
          if (f.pem !== 'Semua' && (k.pemilik === 'PTBA' ? 'PTBA' : 'Swasta') !== f.pem) return false;
          return true;
        }).sort(function (a, b) { return (b.menit || 0) - (a.menit || 0); });
      });
    },
    STC: STC, MON: MON
  });

  /* ---------- Capaian ---------- */
  Alpine.data('vBbCapaian', function () {
    return {
      init: function () { this.$store.bb.need(['core', 'perjalanan', 'terminal', 'hambatan']); },
      get KW() { return this.$store.bb.KW; },
      get groups() {
        var C = this.KW ? this.KW.cards : [], by = {}; C.forEach(function (c) { by[c.id] = c; });
        return [['Terminal', ['wtt_muat', 'wtt_bongkar', 'kin_muat', 'kin_bongkar']], ['Perjalanan', ['wpka_isi', 'wpka_kosong', 'otp_brk', 'otp_tiba']], ['Peredaran & stasiun', ['wpg', 'kin_st']]]
          .map(function (g) { return { n: g[0], cards: g[1].map(function (id) { return by[id]; }).filter(Boolean) }; }).filter(function (g) { return g.cards.length; });
      },
      /** Satu baris kartu (urut kelompok), label kelompok di tiap kartu. */
      get rail() { var out = []; this.groups.forEach(function (g) { g.cards.forEach(function (c) { out.push(Object.assign({ grp: g.n }, c)); }); }); return out; },
      get answer() {
        var C = this.KW ? this.KW.cards : []; if (!C.length) return '';
        var bad = C.filter(function (c) { return c.st === 'bad'; }), warn = C.filter(function (c) { return c.st === 'warn'; }), w = bad[0] || warn[0];
        return this.$store.bb.periodTxt() + ' · ' + this.$store.bb.versi + ': ' + bad.length + ' dari ' + C.length + ' KPI di bawah target, ' + warn.length + ' mendekati.' +
          (w ? ' Paling perlu perhatian: ' + w.l + ' ' + w.v + (w.t ? ' (' + w.t + ')' : '') + '.' : ' Semua KPI dalam target.');
      },
      stc: function (s) { return STC[s] || STC.na; },
      get otpOpt() {
        var O = this.KW && this.KW.O; if (!O) return null;
        var B = O.bulan, mo = B.map(function (b) { return MON[+b.m.slice(5) - 1]; });
        var s = function (n, k, c, dash) { return { name: n, type: 'line', smooth: 0.3, symbolSize: 6, data: B.map(function (b) { return b[k].pct == null ? null : +b[k].pct.toFixed(1); }), lineStyle: { width: 2.4, color: c }, itemStyle: { color: c } }; };
        var t = function (n, k, c) { return { name: n, type: 'line', symbol: 'none', data: B.map(function (b) { return b[k].tgt == null ? null : +b[k].tgt.toFixed(1); }), lineStyle: { type: 'dashed', width: 1.4, color: c }, itemStyle: { color: c } }; };
        return { tooltip: { trigger: 'axis', valueFormatter: function (v) { return v == null ? '–' : KAI.fmt.d1(v) + '%'; } }, legend: { top: 0 }, grid: { left: 44, right: 16, top: 34, bottom: 28 },
          xAxis: { type: 'category', data: mo }, yAxis: { type: 'value', min: function (v) { return Math.max(0, Math.floor(v.min / 10) * 10); }, max: 100, axisLabel: { formatter: '{value}%' } },
          series: [s('Berangkat', 'brk', '#1E1B5E'), s('Datang', 'tiba', '#F06A25'), t('Target berangkat', 'brk', '#7C89A8'), t('Target datang', 'tiba', '#F6A878')] };
      },
      get sikRows() { return this.KW ? this.KW.SIK.filter(function (o) { return o.realT; }).slice(0, 12) : []; },
      get sikOpt() {
        var R = this.sikRows; if (!R.length) return null;
        var parts = [['muat', 'Di terminal muat', '#2F3439'], ['isi', 'Perjalanan isi', '#F06A25'], ['bongkar', 'Di terminal bongkar', '#4A5866'], ['kosong', 'Perjalanan kosong', '#F6A878']];
        var cats = R.map(function (o) { return o.rel; }).reverse();
        var ser = parts.map(function (p) { return { name: p[1], type: 'bar', stack: 'r', barWidth: 14, itemStyle: { color: p[2] }, data: R.slice().reverse().map(function (o) { var v = o.realT[p[0]]; return v == null ? null : +(v / 60).toFixed(1); }) }; });
        ser.push({ name: 'Program GAPEKA', type: 'scatter', symbol: 'rect', symbolSize: [3, 22], itemStyle: { color: '#C0392B' }, data: R.slice().reverse().map(function (o) { return o.prgTotal == null ? null : +(o.prgTotal / 60).toFixed(1); }), z: 5 });
        return { tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: function (v) { return v == null ? '–' : KAI.fmt.d1(v) + ' jam'; } }, legend: { top: 0 },
          grid: { left: 84, right: 24, top: 46, bottom: 22 }, xAxis: { type: 'value', axisLabel: { formatter: '{value} j' } },
          yAxis: { type: 'category', data: cats, axisLabel: { formatter: function (r) { return r; } } }, series: ser };
      },
      get wpgRows() { return this.KW && this.KW.G ? this.KW.G.rows.slice().sort(function (a, b) { return (b.nKa || 0) - (a.nKa || 0); }) : []; },
      insFor: function (tags) { return this.$store.bb.INS.filter(function (i) { return i.tag.some(function (t) { return tags.indexOf(t) >= 0; }); }); },
      clickSik: function (d) { if (d && d.name) this.$store.bb.open('relasi', d.name); }
    };
  });

  /* ---------- Hari ini: KPI utama + pengecualian pada tanggal pilihan (bawaan = tanggal terakhir yang tercakup semua sumber) ---------- */
  var d10 = function (v) { return String(v || '').slice(0, 10); };
  var dayDiff = function (a, b) { return Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5); };
  /** REAL_HAMBATAN harian saja: baris "Tidak (rekap bulanan)" bertanggal tanggal 1 dan bukan kejadian hari itu. */
  var harian = function (H) { return (H || []).filter(function (h) { return /^ya/i.test(String(h.tanggal_tercatat || '')); }); };
  var nosOf = function (v) { return String(v || '').toUpperCase().split(/[-/]/).map(function (x) { return x.trim(); }).filter(Boolean); };
  Alpine.data('vBbHariIni', function () {
    return {
      day: '', open: {}, nLate: 10,
      init: function () {
        var p = this.$store.app.params || {}; if (/^\d{4}-\d{2}-\d{2}$/.test(p.d || '')) this.day = p.d;
        this.$store.bb.need(['core', 'perjalanan', 'terminal', 'hambatan']);
      },
      get N() { return this.$store.bb.north; },
      /** Filter tanpa batas bulan: tanggal dipilih bebas di rentang data. */
      get Fd() { return Object.assign({}, this.$store.bb.F, { m0: 1, m1: 12 }); },
      /** Tanggal terakhir per sumber ("data s.d.") — dari baris yang lolos saringan wilayah/pemilik/muatan. */
      get SRC() {
        var bb = this.$store.bb, Fd = this.Fd; if (!bb.KW) return null;
        return bb.memo('hiSrc', function () {
          var mx = function (L, f) { return L.reduce(function (a, r) { var v = f(r); return v && v > a ? v : a; }, ''); }, mn = function (L, f) { return L.reduce(function (a, r) { var v = f(r); return v && (!a || v < a) ? v : a; }, ''); };
          var P = BBK.perjalanan(Fd) || [], T = BBK.terminal(Fd) || [], H = harian(BBK.hambatan(Fd)), G = bb.gangguan(true);
          var tD = function (r) { return d10(r.mulai_muat || r.mulai_bongkar); };
          var L = [{ id: 'pj', n: 'Perjalanan', s: 'REAL_PERJALANAN', d0: mn(P, function (r) { return r.tanggal; }), d: mx(P, function (r) { return r.tanggal; }) },
            { id: 'tm', n: 'Terminal', s: 'REAL_TERMINAL', d0: mn(T, tD), d: mx(T, tD) },
            { id: 'hb', n: 'Hambatan', s: 'REAL_HAMBATAN', d0: mn(H, function (r) { return r.tanggal; }), d: mx(H, function (r) { return r.tanggal; }) },
            { id: 'gg', n: 'Gangguan KA batubara', s: 'Gangguan_Induk', d0: mn(G, function (r) { return r.date; }), d: mx(G, function (r) { return r.date; }) }];
          var have = L.filter(function (x) { return x.d; }), common = have.reduce(function (a, x) { return !a || x.d < a ? x.d : a; }, '');
          var lo = have.reduce(function (a, x) { return !a || x.d0 < a ? x.d0 : a; }, ''), hi = have.reduce(function (a, x) { return x.d > a ? x.d : a; }, '');
          return { L: L, common: common, lo: lo, hi: hi };
        });
      },
      get sel() { var S = this.SRC; if (!S) return ''; var d = this.day; return d && d >= S.lo && d <= S.hi ? d : S.common; },
      /** Sumber yang belum mencakup tanggal terpilih → lencana kuning, angka sumber itu "tidak tercatat". */
      cover: function (x) { return x.d && x.d0 && this.sel >= x.d0 && this.sel <= x.d; },
      shift: function (n) { var S = this.SRC; if (!S) return; var t = new Date(Date.parse(this.sel + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10); if (t >= S.lo && t <= S.hi) this.day = t; this.open = {}; },
      setDay: function (v) { this.day = v; this.open = {}; this.nLate = 10; },
      get D() {
        var bb = this.$store.bb, last = this.sel, Fd = this.Fd, S = this.SRC; if (!bb.KW || !last) return null;
        var cov = {}; S.L.forEach(function (x) { cov[x.id] = !!(x.d && last >= x.d0 && last <= x.d); });
        return bb.memo('hariini|' + last, function () {
          var P = BBK.perjalanan(Fd) || [], T = BBK.terminal(Fd) || [], Hall = harian(BBK.hambatan(Fd)), Gall = bb.gangguan(true);
          var near = function (d) { return d && Math.abs(dayDiff(d, last)) <= 1; };
          var day = P.filter(function (r) { return r.tanggal === last; }), run = day.filter(function (r) { return !r.batal; });
          // Terminal: kegiatan yang dimulai pada tanggal itu, pra+inti+pasca dibanding SOP kontrak (K.sop)
          var wtt = [], nAct = 0, sopRow = function (r, u) {
            var rel = r.stasiun_muat + '-' + r.stasiun_bongkar, ids = ['pra_' + u, u, 'pasca_' + u], real = 0, sop = 0, ok = true, sopOk = true, st = u === 'muat' ? r.stasiun_muat : r.stasiun_bongkar;
            ids.forEach(function (id) { var v = r[id]; if (v == null || isNaN(v)) ok = false; else real += +v; var x = BBK.sop(rel, st, id); if (x == null) sopOk = false; else sop += x; });
            return { ka: r.no_ka, st: st, uj: u, rel: rel, real: ok ? real : null, sop: sopOk ? sop : null, d: ok && sopOk ? real - sop : null, mulai: u === 'muat' ? r.mulai_muat : r.mulai_bongkar, selesai: u === 'muat' ? r.selesai_muat : r.selesai_bongkar };
          };
          T.forEach(function (r) { ['muat', 'bongkar'].forEach(function (u) { if (d10(r['mulai_' + u]) !== last) return; nAct++; var x = sopRow(r, u); if (x.d != null && x.d > 0) wtt.push(x); }); });
          wtt.sort(function (a, b) { return b.d - a.d; });
          var H = Hall.filter(function (h) { return h.tanggal === last; }).sort(function (a, b) { return (b.menit || 0) - (a.menit || 0); });
          var G = Gall.filter(function (r) { return r.date === last; });
          // Rantai per KA: perjalanan → terminal → hambatan → gangguan (KA sama, tanggal ±1 hari)
          var late = [];
          run.forEach(function (r) {
            var tb = BBK.otpTol(BBK.divOf(r.asal), 'brk'), tt = BBK.otpTol(BBK.divOf(r.tujuan), 'tiba');
            var lb = typeof r.lambat_brk === 'number' && r.lambat_brk > tb ? r.lambat_brk : null, lt = typeof r.lambat_tiba === 'number' && r.lambat_tiba > tt ? r.lambat_tiba : null;
            if (lb == null && lt == null) return;
            var nos = nosOf(r.no_ka), has = function (v) { return nosOf(v).some(function (n) { return nos.indexOf(n) >= 0; }); };
            var tc = []; T.forEach(function (t) { if (!has(t.no_ka)) return; ['muat', 'bongkar'].forEach(function (u) { if (near(d10(t['mulai_' + u]))) tc.push(sopRow(t, u)); }); });
            tc.sort(function (a, b) { return String(a.mulai).localeCompare(String(b.mulai)); });
            // REAL_HAMBATAN tidak mencatat nomor KA → dikaitkan lewat terminal & jenis kegiatan yang sama pada tanggal mulai kegiatan
            var hk = {}; tc.forEach(function (t) { hk[t.st + '|' + (t.uj === 'muat' ? 'MUAT' : 'BONGKAR') + '|' + d10(t.mulai)] = 1; });
            var hc = Hall.filter(function (h) { return hk[String(h.lokasi || '').split('-')[0] + '|' + h.jenis + '|' + h.tanggal] || (h.no_ka && has(h.no_ka) && near(h.tanggal)); }).sort(function (a, b) { return (b.menit || 0) - (a.menit || 0); }), gc = Gall.filter(function (g) { return near(g.date) && has(g.ka); });
            late.push({ ka: r.no_ka, rel: r.asal + '–' + r.tujuan, mut: r.muatan, lb: lb, lt: lt, tb: tb, tt: tt, brk: r.brk_prog + ' → ' + (r.brk_real || '–'), tiba: r.tiba_prog + ' → ' + (r.tiba_real || '–'), max: Math.max(lb || 0, lt || 0),
              tc: tc, hc: hc, hm: BBK.sum(hc, function (h) { return h.menit; }), gc: gc, gm: BBK.sum(gc, function (g) { return g.menit; }), links: tc.length + hc.length + gc.length });
          });
          late.sort(function (a, b) { return b.max - a.max; });
          return { last: last, n: day.length, run: run.length, batal: day.length - run.length, late: late, nLink: late.filter(function (x) { return x.links; }).length, wtt: wtt, nT: nAct, H: H, hMenit: BBK.sum(H, function (h) { return h.menit; }), G: G, cov: cov };
        });
      },
      toggle: function (k) { var o = Object.assign({}, this.open); o[k] = !o[k]; this.open = o; },
      dur: function (m) { return m == null ? '–' : BBK.fmt.dur(m); },
      sign: function (d) { return (d > 0 ? '+' : d < 0 ? '−' : '±') + BBK.fmt.dur(Math.abs(d)); },
      get compOpt() {
        var N = this.N; if (!N) return null;
        var cat = N.comp.map(function (c) { return c.n; });
        return { tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: function (v) { return BBK.fmt.dur(v); } }, legend: { bottom: 0 },
          grid: { left: 14, right: 24, top: 10, bottom: 40, containLabel: true }, yAxis: { type: 'category', data: cat, inverse: true }, xAxis: { type: 'value', axisLabel: { formatter: function (v) { return Math.round(v / 60) + ' jam'; } } },
          series: [{ name: 'Program GAPEKA', type: 'bar', data: N.comp.map(function (c) { return Math.round(c.prog); }), itemStyle: { color: '#A8B3C7' }, barGap: '10%' },
            { name: 'Realisasi', type: 'bar', data: N.comp.map(function (c) { return { value: Math.round(c.real), itemStyle: { color: c.d > 0 ? '#C0392B' : '#1F8A2E' } }; }) }] };
      },
      goWhy: function (tab) { this.$store.app.go('bb-siklus', { tab: tab }); }
    };
