        series.push({ type: 'scatter', data: [], silent: true, markArea: { silent: true, data: mark } });
        return {
          animation: false, legend: { top: 0 }, grid: { left: 108, right: 14, top: 36, bottom: 50 },
          tooltip: { trigger: 'item', confine: true, formatter: function (p) { return p.data && p.data.no ? '<b>KA ' + p.data.no + '</b> ' + (p.data.nama || '') + (p.data.est ? '<br><i>sebagian jam = interpolasi</i>' : '') : ''; } },
          xAxis: { type: 'value', min: 0, max: 1440, interval: 120, axisLabel: { formatter: function (v) { return hh(v); } }, splitLine: { lineStyle: { color: '#EEF2F7' } } },
          yAxis: { type: 'value', min: 0, max: Math.ceil(C.len), inverse: true, axisLabel: { customValues: anchors.map(function (s) { return s.km; }), formatter: function (v) { return names[Math.round(v * 1000)] || ''; }, fontSize: 10.5 },
            axisTick: { customValues: anchors.map(function (s) { return s.km; }) }, splitLine: { show: false } },
          dataZoom: [{ type: 'inside', xAxisIndex: 0, yAxisIndex: 0, zoomOnMouseWheel: 'ctrl', filterMode: 'none' }, { type: 'slider', xAxisIndex: 0, height: 16, bottom: 6, brushSelect: false, showDetail: false, borderColor: '#D8DEEA', filterMode: 'none' }],
          series: series
        };
      },
      onMareyClick: function (p) { if (p && p.data && p.data.no) this.$store.app.open('ka', p.data.no); },
      revOpt: function () {
        var C = this.C, B = this.B, mon = C.mon.filter(function (m) { return B.revYms.indexOf(m.ym) >= 0; });
        return {
          legend: { top: 0 }, grid: { left: 22, right: 22, top: 40, bottom: 8, containLabel: true },
          tooltip: { trigger: 'axis', formatter: function (ps) { return KAI.fmt.month(mon[ps[0].dataIndex].ym) + '<br>' + ps.map(function (p) { return p.marker + p.seriesName + ': ' + (p.seriesIndex < 2 ? KAI.fmt.rp(p.value * 1e9) : KAI.fmt.n(p.value)); }).join('<br>'); } },
          xAxis: { type: 'category', data: mon.map(function (m) { return KAI.fmt.mon(m.ym); }) },
          yAxis: [{ type: 'value', name: 'Rp miliar', nameLocation: 'middle', nameGap: 46 }, { type: 'value', name: 'Penumpang', nameLocation: 'middle', nameGap: 54, splitLine: { show: false } }],
          series: [
            { name: 'Penumpang (Rp)', type: 'bar', stack: 'r', color: '#252271', barMaxWidth: 30, data: mon.map(function (m) { return Math.round(m.revP / 1e8) / 10; }) },
            { name: 'Barang (Rp)', type: 'bar', stack: 'r', color: '#F06A25', barMaxWidth: 30, data: mon.map(function (m) { return Math.round(m.revB / 1e8) / 10; }) },
            { name: 'Penumpang (orang)', type: 'line', yAxisIndex: 1, color: '#0F766E', symbolSize: 6, data: mon.map(function (m) { return Math.round(m.pax); }) }
          ]
        };
      },
      kaBarOpt: function () {
        var L = this.kaAll.filter(function (r) { return r.revA > 0; }).slice(0, 10).reverse();
        return {
          grid: { left: 8, right: 70, top: 36, bottom: 8, containLabel: true },
          tooltip: { trigger: 'item', formatter: function (p) { var r = L[p.dataIndex]; return '<b>' + r.no + ' ' + r.nama + '</b><br>Alokasi ' + KAI.fmt.rp(r.revA) + '<br>Penuh ' + KAI.fmt.rp(r.rev) + ' · porsi km ' + KAI.fmt.d1(r.share * 100) + '%'; } },
          xAxis: { type: 'value', axisLabel: { formatter: function (v) { return KAI.fmt.n(v / 1e9); } }, name: 'Rp miliar', nameLocation: 'middle', nameGap: 26 },
          yAxis: { type: 'category', data: L.map(function (r) { return (r.jenis === 'BARANG' ? r.nama : r.no + ' ' + r.nama).slice(0, 26); }), axisLabel: { width: 170, overflow: 'truncate' } },
          series: [{ type: 'bar', barMaxWidth: 16, data: L.map(function (r) { return { value: r.revA, id: r.id, itemStyle: { color: r.jenis === 'BARANG' ? '#F06A25' : '#252271', borderRadius: [0, 4, 4, 0] } }; }),
            label: { show: true, position: 'right', fontSize: 11, formatter: function (p) { return KAI.fmt.d1(p.value / 1e9) + ' M'; } } }]
        };
      },
      elevOpt: function () {
        var D = this.D, pts = D.ST.filter(function (s) { return s.z != null; });
        return {
          grid: { left: 8, right: 12, top: 34, bottom: 8, containLabel: true },
          tooltip: { trigger: 'item', formatter: function (p) { var s = pts[p.dataIndex]; return s ? '<b>' + s.name + '</b><br>km ' + KAI.fmt.d1(s.km) + ' · ' + s.z + ' m dpl' : ''; } },
          xAxis: { type: 'value', min: 0, max: Math.ceil(this.C.len), name: 'km', nameLocation: 'middle', nameGap: 22 }, yAxis: { type: 'value', name: 'm dpl' },
          series: [{ type: 'line', data: pts.map(function (s) { return [s.km, s.z]; }), color: '#B45309', symbolSize: 5, areaStyle: { color: 'rgba(180,83,9,.12)' } }]
        };
      }
    };
  });
});
</script>
