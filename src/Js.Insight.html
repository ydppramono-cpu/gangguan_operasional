<script>
/**
 * Js.Insight — insight otomatis (selalu dari angka yang bisa dilacak) dan rekomendasi.
 * Rekomendasi hanya muncul bila pemicunya ada di data terpilih. Rujukan ilmiah di LIT sudah diperiksa
 * ke sumber aslinya (Okt 2026); "inti" = temuan yang benar-benar dinyatakan sumber, bukan tafsiran bebas.
 */
(function (root) {
  var LIT = {
    morrissey1980: { cite: 'Morrissey (FRA, 1980)', title: 'Effectiveness of Flashing Lights and Flashing Lights with Gates in Reducing Accident Frequency at Public Rail-Highway Crossings, 1975–1978 (FRA-RRS-80-005)',
      url: 'https://rosap.ntl.bts.gov/view/dot/10246', inti: 'Pemasangan lampu kilat di perlintasan pasif menurunkan kecelakaan 65%; lampu kilat + palang 84%; menambah palang pada perlintasan yang sudah berlampu 64%.' },
    evans2011: { cite: 'Evans (2011), Accident Analysis & Prevention 43(5)', title: 'Fatal accidents at railway level crossings in Great Britain 1946–2009',
      url: 'https://trid.trb.org/View/1106619', inti: 'Perlintasan yang dikendalikan petugas KA paling aman; laju kecelakaan fatal di perlintasan pasif konstan ±0,9 per 1.000 perlintasan per tahun — risikonya tidak turun tanpa intervensi.' },
    evans2019: { cite: 'Evans & Hughes (2019), Accident Analysis & Prevention 129', title: 'Traverses, delays and fatalities at railway level crossings in Great Britain',
      url: 'https://doi.org/10.1016/j.aap.2019.05.006', inti: 'Perlintasan yang dijaga ±10× lebih aman daripada otomatis tetapi menambah tundaan jalan; pejalan kaki di perlintasan pasif paling berisiko.' },
    singh2022: { cite: 'Singh dkk. (2022), Reliability Engineering & System Safety 220', title: 'Exact and heuristic optimization methods for safety improvement projects at level crossings under conflicting objectives',
      url: 'https://doi.org/10.1016/j.ress.2021.108296', inti: 'Dengan anggaran terbatas, pilih lokasi dan jenis penanganan JPL lewat optimasi dua tujuan: keparahan bahaya vs tundaan lalu lintas.' },
    fhwa2019: { cite: 'FHWA/FRA (2019), FHWA-SA-18-040', title: 'Highway-Rail Crossing Handbook, 3rd Edition',
      url: 'https://highways.dot.gov/safety/hsip/xings/highway-rail-crossing-handbook-third-edition', inti: 'Panduan memilih perlakuan rekayasa JPL (perangkat peringatan, geometri, penutupan) sesuai kondisi lokasi.' },
    varley2018: { cite: 'Varley (2018), Departemen Transportasi Inggris', title: 'Network Rail vegetation management review: Valuing nature',
      url: 'https://www.gov.uk/government/publications/network-rail-vegetation-management-review-valuing-nature-a-railway-for-people-and-wildlife',
      inti: 'Vegetasi tepi jalur harus dikelola seperti aset operasional (kondisi diketahui, ada rencana & target). Insiden vegetasi naik dari ±11.500 (2009/10) ke ±19.000 (2017/18).' },
    kamalian2025: { cite: 'Kamalian dkk. (2025), Reliability Engineering & System Safety 262', title: 'Impact of climate-driven extreme weather events on UK train delays: a data-driven Bayesian network approach',
      url: 'https://doi.org/10.1016/j.ress.2025.111189', inti: 'Banjir berat berdampak besar pada keandalan operasi; risiko keterlambatan akibat cuaca ekstrem terkonsentrasi pada bulan tertentu — rencana adaptasi perlu berbasis musim dan wilayah.' },
    ferranti2017: { cite: 'Ferranti dkk. (2017), Meteorological Applications', title: 'The hottest July day on the railway network: insights and thoughts for the future',
      url: 'https://doi.org/10.1002/met.1681', inti: 'Cuaca memicu kegagalan aset (persinyalan 57% insiden panas 2006–2013). Disarankan menambah kata kunci cuaca di catatan gangguan dan memantau kondisi aset secara real-time.' },
    oskouei2024: { cite: 'Oskouei dkk. (2024), Scientific Reports 14', title: 'Identifying critical components for railways rolling stock reliability: a case study for Iran',
      url: 'https://doi.org/10.1038/s41598-024-62841-2', inti: 'Subsistem bogie paling kritis. Mempercepat perbaikan (MTTR) dan memprioritaskan suku cadang komponen kritis paling efektif menaikkan keandalan.' },
    corman2017: { cite: 'Corman dkk. (2017), Proc. IMechE Part O 231(5)', title: 'Optimizing preventive maintenance policy: a data-driven application for a light rail braking system',
      url: 'https://doi.org/10.1177/1748006X17712662', inti: 'Interval perawatan preventif yang dioptimasi dari data kegagalan (Weibull) memberi keandalan & ketersediaan sama dengan biaya perawatan 30% lebih rendah.' },
    conradie2015: { cite: 'Conradie dkk. (2015), South African Journal of Industrial Engineering 26(2)', title: 'Quantifying system reliability in rail transportation in an ageing fleet environment',
      url: 'https://doi.org/10.7166/26-2-1076', inti: 'Keandalan armada tua dikuantifikasi dari statistik kegagalan per sistem dan dipakai untuk merencanakan perawatan.' },
    comet2025: { cite: 'CoMET / Imperial College London (2025)', title: 'Research: Performance of New Fleets',
      url: 'https://communityofmetros.org/tag/reliability/', inti: 'Keandalan sarana mengikuti kurva bak mandi selama ±40 tahun umur: laju kegagalan naik lagi menjelang paruh dan akhir umur.' },
    liu2014: { cite: 'Liu dkk. (2014), ASCE Journal of Transportation Engineering 140(10)', title: 'Optimization of ultrasonic rail-defect inspection for improving railway transportation safety and efficiency',
      url: 'https://doi.org/10.1061/(ASCE)TE.1943-5436.0000697', inti: 'Rel patah adalah penyebab anjlokan tersering; frekuensi uji ultrasonik optimal bergantung pada kepadatan lalu lintas dan umur rel.' },
    zhou2002: { cite: 'Zhou dkk. (2002), Computing & Control Engineering Journal 13(5)', title: 'Remote condition monitoring and validation of railway points',
      url: 'https://doi.org/10.1049/cce:20020501', inti: 'Pemantauan kondisi jarak jauh peralatan wesel/trackside menurunkan peluang kegagalan dan memperbaiki mutu layanan.' },
    dimitrova2025: { cite: 'Dimitrova & Dimitrov (2025), Applied Sciences 15(8)', title: 'Methodology for studying the reliability of interlocking devices in Bulgarian Railways',
      url: 'https://doi.org/10.3390/app15084178', inti: 'Nilai keandalan persinyalan dengan MTBF dan ketersediaan, bukan hanya jumlah & lama gangguan — agar keputusan perawatan/modernisasi tidak keliru.' }
  };

  function share(a, b) { return b ? a / b : 0; }
  function pctTxt(v) { return KAI.fmt.d1(v * 100) + '%'; }
  function pad2(h) { return (h < 10 ? '0' : '') + h; }
  function sumM(L) { return KAIA.sum(L, function (r) { return r.menit; }); }
  function ids(L) { return L.map(function (r) { return r.id; }); }

  /**
   * Hasil analisis = daftar TEMUAN. Setiap temuan menyebut sumber datanya (grafik/tabel tempat angka itu bisa dilihat)
   * dan — bila temuan itu memicu tindakan — membawa REKOMENDASI pasangannya. Tidak ada rekomendasi tanpa temuan.
   *
   * ctx: { L, Lprev, Lyoy, prevLabel, yoyLabel, cfg, R (ref, opsional), inv (inventaris perlintasan, opsional),
   *        traffic (KA/hari, opsional), days (panjang periode, opsional), kind ('global' | jenis profil), name }
   */
  function analyze(ctx) {
    var L = ctx.L || [], cfg = ctx.cfg, F = KAI.fmt, out = [], prof = ctx.kind && ctx.kind !== 'global';
    var S = KAIA.stat(L);
    function src(label, route, profLabel) { return prof ? { label: profLabel || label } : { label: label, route: route }; }
    function add(o) { o.id = 'T' + (out.length + 1); out.push(o); return o; }
    if (!S.n) return finish([], ctx);

    // 1. Perubahan vs pembanding (MoM / periode sebelumnya)
    if (ctx.Lprev) {
      var P0 = KAIA.stat(ctx.Lprev), dm = KAIA.pct(S.menit, P0.menit), dn = KAIA.pct(S.n, P0.n);
      if (P0.n) add({ tone: dm > 0.1 ? 'bad' : dm < -0.1 ? 'good' : 'info', area: 'Tren', src: src('Tabel MoM · YoY · YTD', 'ringkasan', 'Riwayat gangguan'),
        metric: F.pct(dm), head: 'Kelambatan ' + (dm > 0 ? 'naik' : dm < 0 ? 'turun' : 'tetap') + ' vs ' + ctx.prevLabel,
        text: F.n(P0.menit) + ' → ' + F.n(S.menit) + ' menit; frekuensi ' + F.n(P0.n) + ' → ' + F.n(S.n) + ' kejadian (' + F.pct(dn) + ').' + (P0.n < cfg.smallBase ? ' Basis pembanding kecil — baca dengan hati-hati.' : '') });
      else add({ tone: 'warn', area: 'Tren', src: src('Tabel MoM · YoY · YTD', 'ringkasan', 'Riwayat gangguan'), metric: 'Baru',
        head: 'Tidak ada kejadian pada ' + ctx.prevLabel, text: F.n(S.n) + ' kejadian sekarang adalah kemunculan baru.' });
    }
    if (ctx.Lyoy) {
      var Y0 = KAIA.stat(ctx.Lyoy);
      if (Y0.n) { var dy = KAIA.pct(S.menit, Y0.menit);
        add({ tone: dy > 0.1 ? 'bad' : dy < -0.1 ? 'good' : 'info', area: 'Tren', src: src('Tabel MoM · YoY · YTD', 'ringkasan', 'Riwayat gangguan'), metric: F.pct(dy),
          head: 'Kelambatan vs ' + ctx.yoyLabel + ' (YoY)', text: F.n(Y0.menit) + ' → ' + F.n(S.menit) + ' menit; frekuensi ' + F.pct(KAIA.pct(S.n, Y0.n)) + '.' }); }
    }
    // 2. Pareto jenis gangguan
    var tops = KAIA.topOf(L, null, cfg, 3), shTop = share(KAIA.sum(tops, function (t) { return t.menit; }), S.menit);
    if (tops.length >= 2) {
      var fp = add({ tone: shTop >= 0.6 ? 'warn' : 'info', area: 'Umum', src: src('Matriks frekuensi × kelambatan', 'tren', 'Jenis gangguan teratas'), metric: pctTxt(shTop),
        head: tops.length + ' jenis gangguan teratas = ' + pctTxt(shTop) + ' kelambatan',
        text: tops.map(function (t) { return KAI.tc(t.label.replace(/^[^-]+-\s*/, '')) + ' (' + F.n(t.menit) + ' mnt, ' + t.n + '×)'; }).join(' · '),
        ids: [].concat.apply([], tops.map(function (t) { return t.ids; })) });
      if (shTop >= 0.6) fp.rec = { area: 'Umum', title: 'Fokuskan program pada ' + tops.length + ' jenis gangguan teratas',
        actions: ['Tetapkan pemilik (unit kerja) dan target penurunan menit per jenis.', 'Tinjau ulang tiap bulan dengan pembanding MoM/YoY di halaman Ringkasan.'], lit: [] };
    }
    // 3. Kejadian tunggal terbesar
    var big = L.slice().sort(function (a, b) { return b.menit - a.menit; })[0];
    if (big && share(big.menit, S.menit) >= 0.2 && S.n >= 5) add({ tone: 'warn', area: 'Umum', src: src('Daftar kejadian terlama', 'telusuri', 'Riwayat gangguan'),
      metric: pctTxt(share(big.menit, S.menit)), head: 'Satu kejadian mendominasi kelambatan',
      text: KAI.tc(big.judul || big.sub) + (big.lokasi ? ' di ' + big.lokasi : '') + ' (' + F.date(big) + ', ' + F.n(big.menit) + ' mnt). Arah tren bisa berbeda tanpa kejadian ini.', ids: [big.id],
      rec: { area: 'Umum', title: 'Lakukan RCA atas kejadian dominan', actions: ['Susun kronologi, penyebab langsung, dan penyebab dasar (5-Why/fishbone).', 'Tetapkan tindakan korektif dengan pemilik & tenggat; pantau kejadian sejenis 3 bulan ke depan.'], lit: [] } });
    // 4. Kelas dominan
    var bc = KAIA.byClassOf(L), dom = KAIA.CLASSES.slice().sort(function (a, b) { return bc[b].menit - bc[a].menit; })[0];
    if (bc[dom].menit && ctx.kind !== 'sarana') add({ tone: 'info', area: 'Umum', src: src('Grafik tren per kelas', 'tren', 'Komposisi kelas'), metric: pctTxt(share(bc[dom].menit, S.menit)),
      head: 'Kelas terbesar: ' + KAIChart.CLASS_LABEL[dom].split(',')[0].toLowerCase(), text: F.n(bc[dom].n) + ' kejadian, ' + F.n(bc[dom].menit) + ' menit.',
      ids: ids(L.filter(function (r) { return r.kelas === dom; })), hl: { seriesName: KAIChart.CLASS_LABEL[dom] } });
    // 5. Kejadian berat
    var hv = L.filter(function (r) { return r.menit >= cfg.heavy; });
    if (hv.length) add({ tone: share(sumM(hv), S.menit) > 0.5 ? 'warn' : 'info', area: 'Umum', src: src('Kartu KPI kejadian berat', 'ringkasan', 'Riwayat gangguan'),
      metric: pctTxt(share(sumM(hv), S.menit)), head: F.n(hv.length) + ' kejadian ≥ ' + cfg.heavy + ' menit',
      text: pctTxt(share(hv.length, S.n)) + ' dari jumlah kejadian, tetapi ' + pctTxt(share(sumM(hv), S.menit)) + ' dari total kelambatan.', ids: ids(hv) });
    // 6. Lokasi berulang (bukan untuk profil satu lokasi)
    if (ctx.kind !== 'stasiun' && ctx.kind !== 'petak' && ctx.kind !== 'jpl') {
      var locs = KAIA.locations(L, 3);
      if (locs.length) add({ tone: 'warn', area: 'Lokasi', src: src('Lokasi per wilayah', 'wilayah', 'Lokasi berulang'), metric: locs.length + ' lokasi',
        head: 'Lokasi berulang (≥3 kejadian)', text: 'Tertinggi ' + locs[0].lokasi + ' (' + locs[0].n + '×, ' + F.n(locs[0].menit) + ' mnt)' + (locs[1] ? ', lalu ' + locs[1].lokasi + ' (' + locs[1].n + '×)' : '') + '.',
        ids: locs[0].ids, idsOf: 'di ' + locs[0].lokasi, rec: { area: 'Lokasi', title: 'Inspeksi gabungan di lokasi berulang', actions: ['Jadwalkan inspeksi bersama (sarana, prasarana, operasi) di lokasi teratas.', 'Catat temuan per kunjungan dan cocokkan dengan kejadian berikutnya.'], lit: [] } });
    }
    // 7. Pola jam & hari
    var H = KAIA.hourly(L);
    if (H.known >= 20) {
      var best = { s: -1, h: 0 };
      for (var h = 0; h < 24; h++) { var s3 = H.n[h] + H.n[(h + 1) % 24] + H.n[(h + 2) % 24]; if (s3 > best.s) best = { s: s3, h: h }; }
      var sh3 = share(best.s, H.known), win = pad2(best.h) + ':00–' + pad2((best.h + 2) % 24) + ':59';
      var fj = add({ tone: sh3 >= 0.3 ? 'warn' : 'info', area: 'Operasional', src: src('Grafik sebaran jam', 'tren', 'Sebaran jam'), metric: pctTxt(sh3),
        head: 'Jam rawan ' + win, text: 'Memuat ' + pctTxt(sh3) + ' kejadian berjam tercatat (rata-rata jendela 3 jam = 12,5%).', hl: { seriesIndex: 0, dataIndex: [best.h, (best.h + 1) % 24, (best.h + 2) % 24] } });
      if (sh3 >= 0.3) fj.rec = { area: 'Operasional', title: 'Siagakan sumber daya pada jam rawan',
        actions: ['Tempatkan lok/teknisi siaga dan petugas pengamanan pada jam & lokasi ini.', 'Jadwalkan pekerjaan perawatan di luar jam rawan.'], lit: [] };
      var dmax = H.dowN.indexOf(Math.max.apply(null, H.dowN)), dated = KAIA.sum(H.dowN);
      if (dated >= 20) add({ tone: 'info', area: 'Operasional', src: src('Grafik harian', 'tren', 'Sebaran hari'), metric: pctTxt(share(H.dowN[dmax], dated)),
        head: 'Hari terbanyak: ' + KAIA.DOW[dmax], text: 'Dari kejadian bertanggal; rata-rata per hari 14,3%.' });
    }
    if (H.total >= 10 && share(H.total - H.known, H.total) > 0.2) add({ tone: 'warn', area: 'Data', src: src('Mutu data', 'metodologi', 'Mutu data'),
      metric: pctTxt(share(H.total - H.known, H.total)), head: 'Kejadian tanpa jam mulai', text: 'Pola jam belum utuh karena "Jam mulai" kosong/tidak terbaca.',
      rec: { area: 'Data', title: 'Lengkapi isian laporan gangguan', actions: ['Wajibkan "Jam mulai" (HH:MM), "Kilometer" (km+hm), dan nomor JPL untuk kejadian perlintasan.', 'Tambahkan kata kunci cuaca bila relevan.'], lit: ['ferranti2017'] } });
    // 8. Sarana: unit berulang & usia
    // Profil satu unit: temuan tingkat armada (unit berulang, usia armada, komposisi kelas) tidak bermakna → dilewati.
    var oneUnit = ctx.kind === 'sarana';
    var units = oneUnit ? [] : KAIA.unitsOf(L).filter(function (u) { return u.n >= 2; }).sort(function (a, b) { return b.n - a.n || b.menit - a.menit; });
    if (units.length) add({ tone: 'warn', area: 'Sarana', src: src('Tabel sarana berulang', 'sarana', 'Sarana terkait'), metric: units.length + ' unit',
      head: 'Unit sarana dengan ≥2 gangguan', text: 'Tertinggi ' + F.unit(units[0].unit) + ' (' + units[0].n + '×, ' + F.n(units[0].menit) + ' mnt).',
      ids: [].concat.apply([], units.slice(0, 5).map(function (u) { return ids(u.events); })), idsOf: 'dari 5 unit teratas',
      rec: { area: 'Sarana', title: 'RCA per unit berulang dan percepat perbaikan',
        actions: ['Buka profil unit, cek apakah gangguannya sejenis (komponen sama) → RCA dan perbaikan permanen.', 'Ukur MTTR per depo; siapkan suku cadang komponen kritis (bogie, kompresor, kontrol).', 'Sesuaikan interval perawatan preventif dengan data kegagalan, bukan hanya jadwal tetap.'],
        lit: ['oskouei2024', 'corman2017'] } });
    if (!oneUnit && ctx.R && ctx.R.fleetList.length) {
      var sar = L.filter(function (r) { return r.kelas === 'sarana' && r.sarana[0] && ctx.R.fleet[r.sarana[0]]; });
      var old = sar.filter(function (r) { var u = ctx.R.fleet[r.sarana[0]]; return u.age != null && u.age > cfg.ageWarn; });
      if (sar.length >= 5) { var fo = add({ tone: share(old.length, sar.length) > 0.3 ? 'warn' : 'info', area: 'Sarana', src: src('Armada per kelompok usia', 'sarana', 'Sarana terkait'),
        metric: pctTxt(share(old.length, sar.length)), head: 'Gangguan sarana pada unit > ' + cfg.ageWarn + ' tahun',
        text: F.n(old.length) + ' dari ' + F.n(sar.length) + ' gangguan sarana yang nomor unitnya dikenali.', ids: ids(old) });
        if (old.length) fo.rec = { area: 'Sarana', title: 'Rencana overhaul/peremajaan sarana > ' + cfg.ageWarn + ' tahun',
          actions: ['Pantau laju gangguan per 100 unit menurut kelompok usia (Sarana → Armada).', 'Prioritaskan overhaul berbasis kondisi untuk unit tua yang juga berulang; ajukan peremajaan bila laju terus naik.'],
          lit: ['comet2025', 'conradie2015'] }; }
    }
    // 9. Perlintasan
    if (ctx.inv && L.some(function (r) { return r.cross; })) {
      var rep = ctx.inv.points.filter(function (p) { return p.n >= 2; }).sort(function (a, b) { return b.n - a.n; });
      if (rep.length) add({ tone: 'bad', area: 'Perlintasan', src: src('Inventaris JPL', 'perlintasan', 'Tab JPL'), metric: rep.length + ' titik',
        head: 'Titik perlintasan berulang (≥2 kejadian)', text: 'Tertinggi ' + rep[0].label.replace(/ \(titik tidak tercatat\)$/, '') + ' (' + rep[0].n + '×' + (/titik tidak tercatat/.test(rep[0].label) ? '; nomor JPL tidak tercatat' : '') + ').', ids: ids(rep[0].recs), idsOf: 'di titik ini',
        rec: { area: 'Perlintasan', title: 'Tangani JPL berulang dengan urutan prioritas risiko',
          actions: ['Urutkan titik menurut kejadian 12 bulan × KA/hari (Perlintasan → Inventaris JPL).', 'JPL tak terjaga: pasang lampu kilat + palang (EWS) atau tutup/gabungkan JPL liar bersama Dishub/Pemda.', 'JPL terjaga yang tetap berulang: audit waktu tutup palang, jarak pandang, dan disiplin penjaga.'],
          lit: ['morrissey1980', 'evans2011', 'singh2022', 'fhwa2019'] } });
      var unguard = ctx.inv.points.filter(function (p) { return p.jpl && p.jpl.jaga === 'tidak dijaga'; });
      if (unguard.length) add({ tone: 'bad', area: 'Perlintasan', src: src('Inventaris JPL (status penjagaan)', 'perlintasan', 'Tab JPL'), metric: unguard.length + ' titik',
        head: 'Kejadian di JPL tidak dijaga', text: 'Teratas ' + unguard[0].label + '. Status dari daftar 1.404 JPL.', ids: [].concat.apply([], unguard.map(function (p) { return ids(p.recs); })),
        rec: { area: 'Perlintasan', title: 'Naikkan proteksi JPL tak terjaga yang sudah menimbulkan hambatan',
          actions: ['Masukkan titik ini ke program peningkatan keselamatan (bila belum termasuk 190 prioritas).', 'Pilih penjagaan, perangkat otomatis, atau penutupan dengan menimbang tundaan jalan dan risiko.'],
          lit: ['morrissey1980', 'evans2019'] } });
    }
    // 10. Paparan lalu lintas (profil petak/stasiun)
    if (ctx.traffic && ctx.days) add({ tone: 'info', area: 'Operasional', src: { label: 'Jadwal KA (' + ((root.KAI && root.KAI.data && root.KAI.data.ref && root.KAI.data.ref.gapekaLabel) || 'GAPEKA') + ')' }, metric: KAI.fmt.d1(S.n / (ctx.traffic * ctx.days) * 10000),
      head: 'Gangguan per 10.000 perjalanan KA', text: 'Dilalui ±' + F.n(ctx.traffic) + ' perjalanan KA/hari selama ' + F.n(ctx.days) + ' hari.' });
    // 11. Pemicu berbasis teks jenis gangguan → temuan + rekomendasi
    function cnt(re) { return L.filter(function (r) { return re.test((r.sub || '') + ' ' + (r.judul || '')); }); }
    var veg = cnt(/pohon tumbang|pohon|ranting|bambu/i), flood = cnt(/banjir|longsor|genangan|amblas|tergenang/i),
      track = cnt(/rel patah|jalan rel|goyangan|anjlok|geometri|bantalan/i), signal = cnt(/persinyalan|wesel|sinyal|track circuit|axle counter|interlocking/i);
    var txtSrc = src('Daftar kejadian (Subgangguan)', 'telusuri', 'Riwayat gangguan');
    if (veg.length >= 2) add({ tone: 'warn', area: 'Alam', src: txtSrc, metric: veg.length + '×', head: 'Pohon/vegetasi mengganggu perjalanan', text: F.n(sumM(veg)) + ' menit kelambatan.', ids: ids(veg),
      rec: { area: 'Alam', title: 'Kelola vegetasi tepi jalur sebagai aset', actions: ['Petakan petak dengan pohon tumbang berulang; inspeksi & pangkas sebelum musim hujan.', 'Tetapkan zona tindakan (segera/tindak/pantau) dan target per petak.'], lit: ['varley2018'] } });
    if (flood.length) add({ tone: 'warn', area: 'Alam', src: txtSrc, metric: flood.length + '×', head: 'Banjir/longsor/genangan', text: F.n(sumM(flood)) + ' menit kelambatan.', ids: ids(flood),
      rec: { area: 'Alam', title: 'Operasi berbasis ambang cuaca di titik rawan', actions: ['Daftarkan titik & bulan rawan dari histori; siapkan pembatasan kecepatan/penahanan KA saat ambang curah hujan terlampaui.', 'Catat kata kunci cuaca di setiap laporan gangguan agar dampaknya terukur.'], lit: ['kamalian2025', 'ferranti2017'] } });
    if (track.length) add({ tone: 'warn', area: 'Prasarana', src: txtSrc, metric: track.length + '×', head: 'Jalan rel/rel patah/goyangan/anjlok', text: F.n(sumM(track)) + ' menit kelambatan.', ids: ids(track),
      rec: { area: 'Prasarana', title: 'Frekuensi pemeriksaan rel mengikuti kepadatan lalu lintas', actions: ['Naikkan frekuensi uji ultrasonik & geometri di petak padat dan rel tua yang berulang.', 'Gabungkan data gangguan dengan hasil inspeksi untuk prioritas penggantian rel.'], lit: ['liu2014'] } });
    if (signal.length >= 2) add({ tone: 'warn', area: 'Prasarana', src: txtSrc, metric: signal.length + '×', head: 'Gangguan persinyalan/wesel', text: F.n(sumM(signal)) + ' menit kelambatan.', ids: ids(signal),
      rec: { area: 'Prasarana', title: 'Pemantauan kondisi wesel & persinyalan, nilai dengan MTBF', actions: ['Pasang/aktifkan pemantauan kondisi pada wesel yang sering gagal.', 'Laporkan MTBF dan ketersediaan per peralatan, bukan hanya jumlah gangguan.'], lit: ['zhou2002', 'dimitrova2025'] } });
    return finish(out, ctx);
  }

  var TONE_RANK = { bad: 0, warn: 1, info: 2, good: 3 };
  function finish(list, ctx) {
    // Di halaman profil (satu entitas), rekomendasi umum tanpa rujukan tidak menambah keputusan → disembunyikan; temuannya tetap tampil.
    if (ctx && ctx.kind && ctx.kind !== 'global') list.forEach(function (x) { if (x.rec && x.rec.area === 'Umum' && !(x.rec.lit && x.rec.lit.length)) delete x.rec; });
    var pairs = list.filter(function (x) { return x.rec; }).sort(function (a, b) { return TONE_RANK[a.tone] - TONE_RANK[b.tone]; });
    pairs.forEach(function (x, i) { x.rec.no = 'R' + (i + 1); x.rec.from = x.id; });
    var context = list.filter(function (x) { return !x.rec; });
    return { findings: list, pairs: pairs, context: context, recs: pairs.map(function (x) { return x.rec; }),
      insights: list.map(function (x) { return { tone: x.tone, text: x.head + ': ' + x.text, ids: x.ids }; }) };
  }

  root.KAIInsight = { analyze: analyze, LIT: LIT };
