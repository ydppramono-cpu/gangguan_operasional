<!-- View.BbSiklus — Batubara › Penyebab: "Waktu hilang di mana dan kenapa?" (siklus, terminal, hambatan, awak, gangguan KA batubara) -->
<template x-if="$store.app.route === 'bb-siklus'">
  <section class="view bb" x-data="vBbSiklus">
    <?!= include('Part.BbFilter'); ?>
    <div class="tabs mt" role="tablist">
      <button role="tab" :aria-selected="tab === 'tahap'" @click="tab = 'tahap'">8 tahap siklus</button>
      <button role="tab" :aria-selected="tab === 'terminal'" @click="tab = 'terminal'">Kinerja terminal</button>
      <button role="tab" :aria-selected="tab === 'hambatan'" @click="tab = 'hambatan'">Hambatan & PIC</button>
      <button role="tab" :aria-selected="tab === 'awak'" @click="tab = 'awak'">Awak</button>
      <button role="tab" :aria-selected="tab === 'gangguan'" @click="tab = 'gangguan'" x-text="'Gangguan KA batubara' + (G.length ? ' (' + G.length + ')' : '')"></button>
    </div>

    <div x-show="tab === 'tahap'" class="mt">
      <div class="card"><div class="card-h"><div><h3>Delapan tahap siklus terhadap batas</h3><p x-text="'Gabungan relasi terpilih · ' + $store.bb.f.stat.replace('mean','rata-rata') + ' per tahap · garis hitam = batas SOP kontrak / program · merah = melewati batas'"></p></div></div>
        <div class="card-b fill"><div class="chart" x-chart="tab === 'tahap' ? stageOpt : null"></div></div></div>
      <div class="card mt"><div class="card-h"><div><h3>Tahap mana yang melewati batas, di relasi mana</h3><p>Selisih menit terhadap batas (merah = lewat, hijau = di bawah) · relasi diurut menurut hari tertahan · klik relasi untuk profil</p></div></div>
        <div class="card-b tbl-wrap"><table class="tbl bb-heat"><thead><tr><th>Relasi</th><template x-for="s in heat.st" :key="s.id"><th class="num" x-text="s.n"></th></template><th class="num">Lewat / siklus</th><th class="num">Siklus</th></tr></thead>
          <tbody><template x-for="(o, i) in heat.rels" :key="o.rel"><tr class="click" @click="$store.bb.open('relasi', o.rel)"><td><b x-text="o.rel"></b></td>
            <template x-for="(v, j) in heat.cells[i]" :key="j"><td class="num" :style="'background:' + heatBg(v)" x-text="v == null ? '–' : (v > 0 ? '+' : '') + v"></td></template>
            <td class="num"><b x-text="BBK.fmt.dur(o.lewat)"></b></td><td class="num" x-text="KAI.fmt.n(o.nKa)"></td></tr></template></tbody></table></div></div>
    </div>

    <div x-show="tab === 'terminal'" class="mt">
      <div class="card"><div class="card-h"><div><h3>Kinerja terminal muat & bongkar</h3><p>Indeks 0–100 dari 4 komponen berbobot sama: kepatuhan SOP WTT · ketepatan melepas KA · KA terlayani vs program · keandalan alat · klik untuk profil</p></div></div>
        <div class="card-b tbl-wrap"><table class="tbl"><thead><tr><th>Terminal</th><th>Peran</th><th class="num">KA</th><th class="num">WTT</th><th class="num">SOP</th><th class="num">Pola</th><th>Indeks</th><th>SOP WTT</th><th>Melepas KA</th><th>Terlayani</th><th>Alat</th></tr></thead>
          <tbody><template x-for="x in KT" :key="x.st + x.uj"><tr class="click" @click="$store.bb.open('terminal', x.st)">
            <td><b x-text="$store.bb.stName(x.st)"></b> <span class="muted" x-text="x.st"></span></td><td x-text="x.uj"></td><td class="num" x-text="KAI.fmt.n(x.n)"></td>
            <td class="num"><b :style="x.sop != null && x.wtt > x.sop ? 'color:#C0392B' : ''" x-text="BBK.fmt.dur(x.wtt)"></b></td><td class="num" x-text="BBK.fmt.dur(x.sop)"></td><td class="num" x-text="BBK.fmt.dur(x.pola)"></td>
            <td><span class="bb-idx" :style="'--v:' + bar(x.indeks) + '%;--c:' + (x.indeks >= 80 ? '#1F8A2E' : x.indeks >= 65 ? '#E0861A' : '#C0392B')"><i></i><b x-text="x.indeks != null ? KAI.fmt.n(x.indeks) : '–'"></b></span></td>
            <template x-for="k in ['s1','s2','s3','s4']" :key="k"><td><span class="bb-mini" :style="'--v:' + bar(x[k]) + '%'" :title="x[k] != null ? KAI.fmt.n(x[k]) : 'tidak tercatat'"><i></i></span></td></template></tr></template></tbody></table></div>
        <div x-data="{ get L() { return insFor(['terminal', 'alat']); } }"><?!= include('Part.BbPita'); ?></div></div>
    </div>

    <div x-show="tab === 'hambatan'" class="mt">
      <div class="grid g-2-1">
        <div class="card"><div class="card-h"><div><h3>Hambatan per terminal dan fase</h3><p>Jam hambatan tercatat (REAL_HAMBATAN) · pra / inti / pasca</p></div></div>
          <div class="card-b fill"><div class="chart tall" x-chart="tab === 'hambatan' ? hamOpt : null" @chart-click="term = String($event.detail.name || '').split(' ')[0]"></div></div></div>
        <div class="card"><div class="card-h"><div><h3>Top 3 & worst 3 beserta PIC</h3><p x-text="term ? 'Terminal ' + $store.bb.stName(term) : 'Semua terminal · klik batang untuk satu terminal'"></p></div>
            <span class="spacer"></span><button class="link-btn sm" x-show="term" @click="term = ''">Semua</button></div>
          <div class="card-b">
            <div class="bb-tw-h">Paling sering</div>
            <template x-for="o in tw.top" :key="'t' + o.kode"><div class="bb-tw"><b x-text="o.kode"></b><span x-text="o.nama"></span><em x-text="KAI.fmt.n(o.f) + '× · PIC ' + o.picUtama"></em></div></template>
            <div class="bb-tw-h mt-s">Menit terbesar</div>
            <template x-for="o in tw.worst" :key="'w' + o.kode"><div class="bb-tw"><b x-text="o.kode"></b><span x-text="o.nama"></span><em x-text="KAI.fmt.n(o.m) + ' menit · PIC ' + o.picUtama"></em></div></template>
          </div></div>
      </div>
    </div>

    <div x-show="tab === 'awak'" class="mt">
      <template x-if="AW"><div>
        <p class="note story" x-text="'Dinasan masinis KA batubara (Buku Dinasan O.20 GAPEKA 2025) dihubungkan dengan realisasi keterlambatan KA yang sama (' + $store.bb.periodTxt() + '). Angka perkiraan = jam dinas program + keterlambatan datang; belum ada regulasi batas maksimal jam dinas di DB, jadi status melewati batas belum ditampilkan.'"></p>
        <div class="grid g-4 mt-s">
          <div class="card kpi"><div class="lbl">Dinasan KA batubara</div><div class="val num" x-text="KAI.fmt.n(AW.n)"></div><div class="note" x-text="AW.nUpt + ' UPT crew · median ' + BBK.fmt.dur(AW.med) + ' per dinasan'"></div></div>
          <div class="card kpi" style="--kpi-c:var(--kai-navy)"><div class="lbl">Porsi dinas malam</div><div class="val num" x-text="BBK.fmt.pct0(AW.nitePct)"></div><div class="note">menit dinas di antara 22.00–06.00 (definisi tampilan)</div></div>
          <div class="card kpi" :style="AW.siap ? '--kpi-c:var(--warn)' : '--kpi-c:var(--good)'"><div class="lbl">Hadir &lt; 60 menit sebelum berangkat</div><div class="val num" x-text="KAI.fmt.n(AW.siap)"></div><div class="note">dinasan · SOP Pengoperasian KA 2025 Bab II C.2.a</div></div>
          <div class="card kpi" style="--kpi-c:var(--bad)"><div class="lbl">Paling berisiko molor <em class="tag warn" style="height:18px">perkiraan</em></div><div class="val" style="font-size:18px" x-text="AW.top ? 'KA ' + AW.top.no + ' · +' + BBK.fmt.dur(AW.top.add85) : '–'"></div>
            <div class="note" x-text="AW.top ? AW.top.upt + ' kode ' + AW.top.kode + ' · program ' + BBK.fmt.dur(AW.top.dur) + ' → P85 ' + BBK.fmt.dur(AW.top.est85) : 'tidak tercatat'"></div></div>
        </div>
        <div class="xf-bar mt" x-show="upt"><span class="note">Disaring:</span><button type="button" class="chip on" @click="upt = ''"><span x-text="upt"></span> ✕</button></div>
        <div class="grid g-2 mt">
          <div class="card"><div class="card-h"><div><h3>Beban per UPT crew</h3><p>Jam dinas program per hari · siang/malam · klik UPT untuk menyaring semua grafik &amp; tabel</p></div></div>
            <div class="card-b fill"><div class="chart" x-chart="tab === 'awak' ? awUptOpt : null" @chart-click="clickUpt($event.detail.name)"></div></div></div>
          <div class="card"><div class="card-h"><div><h3>Kapan awak paling banyak bertugas</h3><p>Jumlah dinasan sedang bertugas per jam (program) · warna makin gelap = makin banyak · klik UPT</p></div></div>
            <div class="card-b fill"><div class="chart" x-chart="tab === 'awak' ? awHourOpt : null" @chart-click="clickUpt($event.detail.data && AW.U[$event.detail.data[1]] ? AW.U[$event.detail.data[1]].upt : '')"></div></div></div>
        </div>
        <div class="card mt"><div class="card-h"><div><h3>Jam dinas program vs perkiraan bila terlambat <span class="tag warn">perkiraan</span></h3>
          <p x-text="'Titik = dinasan (' + AW.nLinked + ' terhubung ke realisasi; ' + AW.nSplit + ' berganti awak di tengah perjalanan sehingga keterlambatan di titik ganti tidak tercatat) · di atas garis = molor · ukuran = jumlah perjalanan · warna makin merah = makin sering datang melewati toleransi'"></p></div></div>
          <div class="card-b fill"><div class="chart tall" x-chart="tab === 'awak' ? awRiskOpt : null" @chart-click="$event.detail.data && $event.detail.data.r && clickUpt($event.detail.data.r.upt)"></div></div></div>
        <div class="card mt"><div class="card-h"><div><h3>Daftar dinasan menurut risiko molor</h3><p>Urut tambahan jam dinas P85 · baris kuning = hadir &lt; 60 menit sebelum berangkat</p></div></div>
          <div class="card-b tbl-wrap"><table class="tbl sm" data-pg="15"><thead><tr><th>UPT crew</th><th>Kode</th><th>KA</th><th>Lintas dinas</th><th class="num">Mulai–habis</th><th class="num">Siap (menit)</th><th class="num">Jam dinas program</th><th class="num">Perjalanan</th><th class="num">Datang lewat toleransi</th><th class="num">Tambahan P50 / P85</th><th class="num">Perkiraan P85</th></tr></thead>
            <tbody><template x-for="(r, i) in awRows" :key="r.upt + r.kode + r.no + i"><tr :class="r.siap != null && r.siap < 60 && 'late'">
              <td x-text="r.upt"></td><td x-text="r.kode"></td><td><b x-text="r.no"></b> <small x-text="r.nama"></small></td><td x-text="r.lin"></td><td class="num nowrap" x-text="r.mulai + '–' + r.habis"></td>
              <td class="num" x-text="r.siap == null ? '–' : r.siap"></td><td class="num" x-text="BBK.fmt.dur(r.dur)"></td><td class="num" x-text="r.same ? KAI.fmt.n(r.nTrip) : 'ganti awak'"></td>
              <td class="num"><span class="bb-mini" x-show="r.lateShare != null" :style="'--v:' + Math.round((r.lateShare || 0) * 100) + '%'" :title="BBK.fmt.pct0(r.lateShare)"><i></i></span> <span x-text="r.lateShare != null ? BBK.fmt.pct0(r.lateShare) : 'tidak tercatat'"></span></td>
              <td class="num" x-text="r.add85 != null ? '+' + BBK.fmt.dur(r.add50) + ' / +' + BBK.fmt.dur(r.add85) : '–'"></td><td class="num"><b x-text="r.est85 != null ? BBK.fmt.dur(r.est85) : '–'"></b></td></tr></template></tbody></table></div>
          <div x-data="{ get L() { return insFor(['awak']); } }"><?!= include('Part.BbPita'); ?></div></div>
      </div></template>
    </div>

    <div x-show="tab === 'gangguan'" class="mt">
      <template x-if="GS"><div>
        <p class="note story">Kejadian di Gangguan_Induk yang nomor KA-nya terdaftar sebagai KA batubara (M_KA DB Batubara) pada bulan saringan. Klik bulan, tanggal, lintas, kelas atau subgangguan: semua grafik dan daftar ikut tersaring. Gangguan tanpa nomor KA tidak terhitung.</p>
        <div class="xf-bar mt-s" x-show="gAny"><span class="note">Disaring:</span>
          <button type="button" class="chip on" x-show="gx.m" @click="setG('m', gx.m)" x-text="(gx.m ? $store.bb.MON[+gx.m.slice(5) - 1] + ' ' + gx.m.slice(0, 4) : '') + ' ✕'"></button>
          <button type="button" class="chip on" x-show="gx.day" @click="setG('day', gx.day)" x-text="(gx.day ? KAI.fmt.day(gx.day) : '') + ' ✕'"></button>
          <button type="button" class="chip on" x-show="gx.lin" @click="setG('lin', gx.lin)" x-text="gx.lin + ' ✕'"></button>
          <button type="button" class="chip on" x-show="gx.kelas" @click="setG('kelas', gx.kelas)" x-text="KAI.classLabel(gx.kelas) + ' ✕'"></button>
          <button type="button" class="chip on" x-show="gx.sub" @click="setG('sub', gx.sub)" x-text="gx.sub + ' ✕'"></button>
          <button type="button" class="link-btn sm" @click="gx = { kelas: '', sub: '', day: '', lin: '', m: '' }">Hapus semua</button></div>
        <div class="grid g-4 mt-s">
          <div class="card kpi" style="--kpi-c:var(--bad)"><div class="lbl">Gangguan KA batubara</div><div class="val num" x-text="KAI.fmt.n(GS.n)"></div><div class="note" x-text="KAI.fmt.n(GS.m) + ' menit kelambatan (Total Andil Kelka)'"></div></div>
          <div class="card kpi" style="--kpi-c:var(--warn)"><div class="lbl">Laju per 100 perjalanan KA</div><div class="val num" x-text="GS.rate != null ? KAI.fmt.d1(GS.rate) : '–'"></div><div class="note" x-text="'dari ' + KAI.fmt.n(GS.nKa) + ' perjalanan KA batubara tidak batal (REAL_PERJALANAN)'"></div></div>
          <div class="card kpi"><div class="lbl">Datang melewati toleransi</div><div class="val num" x-text="GS.otp.a ? KAI.fmt.d1(GS.otp.a.pct) + '%' : '–'"></div>
            <div class="note" x-text="GS.otp.a ? 'KA pada hari gangguannya (' + KAI.fmt.n(GS.otp.a.n) + ' perjalanan) vs ' + (GS.otp.b ? KAI.fmt.d1(GS.otp.b.pct) + '% perjalanan lain' : '–') : 'perjalanan KA ini tidak tercatat di REAL_PERJALANAN'"></div></div>
          <div class="card kpi"><div class="lbl" x-text="GS.lv === 'kelas' ? 'Kelas terbesar' : 'Subgangguan terbesar'"></div><div class="val" style="font-size:17px" x-text="GS.par[0] ? (GS.lv === 'kelas' ? KAI.classLabel(GS.par[0].k) : GS.par[0].k) : 'Tidak ada'"></div>
            <div class="note" x-text="GS.par[0] ? KAI.fmt.n(GS.par[0].n) + ' kejadian · ' + KAI.fmt.n(GS.par[0].m) + ' menit (' + KAI.fmt.d1(GS.par[0].cum) + '%)' : ''"></div></div>
        </div>
        <div class="grid g-2 mt">
          <div class="card"><div class="card-h"><div><h3>Laju gangguan per bulan</h3><p>Batang = kejadian · garis = per 100 perjalanan KA batubara · klik bulan</p></div></div>
            <div class="card-b fill"><div class="chart" x-chart="tab === 'gangguan' ? gMonOpt : null" @chart-click="$event.detail.data && $event.detail.data.m && setG('m', $event.detail.data.m)"></div></div></div>
          <div class="card"><div class="card-h"><div><h3>Kalender kejadian</h3><p>Jumlah gangguan per hari · klik tanggal</p></div></div>
            <div class="card-b fill"><div class="chart" x-chart="tab === 'gangguan' ? gCalOpt : null" @chart-click="$event.detail.value && setG('day', $event.detail.value[0])"></div></div></div>
        </div>
        <div class="card mt"><div class="card-h"><div><h3>Di mana sepanjang lintas batubara</h3><p x-text="'Titik = kejadian (ukuran = menit) pada km stasiun/petak M_STASIUN · garis abu = stasiun · perbesar dengan Ctrl + roda atau penggeser di bawah · klik titik untuk rincian' + (GS.unplaced ? ' · ' + GS.unplaced + ' kejadian di luar lintas batubara atau tanpa lokasi tidak tergambar' : '')"></p></div></div>
          <div class="card-b fill"><div class="chart" style="height:300px" x-chart="tab === 'gangguan' ? gStripOpt : null" @chart-click="$event.detail.data && $event.detail.data.r ? $store.app.openEvent($event.detail.data.r.id) : null"></div></div></div>
        <div class="grid g-2-1 mt">
          <div class="card"><div class="card-h"><div><h3 x-text="GS.lv === 'kelas' ? 'Pareto kelas gangguan' : 'Pareto subgangguan: ' + KAI.classLabel(gx.kelas)"></h3><p x-text="GS.lv === 'kelas' ? 'Menit kelambatan · garis = kumulatif · klik kelas untuk turun ke subgangguan' : 'Klik subgangguan untuk menyaring · klik chip kelas di atas untuk kembali'"></p></div></div>
            <div class="card-b fill"><div class="chart" x-chart="tab === 'gangguan' ? gParOpt : null" @chart-click="$event.detail.data && $event.detail.data.k && setG(GS.lv, $event.detail.data.k)"></div></div></div>
          <div class="card"><div class="card-h"><div><h3>Per lintas</h3><p>Klik untuk menyaring</p></div></div>
            <div class="card-b"><template x-for="l in $store.bb.ready ? BBK.rows('M_LINTAS') : []" :key="l.id">
              <button type="button" class="bb-linrow" :class="gx.lin === l.id && 'on'" @click="setG('lin', l.id)"><span x-text="l.nama"></span>
                <b x-text="KAI.fmt.n(G.filter(function (r) { return gPass(r, 'lin') && gPos[r.id] && gPos[r.id].lin === l.id; }).length)"></b></button></template></div></div>
        </div>
        <div class="card mt"><div class="card-h"><div><h3>Daftar kejadian</h3><p x-text="KAI.fmt.n(Gf.length) + ' kejadian · urut menit terbesar · klik untuk rincian'"></p></div></div>
          <div class="card-b tbl-wrap"><table class="tbl" data-pg="15"><thead><tr><th>Tanggal</th><th>KA</th><th>Kelas</th><th>Judul</th><th>Lokasi</th><th class="num">Menit</th></tr></thead>
            <tbody><template x-for="r in Gf" :key="r.id"><tr class="click" @click="$store.app.openEvent(r.id)"><td class="nowrap" x-text="KAI.fmt.day(r.date)"></td><td><b x-text="r.ka"></b></td><td x-text="KAI.classLabel(r.kelas)"></td><td class="wrap" x-text="r.judul"></td><td x-text="r.lokasi || 'tidak tercatat'"></td><td class="num" x-text="KAI.fmt.n(r.menit)"></td></tr></template>
              <tr x-show="!Gf.length"><td colspan="6" class="muted">Tidak ada gangguan KA batubara pada saringan ini.</td></tr></tbody></table></div></div>
      </div></template>
    </div>
  </section>
</template>
