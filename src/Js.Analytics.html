<script>
/**
 * Js.Analytics — semua perhitungan dashboard (fungsi murni, tanpa DOM).
 * Definisi metrik mengikuti laporan bulanan: frekuensi = jumlah kejadian, kelambatan = Total Andil Kelka (menit).
 *
 * Periode (P) = { kind: 'month', yms: [...] } atau { kind: 'range', from: 'YYYY-MM-DD', to: 'YYYY-MM-DD' },
 * ditambah jam opsional { h0, h1 } (0–23; h0 > h1 = melewati tengah malam).
 *  - Mode bulan mencocokkan kolom Bulan/Tahun (sama dengan laporan, termasuk baris tanpa tanggal hari).
 *  - Mode rentang butuh tanggal hari; filter jam butuh "Jam mulai" yang terbaca. Baris yang tidak memenuhi dihitung terpisah.
 */
(function (root) {
  var CLASSES = ['operasional', 'sarana', 'alam', 'prasarana'];
  var ALLK = CLASSES.concat(['belum']);   // K5: total = 4 kelas + Data belum lengkap
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  var DOW = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function daysIn(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function isoDate(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function dayMs(iso) { return Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)); }
  function addDays(iso, k) { return isoDate(dayMs(iso) + k * 864e5); }
  function addYears(iso, k) { var y = +iso.slice(0, 4) + k, m = +iso.slice(5, 7), d = Math.min(+iso.slice(8, 10), daysIn(y, m)); return y + '-' + pad(m) + '-' + pad(d); }

  var TC_FIELDS = ['kategori', 'sub', 'judul', 'lokasi', 'kaNama', 'penyebab'];
  function prepare(fields, rows) {
    var out = new Array(rows.length), tcMemo = {};
    function tc(v) { if (!v) return v; var k = tcMemo[v]; if (k === undefined) k = tcMemo[v] = (typeof KAI !== 'undefined' && KAI.tc) ? KAI.tc(v) : v; return k; }
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], o = {};
      for (var j = 0; j < fields.length; j++) o[fields[j]] = r[j];
      o.sarana = o.sarana ? String(o.sarana).split('|') : [];
      o.drvSet = {}; String(o.drv || '').split(',').forEach(function (k) { if (k) o.drvSet[k] = 1; });
      for (var t = 0; t < TC_FIELDS.length; t++) if (o[TC_FIELDS[t]]) o[TC_FIELDS[t]] = tc(o[TC_FIELDS[t]]);   // penyeragaman huruf
      o.y = o.ym ? Number(o.ym.slice(0, 4)) : 0;
      o.m = o.ym ? Number(o.ym.slice(5, 7)) : 0;
      o.date = o.ym && o.d ? o.ym + '-' + pad(o.d) : '';
      o.dow = o.date ? (new Date(dayMs(o.date)).getUTCDay() + 6) % 7 : -1;  // 0 = Senin
      if (o.hm == null || o.hm === '') o.hm = -1;
      o.hr = o.hm >= 0 ? Math.floor(o.hm / 60) : -1;
      o.kmv = o.kmv === '' || o.kmv == null ? null : Number(o.kmv);
      o.segKey = '';
      if (o.lokType === 'petak' && /^[A-Z0-9]+-[A-Z0-9]+$/.test(o.lokCode || '')) o.segKey = o.lokCode.split('-').sort().join('-');
      o.stCode = o.lokType === 'stasiun' ? o.lokCode : '';
      out[i] = o;
    }
    return out;
  }

  function ymShift(ym, k) {
    var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + k;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + pad(m + 1);
  }
  function ymRange(from, to) { var out = [], c = from; while (c <= to && out.length < 240) { out.push(c); c = ymShift(c, 1); } return out; }
  function months(recs) { var s = {}; recs.forEach(function (r) { if (r.ym) s[r.ym] = 1; }); return Object.keys(s).sort(); }
  function dateRange(recs) { var a = '', b = ''; recs.forEach(function (r) { if (!r.date) return; if (!a || r.date < a) a = r.date; if (!b || r.date > b) b = r.date; }); return { min: a, max: b }; }

  /* ---------- Periode ---------- */
  function hoursOn(P) { return P.h0 != null && P.h1 != null && !(P.h0 === 0 && P.h1 === 23); }
  function hourLabel(P) { return hoursOn(P) ? ' · pukul ' + pad(P.h0) + ':00–' + pad(P.h1) + ':59' : ''; }
  function fmtDay(iso) { return +iso.slice(8, 10) + ' ' + MON[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4); }
  function labelOf(P) {
    var base;
    if (P.kind === 'month') {
      var a = P.yms[0], b = P.yms[P.yms.length - 1];
      base = P.yms.length === 1 ? MONTHS[+a.slice(5, 7) - 1] + ' ' + a.slice(0, 4)
        : MON[+a.slice(5, 7) - 1] + (a.slice(0, 4) !== b.slice(0, 4) ? ' ' + a.slice(0, 4) : '') + '–' + MON[+b.slice(5, 7) - 1] + ' ' + b.slice(0, 4);
    } else base = P.from === P.to ? fmtDay(P.from) : fmtDay(P.from).replace(/ \d{4}$/, P.from.slice(0, 4) === P.to.slice(0, 4) ? '' : ' ' + P.from.slice(0, 4)) + ' – ' + fmtDay(P.to);
    return base + hourLabel(P);
  }
  function shortOf(P) {
    var base;
    if (P.kind === 'month') {
      var a = P.yms[0], b = P.yms[P.yms.length - 1];
      base = P.yms.length === 1 ? MON[+a.slice(5, 7) - 1] + ' ' + a.slice(2, 4) : MON[+a.slice(5, 7) - 1] + '–' + MON[+b.slice(5, 7) - 1] + ' ' + b.slice(2, 4);
    } else base = (+P.from.slice(8, 10)) + '/' + (+P.from.slice(5, 7)) + '–' + (+P.to.slice(8, 10)) + '/' + (+P.to.slice(5, 7)) + '/' + P.to.slice(2, 4);
    return base + (hoursOn(P) ? ' ' + pad(P.h0) + '–' + pad(P.h1) : '');
  }
  function mk(P) { P.label = labelOf(P); P.short = shortOf(P); P.base = P.label.replace(hourLabel(P), ''); return P; }
  function pMonth(ym, h0, h1) { return mk({ kind: 'month', yms: [ym], h0: h0, h1: h1 }); }
  function pMonths(yms, h0, h1) { return mk({ kind: 'month', yms: yms.slice(), h0: h0, h1: h1 }); }
  function pRange(from, to, h0, h1) { if (to < from) { var t = from; from = to; to = t; } return mk({ kind: 'range', from: from, to: to, h0: h0, h1: h1 }); }
  function endOf(P) { return P.kind === 'month' ? P.yms[P.yms.length - 1] + '-' + pad(daysIn(+P.yms[P.yms.length - 1].slice(0, 4), +P.yms[P.yms.length - 1].slice(5, 7))) : P.to; }
  function startOf(P) { return P.kind === 'month' ? P.yms[0] + '-01' : P.from; }
  function lengthDays(P) { return Math.round((dayMs(endOf(P)) - dayMs(startOf(P))) / 864e5) + 1; }
  /** Periode sebelumnya dengan panjang sama (MoM untuk mode bulan). */
  function prevOf(P) {
    if (P.kind === 'month') return pMonths(P.yms.map(function (y) { return ymShift(y, -P.yms.length); }), P.h0, P.h1);
    var n = lengthDays(P); return pRange(addDays(P.from, -n), addDays(P.from, -1), P.h0, P.h1);
  }
  /** Periode yang sama tahun lalu (YoY). */
  function yoyOf(P) {
    if (P.kind === 'month') return pMonths(P.yms.map(function (y) { return ymShift(y, -12); }), P.h0, P.h1);
    return pRange(addYears(P.from, -1), addYears(P.to, -1), P.h0, P.h1);
  }
  /** 1 Januari s.d. akhir periode (YTD). */
  function ytdOf(P) {
    if (P.kind === 'month') { var e = P.yms[P.yms.length - 1]; return pMonths(ymRange(e.slice(0, 4) + '-01', e), P.h0, P.h1); }
    return pRange(P.to.slice(0, 4) + '-01-01', P.to, P.h0, P.h1);
  }
  function lastN(P, n) { // n bulan berakhir di akhir periode (mode bulan) — untuk "unit berulang 3 bulan"
    var e = endOf(P).slice(0, 7); return pMonths(ymRange(ymShift(e, -(n - 1)), e), P.h0, P.h1);
  }

  function inHours(r, P) {
    if (!hoursOn(P)) return true;
    if (r.hr < 0) return false;
    return P.h0 <= P.h1 ? r.hr >= P.h0 && r.hr <= P.h1 : r.hr >= P.h0 || r.hr <= P.h1;
  }
  function matcher(P) {
    if (!P) return function () { return true; };
    if (P.kind === 'month') {
      var s = {}; P.yms.forEach(function (y) { s[y] = 1; });
      return function (r) { return !!s[r.ym] && inHours(r, P); };
    }
    return function (r) { return !!r.date && r.date >= P.from && r.date <= P.to && inHours(r, P); };
  }
  function sel(recs, P) { var f = matcher(P); return recs.filter(f); }
  /** Baris yang tidak bisa dinilai untuk P (tanpa tanggal hari / tanpa jam) — untuk catatan transparansi. */
  function excluded(recs, P) {
    var noDay = 0, noHour = 0;
    var s = {}; if (P.kind === 'month') P.yms.forEach(function (y) { s[y] = 1; });
    recs.forEach(function (r) {
      var inside = P.kind === 'month' ? !!s[r.ym] : (r.ym >= P.from.slice(0, 7) && r.ym <= P.to.slice(0, 7));
      if (!inside) return;
      if (P.kind === 'range' && !r.date) noDay++;
      else if (hoursOn(P) && r.hr < 0) noHour++;
    });
    return { noDay: noDay, noHour: noHour };
  }
  // Kompatibilitas: inYms(recs, yms) masih dipakai beberapa tampilan.
  function inYms(recs, yms) { var s = {}; yms.forEach(function (y) { s[y] = 1; }); return recs.filter(function (r) { return s[r.ym]; }); }

  /** Filter non-waktu: wilayah[], kelas[]. */
  function scope(recs, f) {
    var w = f && f.wilayah && f.wilayah.length ? f.wilayah : null, k = f && f.kelas && f.kelas.length ? f.kelas : null;
    if (!w && !k) return recs;
    return recs.filter(function (r) { return (!w || w.indexOf(r.wilayah) >= 0) && (!k || k.indexOf(r.kelas) >= 0); });
  }
  function sum(a, f) { var t = 0; for (var i = 0; i < a.length; i++) t += f ? f(a[i]) : a[i]; return t; }
  function median(a) { if (!a.length) return 0; var s = a.slice().sort(function (x, y) { return x - y; }), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; }
  function group(recs, keyFn) {
    var m = {};
    recs.forEach(function (r) { var k = keyFn(r); if (k === '' || k == null) return; (m[k] = m[k] || []).push(r); });
    return m;
  }
  function stat(list) { return { n: list.length, menit: sum(list, function (r) { return r.menit; }) }; }
  function isCrossing(r) { return !!r.cross; }
  function pct(a, b) { return b ? (a - b) / b : null; }

  /** Jenis layanan untuk eksposur (K5): nomor KA dari kolom sumber ATAU dibaca dari uraian (tetap gangguan; ditandai 'turunan'). */
  function pj(r) { return r.kaJenis; }
  /** Pendapatan terekspos satu kejadian (Rp). Mesin KAIP (rate bulanan dari Passenger/Freight + GAPEKA) bila tersedia,
   *  selain itu rate tetap CONFIG (cadangan). */
  var RAR = null;
  function setRar(fn) { RAR = fn || null; }
  function rpOne(r, rate) {
    if (RAR) { var x = RAR(r); return x ? x.rp : 0; }
    return pj(r) === 'PENUMPANG' ? r.menit / 60 * rate.PENUMPANG : pj(r) === 'BARANG' ? r.menit / 60 * rate.BARANG : 0;
  }
  function exposureOf(list, rate) {
    var p = 0, b = 0, rp = 0, rb = 0;
    list.forEach(function (r) { var v = rpOne(r, rate); if (pj(r) === 'PENUMPANG') { p += r.menit; rp += v; } else if (pj(r) === 'BARANG') { b += r.menit; rb += v; } });
    return { penumpang: rp, barang: rb, menitPenumpang: p, menitBarang: b };
  }

  /** KPI dari daftar yang sudah dipilih. */
  function kpiOf(L, cfg) {
    var s = stat(L), cross = L.filter(isCrossing), ex = exposureOf(L, cfg.rate), heavy = L.filter(function (r) { return r.menit >= cfg.heavy; });
    return { n: s.n, menit: s.menit, avg: s.n ? s.menit / s.n : 0, heavy: heavy.length, heavyMenit: sum(heavy, function (r) { return r.menit; }),
      crossN: cross.length, crossMenit: sum(cross, function (r) { return r.menit; }), exposure: ex.penumpang + ex.barang, exposureDetail: ex };
  }
  function kpi(recs, P, cfg) { return kpiOf(sel(recs, P), cfg); }

  function byClassOf(L) {
    var out = {};
    ALLK.forEach(function (c) { out[c] = { n: 0, menit: 0 }; });
    L.forEach(function (r) { var o = out[r.kelas]; if (o) { o.n++; o.menit += r.menit; } });
    return out;
  }
  function byClass(recs, P) { return byClassOf(sel(recs, P)); }

  /** Seri bulanan per kelas (filter jam ikut berlaku). */
  function trend(recs, from, to, P) {
    var yms = ymRange(from, to), idx = {}, series = {};
    yms.forEach(function (y, i) { idx[y] = i; });
    ALLK.forEach(function (c) { series[c] = { n: yms.map(function () { return 0; }), menit: yms.map(function () { return 0; }) }; });
    recs.forEach(function (r) {
      var i = idx[r.ym]; if (i == null || !series[r.kelas] || (P && !inHours(r, P))) return;
      series[r.kelas].n[i]++; series[r.kelas].menit[i] += r.menit;
    });
    return { yms: yms, series: series };
  }
  /** Seri harian per kelas dalam periode (hanya baris bertanggal hari). */
  function daily(recs, P) {
    var a = startOf(P), b = endOf(P), days = [], idx = {}, series = {};
    for (var d = a, k = 0; d <= b && k < 400; d = addDays(d, 1), k++) { idx[d] = days.length; days.push(d); }
    ALLK.forEach(function (c) { series[c] = { n: days.map(function () { return 0; }), menit: days.map(function () { return 0; }) }; });
    sel(recs, P).forEach(function (r) { var i = idx[r.date]; if (i == null || !series[r.kelas]) return; series[r.kelas].n[i]++; series[r.kelas].menit[i] += r.menit; });
    return { days: days, series: series };
  }
  /** Distribusi per jam (0–23) dan matriks hari × jam. */
  function hourly(L) {
    var n = [], m = [], hm = [];
    for (var h = 0; h < 24; h++) { n.push(0); m.push(0); }
    for (var d = 0; d < 7; d++) { hm.push([]); for (var hh = 0; hh < 24; hh++) hm[d].push(0); }
    var known = 0;
    L.forEach(function (r) { if (r.hr < 0) return; known++; n[r.hr]++; m[r.hr] += r.menit; if (r.dow >= 0) hm[r.dow][r.hr]++; });
    var dowN = [0, 0, 0, 0, 0, 0, 0], dowM = [0, 0, 0, 0, 0, 0, 0];
    L.forEach(function (r) { if (r.dow >= 0) { dowN[r.dow]++; dowM[r.dow] += r.menit; } });
    return { n: n, menit: m, heat: hm, known: known, total: L.length, dowN: dowN, dowM: dowM };
  }

  function matrixOf(L) {
    var bc = byClassOf(L), pts = CLASSES.map(function (c) { return { kelas: c, n: bc[c].n, menit: bc[c].menit }; });
    return { points: pts, medN: median(pts.map(function (p) { return p.n; })), medMenit: median(pts.map(function (p) { return p.menit; })) };
  }
  function matrix(recs, P) { return matrixOf(sel(recs, P)); }

  /** Top N jenis gangguan (Subgangguan), opsional dalam satu kelas. */
  /**
   * Kunci jenis gangguan bila varian digabung (seperti laporan bulanan): buang awalan jenis aset ("Lokomotif - "),
   * "Imbas (Faktor)" dan "Gangguan" → "Alam - Imbas Gempa bumi" & "Alam - Gempa bumi" = "Gempa bumi";
   * "Gangguan Tenaga Lemah" (JASUM) & "Lokomotif - Gangguan Tenaga Lemah" = "Tenaga Lemah".
   */
  function baseSub(s) {
    return String(s || '').replace(/^[^-]{2,40}?\s-\s*/, '').replace(/^imbas(\s+faktor)?\s+/i, '').replace(/^gangguan\s+/i, '').trim();
  }
  var OPT = { imbas: true };   // true = varian "Imbas …" digabung ke induknya (bawaan, sesuai laporan)
  function setOpt(o) { Object.assign(OPT, o || {}); }
  function topOf(L, kelas, cfg, n) {
    var labels = {};
    var g = group(L.filter(function (r) { return !kelas || r.kelas === kelas; }), function (r) {
      var raw = r.sub || r.judul || 'Tidak tercatat';
      if (!OPT.imbas) return raw;
      var b = baseSub(raw) || raw, k = b.toLowerCase();
      (labels[k] = labels[k] || {})[b] = (labels[k][b] || 0) + 1;
      return k;
    });
    return Object.keys(g).map(function (k) {
      var s = stat(g[k]), lab = k;
      if (OPT.imbas) { var c = labels[k]; lab = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; })[0]; lab = lab.charAt(0).toUpperCase() + lab.slice(1); }
      var vars = OPT.imbas ? Object.keys(g[k].reduce(function (a, r) { a[r.sub || r.judul] = 1; return a; }, {})).length : 1;
      return { label: lab, variants: vars, n: s.n, menit: s.menit, heavy: g[k].filter(function (r) { return r.menit >= cfg.top; }).length, ids: g[k].map(function (r) { return r.id; }) };
    }).sort(function (a, b) { return b.menit - a.menit || b.n - a.n; }).slice(0, n || 3);
  }
  function top(recs, P, kelas, cfg, n) { return topOf(sel(recs, P), kelas, cfg, n); }

  /** Tabel perlintasan: jenis × beberapa periode. periods = [{label, P}] */
  /** Tabel perlintasan: 4 jenis (tertemper kendaraan, mogok, palang, rombongan pejabat); total = jumlah baris yang ditampilkan.
   *  opt.allTemper = baris pertama memuat semua temperan (kendaraan, orang, hewan, material) — dipakai tabel YtD lampiran. */
  function crossingTable(recs, periods, cfg, opt) {
    opt = opt || {};
    var lists = periods.map(function (p) { return sel(recs, p.P); });
    var defs = cfg.crossing.filter(function (c) { return c.id !== 'ramai'; });
    var test = function (c) { return function (r) { return r.cross === c.id || (opt.allTemper && c.id === 'temper' && r.temperLain && r.cross !== c.id && !r.cross); }; };
    var rows = defs.map(function (c) {
      return { id: c.id, label: opt.allTemper && c.id === 'temper' ? 'Tertemper kendaraan / orang / hewan / material' : c.label, cells: lists.map(function (L) { return stat(L.filter(test(c))); }) };
    });
    var total = { id: 'total', label: opt.allTemper ? 'Total' : 'Total perlintasan sebidang', cells: lists.map(function (L) { return stat(L.filter(function (r) { return defs.some(function (c) { return test(c)(r); }); })); }) };
    var other = { id: 'lain', label: 'Temperan orang/hewan/lainnya (bukan perlintasan)', cells: lists.map(function (L) { return stat(L.filter(function (r) { return r.temperLain; })); }) };
    return { rows: rows, total: total, other: other };
  }

  function locations(list, minN) {
    var g = group(list, function (r) { return r.lokasi ? r.lokasi + '\u0001' + r.wilayah : ''; });
    return Object.keys(g).map(function (k) {
      var p = k.split('\u0001'), s = stat(g[k]);
      return { lokasi: p[0], wilayah: p[1], n: s.n, menit: s.menit, ids: g[k].map(function (r) { return r.id; }), segKey: g[k][0].segKey, stCode: g[k][0].stCode };
    }).filter(function (x) { return x.n >= (minN || 1); }).sort(function (a, b) { return b.n - a.n || b.menit - a.menit; });
  }

  function crossingDetailOf(L) {
    var cross = L.filter(isCrossing), both = L.filter(function (r) { return r.cross || r.temperLain; });
    var w = group(both, function (r) { return r.wilayah; }), lg = group(cross, function (r) { return r.lintas; });
    return {
      repeat: locations(both, 2).slice(0, 8),
      regions: Object.keys(w).map(function (k) { var s = stat(w[k]); return { wilayah: k, n: s.n, menit: s.menit }; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 8),
      lintas: Object.keys(lg).map(function (k) { var s = stat(lg[k]); return { lintas: k, wilayah: lg[k][0].wilayah, n: s.n, menit: s.menit }; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 8),
      heavy: cross.slice().sort(function (a, b) { return b.menit - a.menit; }).slice(0, 50)
    };
  }
  function crossingDetail(recs, P) { return crossingDetailOf(sel(recs, P)); }

  function regionOrder(w) { var m = /^(Daop|Divre) (\d+)/.exec(w || ''); return m ? (m[1] === 'Daop' ? 0 : 100) + Number(m[2]) : 999; }
  /** Seluruh wilayah operasi Jawa–Sumatera; wilayah tanpa kejadian tetap tampil (0) agar kekosongan laporan terlihat. */
  var REGIONS = ['Daop 1', 'Daop 2', 'Daop 3', 'Daop 4', 'Daop 5', 'Daop 6', 'Daop 7', 'Daop 8', 'Daop 9', 'Divre 1', 'Divre 2', 'Divre 3', 'Divre 4'];
  function regionsOf(L, only) {
    var g = group(L, function (r) { return r.wilayah || 'Wilayah tidak tercatat'; });
