<!-- View.Metodologi — status sinkronisasi, kualitas data, definisi, cara kerja perkiraan, dan daftar rujukan. -->
<template x-if="$store.app.route === 'metodologi' && $store.app.R">
  <section class="view" x-data="vMeta">
    <div class="grid g-3">
      <div class="card kpi"><div class="lbl">Snapshot</div><div class="val num" style="font-size:20px" x-text="meta.version"></div>
        <div class="note" x-text="'Dibangun ' + KAI.fmt.time(meta.builtAt) + ' · sumber diubah ' + KAI.fmt.time(meta.sourceUpdatedAt)"></div></div>
      <div class="card kpi" :style="'--kpi-c:' + (st && !st.ok ? 'var(--bad)' : 'var(--good)')"><div class="lbl">Sinkronisasi terakhir</div>
        <div class="val" style="font-size:15px;line-height:1.35" x-text="st ? st.message : 'Belum ada catatan'"></div>
        <div class="note" x-text="st ? KAI.fmt.time(st.at) + ' · ' + st.trigger + ' · ' + Math.round(st.ms / 1000) + ' dtk · otomatis tiap 15 menit bila sumber berubah' : ''"></div></div>
      <div class="card kpi"><div class="lbl">Cakupan</div><div class="val num" style="font-size:20px" x-text="KAI.fmt.n(meta.rows) + ' kejadian'"></div>
        <div class="note" x-text="KAI.fmt.day($store.app.dates.min) + ' s.d. ' + KAI.fmt.day($store.app.dates.max) + ' · aturan ' + meta.rule"></div></div>
    </div>

    <div class="card mt">
      <div class="card-h"><div><h3>Rute jalur (v3.10)</h3><p>Wilayah & koridor → tab Rute jalur · 13 koridor KA penumpang & barang</p></div></div>
      <div class="card-b">
        <dl class="kv">
          <dt>Koridor</dt><dd>Stasiun jangkar disambung jalur terpendek graf LIST PETAK JALAN GAPEKA 2025. Daop/Divre per petak dari LIST PETAK; UPT Resor JR dari PETA WILAYAH.</dd>
          <dt>KA lewat</dt><dd>Perjalanan Daftar Waktu GAPEKA 2025 (jam pasti; stasiun langsung tanpa jam diinterpolasi km) + LIST KA tanpa Daftar Waktu (jam perkiraan). Kategori: penumpang, KRL (Commuter Line), barang, dinas. Hanya perjalanan harian (REG/PLB) untuk jam kosong & hitungan harian.</dd>
          <dt>Pendapatan</dt><dd>Apa adanya dari tab Passenger (per nomor KA) & Freight (per Nama KA). Penuh = seluruh pendapatan KA yang lewat; alokasi = × km KA di koridor ÷ km rute KA (barang: digabung atas semua perjalanan bernama sama). Tanpa skor produktivitas.</dd>
          <dt>Jam kosong</dt><dd>24 jam dikurangi waktu tempuh petak tiap perjalanan harian ± 5 menit. Petak ganda juga per sepur (WKP satu sepur). Rekomendasi WKP memakai jendela ≥ 60 menit, diutamakan 21:00–05:00.</dd>
          <dt>Status petak</dt><dd>P1 = gangguan prasarana ≥ 2 & (THI &lt; 70 atau WKP jalan rel ≤ 1) · P2 = gangguan tanpa WKP jalan rel · P3 = THI &lt; 70 tanpa gangguan. WKP dipetakan ke petak dari teks lokasi (petak, rentang stasiun, atau emplasemen; 97% baris).</dd>
          <dt>Peta & profil fisik</dt><dd>Geometri OpenStreetMap (ODbL) dari ubin github.com/enwo02/train-tracker, garis pantai Natural Earth — tertanam di aplikasi, tanpa ubin & kunci API. Koordinat stasiun: sandihex86/masterdataprasarana, DenShubi/Indonesian-Railway-, jeffersonsetiawan/TMConfiguration, ekadanis/stasiun_map_app; diuji ≤ 1,5 km dari rel, sisanya interpolasi km. Jembatan/terowongan/elektrifikasi/vmax hanya dari petak yang panjang OSM-nya cocok ±25%.</dd>
          <dt>Landai</dt><dd>Beda elevasi stasiun (m_stasiun) ÷ jarak = landai rata-rata (‰), bukan landai penentu. Elevasi yang landainya &gt; 40‰ ke semua tetangga dibuang (salah ketik sumber).</dd>
          <dt>Belum ada data</dt><dd>Persinyalan, jenis rel/bantalan, demografi: tidak ada di sumber aplikasi → ditulis "belum ada data", tidak diperkirakan.</dd>
        </dl>
      </div>
    </div>
    <div class="card mt">
      <div class="card-h"><div><h3>Sarana & armada (v3.9)</h3><p>Lokomotif · kereta · gerbong — KRL/KRD belum dihitung</p></div></div>
      <div class="card-b">
        <dl class="kv">
          <dt>Sumber</dt><dd>Referensi Sarana SAP (unit, depo, mulai dinas, spesifikasi) · Buku Dukungan Sarana GAPEKA 2025 Jawa, Sumbar, Sumsel, Sumut (nomor sarana siap guna per depo induk, dinasan lok, km/lok/hari) · RHI lokomotif harian · Gangguan_Induk (nomor sarana pertama).</dd>
          <dt>Siap guna GAPEKA</dt><dd>Nomor sarana diekstrak dari PDF Duksar dan dicocokkan ke SAP: 499 lokomotif, 1.975 kereta, 7.948 gerbong tercantum. Unit SAP yang tidak tercantum ditandai "tidak tercantum" (bisa konservasi, rusak berat, atau baru).</dd>
          <dt>Kesehatan</dt><dd>Lokomotif = healthy index RHI (≥ 85 HEALTHY, 70–85 MONITOR, &lt; 70 DECLINING). Kereta & gerbong: RHI resmi belum tersedia → skor turunan = 0,35 usia + 0,45 keandalan + 0,20 kesiapan (Baik ≥ 80, Pantau 60–80, Prioritas &lt; 60). Indikator internal, bukan RHI.</dd>
          <dt>Skor komponen</dt><dd>Keandalan = 100 − min(100, 15 × kejadian 12 bln + menit 12 bln ÷ 20) · Usia = 100 − 2,2 × (usia − 5 th) · Kesiapan = 100 siap guna GAPEKA, 60 tidak tercantum, 30 di Balai Yasa. Usia &gt; 80 th dianggap tanggal SAP salah (tidak dinilai).</dd>
          <dt>Atribut 1–20 & rating</dt><dd>Atribut = skor ÷ 5 (gaya Football Manager). Rating = rata-rata atribut × 5.</dd>
          <dt>Kekuatan depo</dt><dd>0,35 kesehatan armada + 0,30 keandalan (gangguan per 100 unit dibanding median depo sejenis; 2× median = 0) + 0,20 porsi armada ≤ 30 th + 0,15 kesiapan GAPEKA. Peringkat hanya depo ≥ 10 unit.</dd>
          <dt>Dinasan</dt><dd>Proksi: KA yang dilayani dinasan lok depo (lok) atau depo induk rangkaian (kereta) menurut Duksar, ditambah KA pada gangguan unit. Bukan catatan dinasan harian per unit.</dd>
          <dt>GAPEKA 2026</dt><dd>Berlaku 1 Des 2026. Struktur data (17_SeedDuksar.gs, LIST KA, jadwal) disiapkan untuk versi baru; diisi setelah berkas GAPEKA 2026 tersedia.</dd>
        </dl>
      </div>
    </div>
    <div class="card mt">
      <div class="card-h"><div><h3>Aturan penyajian v3.8</h3><p>Keputusan 16 Okt 2026: acuan angka = data Gangguan_Induk; pendapatan terekspos = jenis KA dari LIST KA GAPEKA 2025 × rate bulanan dari tab Passenger/Freight; varian "Imbas" digabung (bisa dipisah)</p></div></div>
      <div class="card-b">
        <dl class="kv">
          <dt>Kolom kosong</dt><dd>Tidak ada sel kosong. Bila kolom sumber kosong, nilai diturunkan dari judul/uraian hanya dengan pola tegas (nomor KA "Ka 39"/"Plb 167B", jam "Waktu: 08.35", lokasi "petak jalan Malang (Ml) – Malangkota Lama (Mlk)" atau "Sta Kesamben (Ksb)", KM "km 50+4/5", nomor lokomotif, penyebab "Penyebab: …", depo dari Referensi Sarana, wilayah dari lokasi). Nilai turunan bergaris bawah titik oranye dan bertooltip. Bila tidak ada pola, ditulis "Tidak tercatat" — tidak ada nilai karangan.</dd>
          <dt>Kelas tanpa subgangguan</dt><dd>Bila Kategori dan Subgangguan sama-sama kosong, kelas ditentukan dari kata kunci judul (mis. "wesel", "LAA" → prasarana; "lokomotif", "tenaga lemah" → sarana; "gempa", "banjir" → alam), diberi tanda *.</dd>
          <dt>Eksposur</dt><dd>Hanya kejadian dengan nomor KA di kolom sumber yang dinilai. Nomor KA hasil turunan uraian ditampilkan di tabel, tetapi tidak dihitung ke eksposur (kelompok "nomor KA hanya dari uraian").</dd>
          <dt>Top 3 & jenis gangguan</dt><dd>Bawaan: "Alam - Imbas Gempa bumi" dan "Alam - Gempa bumi" digabung menjadi "Gempa bumi"; "Gangguan Tenaga Lemah" (JASUM) dan "Lokomotif - Gangguan Tenaga Lemah" digabung menjadi "Tenaga Lemah". Tombol "Pisah per subgangguan" di halaman Tren menampilkan rincian asli.</dd>
          <dt>Selisih dengan laporan v2</dt><dd>Laporan September 2026 v2 tidak memuat baris yang uraiannya bersambung ke baris berikutnya (mis. PLB 167B, 15 Sep, 2 menit) sehingga menulis 318 kejadian/14.375 menit; data mencatat 319/14.377. Laporan juga menggolongkan Gempa lintas Kts–Tal (27 Jun) sebagai operasional. Dashboard mengikuti data sumber.</dd>
          <dt>Wilayah</dt><dd>Seluruh 13 wilayah (Daop 1–9, Divre 1–4) selalu tampil; wilayah tanpa kejadian ditandai agar kelengkapan input dapat dikonfirmasi.</dd>
        </dl>
      </div>
    </div>

    <div class="grid g-2 mt">
      <div class="card">
        <div class="card-h"><div><h3>Kecocokan ke data master</h3><p>Seberapa banyak isian yang dikenali master</p></div></div>
        <div class="card-b">
          <div class="tbl-x"><table class="tbl"><thead><tr><th>Isian</th><th class="num">Dikenali</th><th class="num">Terisi</th><th class="num">%</th></tr></thead><tbody>
            <template x-for="m in match" :key="m.label"><tr><td x-text="m.label"></td><td class="num" x-text="KAI.fmt.n(m.ok)"></td><td class="num" x-text="KAI.fmt.n(m.all)"></td>
              <td class="num"><b x-text="m.all ? KAI.fmt.d1(m.ok / m.all * 100) : '–'"></b></td></tr></template>
          </tbody></table></div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><div><h3>Catatan kualitas data</h3><p>Baris tidak dihapus; ditandai agar bisa diperbaiki di sumber · klik untuk menelusuri</p></div></div>
        <div class="card-b tbl-wrap" style="max-height:300px">
          <table class="tbl"><thead><tr><th>Temuan</th><th class="num">Baris</th></tr></thead><tbody>
            <template x-for="q in quality" :key="q.flag"><tr class="click" @click="$store.app.go('telusuri', { ids: KAI.data.all.filter(function (r) { return r.q.indexOf(q.flag) >= 0; }).map(function (r) { return r.id; }), label: q.flag, period: 'all' })"><td x-text="q.flag"></td><td class="num" x-text="KAI.fmt.n(q.n)"></td></tr></template>
            <tr><td>Tanpa "Jam mulai" yang terbaca</td><td class="num" x-text="KAI.fmt.n(noHour)"></td></tr>
          </tbody></table>
        </div>
      </div>
    </div>

    <div class="grid g-2 mt">
      <div class="card">
        <div class="card-h"><div><h3>Periode, jam, dan pembanding</h3></div></div>
        <div class="card-b">
          <dl class="kv">
            <dt>Mode bulan</dt><dd>Mencocokkan kolom Bulan/Tahun — sama dengan laporan bulanan (termasuk baris tanpa tanggal hari).</dd>
            <dt>Mode rentang hari</dt><dd>Butuh tanggal hari. Baris tanpa tanggal hari tidak terhitung dan jumlahnya ditampilkan di bawah bilah filter.</dd>
            <dt>Filter jam</dt><dd>Memakai "Jam mulai" (format HH:MM, pecahan hari Excel, atau HH,MM). Baris tanpa jam tidak terhitung saat filter jam aktif. Rentang 22:00–05:59 melewati tengah malam.</dd>
            <dt>MoM</dt><dd>Periode sebelumnya dengan panjang sama (bulan lalu untuk mode bulan).</dd>
            <dt>YoY</dt><dd>Tanggal yang sama setahun sebelumnya.</dd>
            <dt>YTD</dt><dd>1 Januari s.d. akhir periode, dibanding rentang yang sama tahun lalu.</dd>
          </dl>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><div><h3>Jadwal KA, rute, dan JPL</h3><p>Bagian yang dihitung, bukan tercatat langsung</p></div></div>
        <div class="card-b">
          <template x-if="!$store.app.refReady"><div class="skel" style="height:160px"></div></template>
          <template x-if="$store.app.refReady">
            <dl class="kv">
              <dt>Jadwal KA</dt><dd x-text="'Buku Daftar Waktu GAPEKA 2025 (KA Antar Kota, Perkotaan, KRL, Barang — Jawa; Sumatera Utara, Barat, Selatan) → tab M_JADWAL: ' + KAI.fmt.n(rs.tt) + ' perjalanan, jam datang/berangkat, status berhenti/langsung/berhenti sebentar, dan catatan silang/susul. Jam asal & tujuan 1.830 KA yang juga ada di LIST KA cocok 100%.'"></dd>
              <dt>Rute & jam perkiraan</dt><dd x-text="'Hanya untuk KA di LIST KA yang tidak punya Daftar Waktu (mis. KA dinas, varian nomor): rute dari Lintas + Jarak dan jaringan petak — ' + KAI.fmt.n(rs.ok) + ' cocok ≤2% jarak, ' + KAI.fmt.n(rs.approx) + ' mendekati, ' + KAI.fmt.n(rs.bad) + ' tidak pasti (tidak dipakai), ' + KAI.fmt.n(rs.none) + ' tidak terpetakan. Jam antara = interpolasi menurut km (≈, bisa meleset ±30 menit).'"></dd>
              <dt>Dinas tutup / non operasi</dt><dd>PTDO GAPEKA 2025 Bab IV → tab M_STASIUN_OPS; tampil di profil stasiun.</dd>
              <dt>KA/hari</dt><dd>Jumlah perjalanan berstatus REG (reguler) yang rutenya melewati petak. KA fakultatif, KLB, dan PLB tidak dihitung.</dd>
              <dt>JPL</dt><dd x-text="KAI.fmt.n(jplStat.total) + ' titik dari daftar 1.404 titik program peningkatan keselamatan (tab M_JPL, ' + KAI.fmt.n(jplStat.p190) + ' prioritas 190). ' + KAI.fmt.n(jplStat.pair) + ' dipetakan ke pasangan stasiun, ' + KAI.fmt.n(jplStat.seg) + ' ke petak GAPEKA. Daftar ini bukan seluruh JPL nasional; tidak ada koordinat.'"></dd>
              <dt>Kaitan kejadian ↔ JPL</dt><dd x-text="'Petak sama dan nomor JPL disebut di laporan, atau selisih KM ≤ ' + String(cfg.jplKm).replace('.', ',') + ' km. Kejadian tanpa JPL program diinventaris per nomor JPL/KM dari laporan.'"></dd>
              <dt>Usia sarana</dt><dd x-text="'Dari mulai_dinas Referensi Sarana (SAP) s.d. hari ini. Peringatan bila > ' + cfg.ageWarn + ' tahun. Fasilitas & gedung tidak dihitung.'"></dd>
            </dl>
          </template>
        </div>
      </div>
    </div>

    <div class="card mt">
      <div class="card-h"><div><h3>Aturan 4 kelas (urutan = prioritas)</h3><p x-text="'Versi ' + cfg.rule + ' · diuji: September 2026 sama dengan laporan (Alam 2.900, Prasarana 991, Sarana 5.435, Operasional 5.049 menit)'"></p></div></div>
      <div class="card-b">
        <div class="tbl-x"><table class="tbl"><thead><tr><th>#</th><th>Kelas</th><th>Kategori sumber</th><th>Pola Subgangguan</th><th>Catatan</th></tr></thead><tbody>
          <template x-for="(r, i) in cfg.classRules" :key="i"><tr><td x-text="i + 1"></td><td><b x-text="$store.app.classLabel(r.kelas)"></b></td><td x-text="r.kategori.join(', ') || 'Semua kategori (pola Subgangguan)'"></td><td><code style="font-size:12px" x-text="r.sub"></code></td><td x-text="r.catatan"></td></tr></template>
          <tr><td x-text="cfg.classRules.length + 1"></td><td><b>Operasional, pelayanan & keamanan</b></td><td colspan="3">Semua yang tidak cocok aturan di atas.</td></tr>
        </tbody></table></div>
      </div>
    </div>

    <div class="grid g-2 mt">
      <div class="card">
        <div class="card-h"><div><h3>Definisi</h3></div></div>
        <div class="card-b">
          <dl class="kv">
            <dt>Frekuensi</dt><dd>Jumlah kejadian (baris Gangguan_Induk dengan Kunci asal).</dd>
            <dt>Total kelambatan</dt><dd>Jumlah kolom Total Andil Kelka (menit). Satu-satunya angka durasi.</dd>
            <dt>Kejadian berat</dt><dd x-text="'Kelambatan ≥ ' + cfg.heavy + ' menit (scorecard); Top 3 memakai ≥ ' + cfg.top + ' menit.'"></dd>
            <dt>Lokasi</dt><dd>Petak jalan bila tercatat dan dikenali GAPEKA, selain itu stasiun.</dd>
            <dt>Perlintasan</dt><dd>Tertemper kendaraan, kendaraan mogok, palang tertabrak, rombongan pejabat, perlintasan ramai. Temperan orang/hewan dihitung terpisah.</dd>
            <dt>Unit sarana</dt><dd>Nomor sarana pertama per kejadian, dicocokkan ke Referensi Sarana.</dd>
            <dt>Eksposur</dt><dd x-text="'Menit ÷ 60 × rate (Penumpang Rp ' + KAI.fmt.n(cfg.rate.PENUMPANG) + ', Barang Rp ' + KAI.fmt.n(cfg.rate.BARANG) + ' per jam). Jenis KA dari LIST KA/Daftar Waktu GAPEKA 2025. Indikatif — rincian di halaman Eksposur pendapatan.'"></dd>
            <dt>Insight</dt><dd>Setiap kalimat dihitung dari kejadian yang sedang dipilih; tidak ada teks bebas.</dd>
          </dl>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><div><h3>Rujukan rekomendasi</h3><p>Diperiksa ke sumber asli (Okt 2026). Rekomendasi tampil hanya bila pemicunya ada di data.</p></div></div>
        <div class="card-b tbl-wrap" style="max-height:420px">
          <table class="tbl"><tbody>
            <template x-for="l in lit" :key="l.cite"><tr><td><b x-text="l.cite"></b><div><a :href="l.url" target="_blank" rel="noopener" x-text="l.title"></a></div><div class="note" x-text="l.inti"></div></td></tr></template>
          </tbody></table>
        </div>
      </div>
    </div>

    <div class="card mt">
      <div class="card-h"><div><h3>Kata kunci kelompok komponen</h3><p x-text="'Versi ' + cfg.componentRule + ' · dicocokkan ke teks Subgangguan kelas sarana'"></p></div></div>
      <div class="card-b"><div class="tbl-x"><table class="tbl"><tbody><template x-for="c in cfg.components" :key="c.id"><tr><td style="width:220px"><b x-text="c.label"></b></td><td><code style="font-size:11.5px" x-text="c.re || '(sisanya)'"></code></td></tr></template></tbody></table></div></div>
    </div>
  </section>
</template>
<script>
document.addEventListener('alpine:init', function () {
  Alpine.data('vMeta', function () {
    return {
      get meta() { return this.$store.app.meta || {}; },
      get st() { return this.$store.app.status; },
      get cfg() { return this.$store.app.config; },
      get quality() { void this.$store.app.ver; return KAIA.quality(KAI.data.all); },
      get noHour() { void this.$store.app.ver; return KAI.data.all.filter(function (r) { return r.hm < 0; }).length; },
      get lit() { return Object.keys(KAIInsight.LIT).map(function (k) { return KAIInsight.LIT[k]; }); },
      get rs() { return this.$store.app.refReady ? KAIRef.ensureRoutes(KAI.data.ref).stats : {}; },
      get jplStat() { var R = this.$store.app.refReady && KAI.data.ref; if (!R) return {}; return { total: R.jpl.length, p190: R.jpl.filter(function (j) { return j.p190; }).length, pair: R.jpl.filter(function (j) { return j.pairKey; }).length, seg: R.jpl.filter(function (j) { return j.segKey; }).length }; },
      get match() {
        var s = (this.meta.stats || {});
        return [{ label: 'Nomor sarana → Referensi Sarana', ok: s.saranaMatched, all: s.saranaAny },
          { label: 'Lokasi (petak/stasiun) → GAPEKA', ok: s.lokMatched, all: s.lokAny },
          { label: 'Nomor KA → LIST KA / Daftar Waktu (termasuk ' + KAI.fmt.n(s.kaViaJoint || 0) + ' via nomor gabungan, ' + KAI.fmt.n(s.kaViaBase || 0) + ' via nomor dasar)', ok: s.kaMatched, all: s.kaAny },
          { label: 'Baris dengan tanggal valid', ok: (s.source || 0) - (s.noDate || 0), all: s.source },
          { label: 'Baris dengan jam mulai terbaca', ok: s.timeOk, all: s.source }];
      }
    };
  });
});
</script>
