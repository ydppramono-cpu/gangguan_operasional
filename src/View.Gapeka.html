<!-- View.Gapeka — grafik perjalanan KA (diagram Marey waktu × km) per judul lintas Lembar GAPEKA 2026, dengan filter lintas, jam, dan jenis KA. -->
<template x-if="$store.app.route === 'gapeka'">
  <section class="view" x-data="vGapeka">
    <div class="card">
      <div class="card-h">
        <div>
          <h3>Grafik perjalanan KA · GAPEKA 2026</h3>
          <p x-text="cur ? ('Lembar ' + cur.lembar + ' · ' + cur.wilayah + ' · ' + cur.halaman) : 'Diagram waktu × kilometer sesuai Lembar GAPEKA (berlaku 1 Desember 2026)'"></p>
        </div>
      </div>
      <div class="card-b">
        <template x-if="state === 'loading'"><div class="skel" style="height:320px" aria-busy="true"></div></template>
        <template x-if="state === 'error'"><div class="empty" role="alert"><b>Gagal memuat data GAPEKA 2026.</b> <span x-text="err"></span>
          <div class="mt-s"><button class="btn sm" @click="init()">Coba lagi</button></div></div></template>

        <div x-show="state === 'ready'">
          <div class="mr-ctl" role="group" aria-label="Filter grafik perjalanan">
            <div class="field mr-lintas">
              <label for="mr-lintas">Judul lintas</label>
              <select id="mr-lintas" class="ctl" x-model="lid" @change="redraw(true)">
                <template x-for="g in groups" :key="g.lembar">
                  <optgroup :label="'Lembar ' + g.lembar + ' · ' + g.wilayah">
                    <template x-for="l in g.items" :key="l.id"><option :value="l.id" :selected="l.id === lid" x-text="l.judul"></option></template>
                  </optgroup>
                </template>
              </select>
            </div>
            <div class="field">
              <label for="mr-q">Cari lintas/stasiun</label>
              <input id="mr-q" class="ctl" type="search" x-model.debounce.250ms="q" placeholder="mis. Bandung, Merak, KPT" @keydown.enter.prevent="pickFirst()">
            </div>
            <div class="field">
              <label for="mr-h0">Jam</label>
              <select id="mr-h0" class="ctl sm" x-model.number="h0" @change="redraw()"><template x-for="h in 24" :key="h"><option :value="h - 1" :selected="h - 1 === h0" x-text="String(h - 1).padStart(2, '0') + ':00'"></option></template></select>
              <div class="seg" role="group" aria-label="Rentang jam">
                <template x-for="d in [2, 4, 8, 12, 24]" :key="d"><button :aria-pressed="dur === d" @click="dur = d; redraw()" x-text="d + ' j'"></button></template>
              </div>
            </div>
            <div class="field">
              <label for="mr-ka">Sorot KA</label>
              <input id="mr-ka" class="ctl" style="width:96px" type="search" x-model.debounce.250ms="hiNo" @input.debounce.250ms="redraw()" placeholder="No. KA">
            </div>
          </div>
          <div class="mr-ctl mt-s">
            <div class="chips" role="group" aria-label="Jenis KA">
              <template x-for="k in katList" :key="k.id">
                <button class="chip sm" :aria-pressed="kat[k.id] ? 'true' : 'false'" @click="kat[k.id] = !kat[k.id]; redraw()">
                  <span class="sw" :style="'background:' + k.color"></span><span x-text="k.label + ' (' + (counts[k.id] || 0) + ')'"></span>
                </button>
              </template>
            </div>
            <div class="spacer"></div>
            <label class="field"><input type="checkbox" x-model="showNo" @change="redraw()"> Nomor KA</label>
            <label class="field" x-show="hasUnverified"><input type="checkbox" x-model="verifOnly" @change="redraw()"> Hanya terverifikasi</label>
            <div class="seg" role="group" aria-label="Skala kilometer">
              <button @click="zoom(-1)" title="Perkecil skala km" aria-label="Perkecil skala km"><svg class="i"><use href="#i-zout"/></svg></button>
              <button @click="zoom(1)" title="Perbesar skala km" aria-label="Perbesar skala km"><svg class="i"><use href="#i-zin"/></svg></button>
            </div>
            <button class="btn sm" @click="png()"><svg class="i"><use href="#i-image"/></svg>PNG</button>
          </div>

          <div class="mr-wrap mt-s" x-ref="wrap" @mousemove="hover($event)" @mouseleave="tip = null" @click="pin($event)">
            <div class="mr-host" x-ref="host"></div>
            <div class="mr-tip" x-show="tip" x-cloak :style="tip ? ('left:' + tip.x + 'px;top:' + tip.y + 'px') : ''" role="status">
              <template x-if="tip"><div>
                <b x-text="'KA ' + tip.no"></b> <span x-text="tip.nama"></span>
                <div class="muted" x-text="tip.relasi + ' · ' + tip.kelas"></div>
                <div x-text="tip.a"></div><div x-text="tip.b"></div>
                <div class="muted" x-show="!tip.v">Sumber OCR — belum terverifikasi penuh</div>
              </div></template>
            </div>
          </div>
          <p class="note mt-s" x-text="status"></p>
          <template x-if="cur && !nTracks"><div class="empty">Tidak ada perjalanan KA di Buku Daftar Waktu 2026 untuk lintas ini pada jenis yang dipilih (lembar mungkin hanya memuat KA dinas/langsir).</div></template>
        </div>
      </div>
    </div>

    <div class="card mt">
      <div class="card-h"><div><h3>Sumber & cara membaca</h3><p>Data apa adanya dari dokumen GAPEKA 2026; yang tidak terbaca ditandai, tidak diperkirakan</p></div></div>
      <div class="card-b">
        <dl class="kv">
          <dt>Judul lintas</dt><dd>Sama dengan judul pada Lembar GAPEKA 2026 (Lampiran I KP-DJKA 116 Tahun 2026). Satu lembar bisa memuat beberapa lintas; pilih di daftar "Judul lintas".</dd>
          <dt>Sumbu km</dt><dd>Urutan stasiun dan jarak dari matriks "Jarak Antar Stasiun" Buku Penomoran 2026; halte yang hanya tercetak di sumbu lembar disisipkan memakai kolom jarak lembar. Label stasiun yang terlalu rapat digeser dan diberi garis penunjuk ke posisi km sebenarnya.</dd>
          <dt>Garis KA</dt><dd>Jam datang/berangkat dari Buku Daftar Waktu 2026. Stasiun yang dilewati tanpa jam ("Ls –") atau berhenti sebentar tanpa jam ("Berh Sb") tidak diberi titik; garis disambung lurus. Garis putus-putus = KA barang; garis titik-strip = KA fakultatif.</dd>
          <dt>Nomor KA</dt><dd>Ditulis hanya bila tidak menumpuk nomor lain; arahkan kursor ke garis untuk melihat semua detail.</dd>
          <dt>Sumatera</dt><dd>Buku Daftar Waktu Divre I–IV berupa gambar dan dibaca dengan OCR. KA yang jam awal–akhirnya cocok dengan Buku Penomoran ditandai terverifikasi; lainnya tampil lebih pudar dan bisa disembunyikan.</dd>
          <dt>Belum tercakup</dt><dd>KA dinas (lokomotif/rangkaian) tidak ada di Buku Daftar Waktu sehingga tidak digambar. Lintas Panarukan–Kalisat belum ada jaraknya di Buku Penomoran.</dd>
        </dl>
      </div>
    </div>
  </section>
</template>
<script>
document.addEventListener('alpine:init', function () {
  var root = window;
  Alpine.data('vGapeka', function () {
    var D = null, L = null, ro = null;
    return {
      state: 'loading', err: '', groups: [], lid: '', q: '', h0: 6, dur: 8, hiNo: '', showNo: true, verifOnly: false, pxKm: 3,
      kat: { pjj: true, lokal: true, krl: true, barang: true, dinas: true, lainnya: true }, counts: {}, tip: null, pinned: null,
      status: '', nTracks: 0, hasUnverified: false, cur: null,
      get katList() { var K = KAIM.KAT; return Object.keys(K).filter(function (k) { return k !== 'lainnya' || this.counts.lainnya; }, this).map(function (k) { return { id: k, label: K[k].label, color: K[k].color }; }); },
      init: function () {
        var self = this; self.state = 'loading';
        KAIM.load(KAI.api, KAI.gunzipJson).then(function (d) {
          D = d; self.state = 'ready'; self.filterGroups();
          var saved = KAI.store.get('gapeka.lid');
          self.lid = (saved && d.lintasById[saved]) ? saved : d.lintas[0].id;
          if (root.innerWidth < 640) self.dur = 4;
          self.$nextTick(function () {
            self.redraw(true);
            if (!ro && root.ResizeObserver) { ro = new ResizeObserver(function () { self.redraw(); }); ro.observe(self.$refs.wrap); }
          });
          self.$watch('q', function () { self.filterGroups(); });
        }).catch(function (e) { self.state = 'error'; self.err = e.message || String(e); });
      },
      filterGroups: function () {
        var q = String(this.q || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        this.groups = D.groups.map(function (g) {
          return { lembar: g.lembar, wilayah: g.wilayah, items: g.items.filter(function (l) {
            if (!q) return true;
            var hay = (l.judul + ' ' + l.lembar + ' ' + l.wilayah + ' ' + l.st.map(function (s) { return s[0] + ' ' + s[1]; }).join(' ')).toUpperCase().replace(/[^A-Z0-9 ]/g, '').replace(/ /g, '');
            return hay.indexOf(q) >= 0;
          }) };
        }).filter(function (g) { return g.items.length; });
      },
      pickFirst: function () { if (this.groups.length) { this.lid = this.groups[0].items[0].id; this.redraw(true); } },
      zoom: function (d) { var z = [0.75, 1.5, 3, 5, 8, 12, 18]; var i = z.indexOf(this.pxKm); this.pxKm = z[Math.max(0, Math.min(z.length - 1, (i < 0 ? 2 : i) + d))]; this.redraw(); },
      redraw: function (changed) {
        if (!D || !this.$refs.host) return;
        var l = D.lintasById[this.lid]; if (!l) return;
        this.cur = l;
        if (changed) {
          KAI.store.set('gapeka.lid', this.lid);
          var all = KAIM.tracks(D, l, {}), c = {}, unv = false;
          all.forEach(function (t) { c[t.ka.kat] = (c[t.ka.kat] || 0) + 1; if (!t.ka.v) unv = true; });
          this.counts = c; this.hasUnverified = unv;
          var km = l.st[l.st.length - 1][2] || 1;
          this.pxKm = km > 200 ? 1.5 : km > 80 ? 3 : km > 30 ? 8 : 18;
        }
        var trs = KAIM.tracks(D, l, { kat: this.kat, verifOnly: this.verifOnly });
        this.nTracks = trs.length;
        var t0 = this.h0 * 3600, t1 = t0 + this.dur * 3600;
        L = KAIM.draw(this.$refs.host, { lintas: l, tracks: trs, t0: t0, t1: t1, pxKm: this.pxKm, showNo: this.showNo, highlight: String(this.hiNo || '').trim() });
        root.__mareyLayout = L;
        var vis = {}; L.segs.forEach(function (s) { vis[s.tr.ka.idx] = 1; });
        var nVis = Object.keys(vis).length;
        this.status = KAI.fmt.n(nVis) + ' perjalanan KA tampil pada ' + KAIM.hms(t0).slice(0, 5) + '–' + (t1 >= 86400 ? '24:00' : KAIM.hms(t1).slice(0, 5)) +
          ' dari ' + KAI.fmt.n(trs.length) + ' yang melewati lintas ini · ' + l.st.length + ' stasiun · ' + KAIM.km(l.st[l.st.length - 1][2]) + ' km' +
          (this.showNo && L.skipped ? ' · ' + KAI.fmt.n(L.skipped) + ' nomor KA tidak ditulis agar tidak bertumpuk (arahkan kursor)' : '');
      },
      hover: function (ev) {
        if (!L || this.pinned) return;
        var r = this.$refs.host.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
        var h = KAIM.hit(L, x, y, 7);
        if (!h) { this.tip = null; return; }
        var s = h.s, k = s.tr.ka, nm = function (c) { var st = L && D.lintasById[this.lid].st.filter(function (q) { return q[0] === c; })[0]; return st ? (st[1] || c) : c; }.bind(this);
        this.tip = { no: k.no, nama: k.nama, relasi: k.relasi, kelas: k.kelas || KAIM.KAT[k.kat].label, v: k.v,
          a: nm(s.a.kode) + ' ' + (s.a.j ? 'brk ' : 'dtg ') + KAIM.hms(s.a.t), b: nm(s.b.kode) + ' ' + (s.b.j ? 'brk ' : 'dtg ') + KAIM.hms(s.b.t),
          x: Math.min(x + 14, r.width - 230), y: y + 14 };
      },
      pin: function (ev) { if (this.pinned) { this.pinned = null; this.hover(ev); } else if (this.tip) { this.pinned = this.tip.no; this.hiNo = this.tip.no; this.redraw(); } },
      png: function () {
        var cv = this.$refs.host.querySelector('canvas'); if (!cv) return;
        var a = document.createElement('a'), l = D.lintasById[this.lid];
        a.download = 'GAPEKA2026_' + l.lembar.replace(/\s+/g, '') + '_' + l.judul.replace(/[^A-Za-z0-9]+/g, '_').slice(0, 60) + '_' + String(this.h0).padStart(2, '0') + '-' + String(Math.min(24, this.h0 + this.dur)).padStart(2, '0') + '.png';
        a.href = cv.toDataURL('image/png'); a.click();
      },
      destroy: function () { if (ro) { ro.disconnect(); ro = null; } }
    };
  });
});
</script>
