  /** Analisis sarana: RHI bulan ym (atau bulan RHI terakhir ≤ ym) × gangguan sarana per nomor lokomotif. */

        rams: h[H.rams], rel: h[H.rel], mtb: h[H.mtb], av: h[H.av], mi: h[H.mi], ci: h[H.ci], on: h[H.on], pt: h[H.pt], tp: h[H.tp], req: h[H.req], okReq: h[H.ok],
        g: gStat(Lm), g3: gStat(L3), gYtd: gStat(L), gList: Lm.sort(function (a, b) { return b.menit - a.menit; }),

  }

  /* =====================================================================================================
