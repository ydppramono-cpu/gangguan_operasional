<!-- View.Sarana — Sarana & armada per jenis (Lokomotif · Kereta · Gerbong). Tiap jenis: Ringkasan, Kesehatan × gangguan, Depo & Balai Yasa, Daftar unit.
     Mesin: KAIS (Js.Sarana). Sumber: SAP, Buku Dukungan Sarana GAPEKA 2025, RHI lokomotif, Gangguan_Induk. KRL/KRD belum dihitung. -->
<template x-if="$store.app.route === 'sarana' && $store.app.R">
  <section class="view" x-data="vSarana">
    <template x-if="!$store.app.refReady"><div class="card"><div class="card-b"><div class="skel" style="height:320px"></div><p class="note">Memuat Referensi Sarana, Buku Dukungan Sarana, dan RHI…</p></div></div></template>
    <template x-if="$store.app.refReady && S">
      <div>
        <!-- Pemilih armada -->
        <div class="fleet-switch" role="tablist" aria-label="Jenis sarana">
          <template x-for="k in kinds" :key="k.kind">
            <button role="tab" class="fleet-card" :aria-selected="kind === k.kind" @click="kind = k.kind">
              <span class="fc-ic"><svg class="i"><use :href="'#' + k.icon"/></svg></span>
              <span class="fc-body">
                <span class="fc-name" x-text="k.kind"></span>
                <span class="fc-big"><b x-text="KAI.fmt.n(k.A.n)"></b> unit</span>
                <span class="fc-meta" x-text="KAI.fmt.n(k.A.sg) + ' siap guna GAPEKA · ' + KAI.fmt.n(k.p.n) + ' gangguan ' + R.P.short"></span>
              </span>
              <span class="fc-score" :class="scoreCls(k.A.health)"><b x-text="KAI.fmt.d1(k.A.health)"></b><small x-text="k.kind === 'Lokomotif' ? 'RHI rata-rata' : 'skor turunan'"></small></span>
            </button>
          </template>
        </div>

        <div class="tabs mt" role="tablist" :aria-label="'Analisis ' + kind">
          <button role="tab" :aria-selected="tab === 'ringkasan'" @click="tab = 'ringkasan'">Ringkasan</button>
          <button role="tab" :aria-selected="tab === 'kesehatan'" @click="tab = 'kesehatan'" x-text="kind === 'Lokomotif' ? 'Kesehatan (RHI) × gangguan' : 'Kesehatan × gangguan'"></button>
          <button role="tab" :aria-selected="tab === 'depo'" @click="tab = 'depo'">Depo & Balai Yasa</button>
          <button role="tab" :aria-selected="tab === 'unit'" @click="tab = 'unit'">Daftar unit</button>
        </div>

        <!-- ================= RINGKASAN ================= -->
        <div x-show="tab === 'ringkasan'">
          <p class="note story" x-text="story"></p>
          <!-- v3.17: kartu "Armada" dihapus (sama dengan kartu jenis di atas). Grafik utama di depan, lalu daftar. -->
          <div class="grid g-3">
            <div class="card kpi" style="--kpi-c:var(--c-sarana)"><div class="lbl" x-text="'Gangguan · ' + R.P.short"></div><div class="val num" x-text="KAI.fmt.n(Pk.n)"></div>
              <div class="deltas"><span class="delta" :class="KAI.delta(Pk.n, Pp.n).cls" x-text="'MoM ' + KAI.delta(Pk.n, Pp.n).text"></span></div>
              <div class="note" x-text="KAI.fmt.n(Pk.menit) + ' menit · ' + KAI.fmt.n(Pk.units.length) + ' unit terganggu' + (Pk.noUnit ? ' · ' + Pk.noUnit + ' tanpa nomor sarana' : '')"></div></div>
            <div class="card kpi" style="--kpi-c:var(--kai-orange)"><div class="lbl">Laju gangguan 12 bulan</div><div class="val num"><span x-text="KAI.fmt.d1(A.rate)"></span><small>per 100 unit</small></div>
              <div class="note" x-text="KAI.fmt.n(A.n12) + ' kejadian · ' + KAI.fmt.n(A.hit) + ' unit pernah terganggu (' + KAI.fmt.d1(A.n ? A.hit / A.n * 100 : 0) + '%)'"></div></div>
            <div class="card kpi" :style="'--kpi-c:' + (A.old / Math.max(A.n, 1) > .3 ? 'var(--bad)' : 'var(--c-prasarana)')"><div class="lbl" x-text="'Usia > ' + R.cfg.ageWarn + ' tahun'"></div><div class="val num" x-text="KAI.fmt.n(A.old)"></div>
              <div class="note" x-text="KAI.fmt.d1(A.n ? A.old / A.n * 100 : 0) + '% armada · median usia ' + KAI.fmt.age(A.ageMed)"></div></div>
          </div>


          <div class="mt">
            <div class="card">
              <div class="card-h"><div><h3>Gangguan & durasi per bulan</h3><p x-text="'Area = kejadian ' + kind.toLowerCase() + ' per bulan (sumbu kiri, penanda = bulan tertinggi) · garis putus = menit per kejadian (sumbu kanan)'"></p></div></div>
              <div class="card-b fill"><div class="chart short" x-chart="comboMonthly()"></div></div>
            </div>
          </div>
          <div class="mt">
            <div class="card">
              <div class="card-h"><div><h3 x-text="'Unit berulang · ' + R.p3.label"></h3><p>≥2 kejadian dalam 3 bulan & muncul di periode aktif · klik untuk kartu unit</p></div></div>
              <div class="card-b tbl-wrap"><table class="tbl"><thead><tr><th>Unit</th><th class="num">Kej.</th><th class="num">Menit</th><th class="num">Usia</th><th>Kesehatan</th><th>Rincian (bulan: gangguan, menit)</th></tr></thead><tbody>
                <template x-for="u in repeat" :key="u.unit"><tr class="click" @click="$store.app.openUnit(u.unit)">
                  <td style="white-space:nowrap"><b x-text="KAI.fmt.unit(u.unit)"></b><div class="note" x-text="(S.U[u.unit] || {}).cls || ''"></div></td>
                  <td class="num" x-text="u.n + '×'"></td><td class="num"><b x-text="KAI.fmt.n(u.menit)"></b></td>
                  <td class="num"><span :class="(S.U[u.unit] || {}).age > R.cfg.ageWarn && 'badge bad'" x-text="KAI.fmt.age((S.U[u.unit] || {}).age)"></span></td>
                  <td><span class="st" :class="stCls((S.U[u.unit] || {}).status)" x-text="healthTxt(S.U[u.unit])"></span></td>
                  <td style="font-size:12.5px" x-text="u.events.map(function (e) { return KAI.fmt.monOnly(e.ym) + ': ' + (e.sub || '').replace(/^[^-]+-\s*/, '') + ' (' + KAI.fmt.n(e.menit) + ')'; }).join(' · ')"></td>
                </tr></template>
              </tbody></table><div class="empty" x-show="!repeat.length">Tidak ada unit berulang untuk jenis ini.</div></div>
              <div x-pita="'sarana:berulang'"></div>
            </div>
          </div>

          <div class="grid g-2 mt">
            <div class="card">
              <div class="card-h"><div><h3>Jenis gangguan berulang</h3><p x-text="'≥2 kejadian · ' + R.label + ' · klik untuk menelusuri'"></p></div></div>
              <div class="card-b tbl-wrap"><table class="tbl"><thead><tr><th>Jenis gangguan</th><th class="num">Kej.</th><th class="num">Unit</th><th class="num">Menit</th><th>Wilayah dominan</th></tr></thead>
                <tbody><template x-for="x in Pk.kinds.slice(0, 12)" :key="x.jenis"><tr class="click" @click="$store.app.go('telusuri', { ids: x.ids, label: kind + ' · ' + x.jenis, period: 'all' })"><td x-text="x.jenis"></td><td class="num" x-text="x.n"></td><td class="num" x-text="x.units"></td><td class="num" x-text="KAI.fmt.n(x.menit)"></td><td x-text="x.wilayah"></td></tr></template></tbody>
              </table><div class="empty" x-show="!Pk.kinds.length">Tidak ada jenis gangguan dengan ≥2 kejadian.</div></div>
            </div>
            <div class="card">
              <div class="card-h"><div><h3>Kelompok komponen</h3><p x-text="'Luas kotak = menit ' + kind.toLowerCase() + ' · ' + R.P.short + ' · kata kunci ' + R.cfg.componentRule + ' · data per komponen lewat menu unduh grafik'"></p></div></div>
              <div class="card-b fill"><div class="chart" x-show="comp.length" x-chart="compTree()"></div><div class="empty" x-show="!comp.length">Belum ada menit gangguan berkomponen pada periode ini.</div></div>
            </div>
          </div>
        </div>

        <!-- ================= KESEHATAN × GANGGUAN ================= -->
        <div x-show="tab === 'kesehatan'">
          <template x-if="tab === 'kesehatan' && kind === 'Lokomotif'"><div><?!= include('Part.RhiSarana'); ?>
</div></template>
          <template x-if="tab === 'kesehatan' && kind !== 'Lokomotif'">
            <div>
              <?!= include('Part.RhiKG'); ?>
              <div class="grid g-4 mt">
                <template x-for="b in dbands" :key="b.k"><div class="card kpi" :style="'--kpi-c:' + b.c"><div class="lbl" x-text="b.k + ' · skor turunan ' + b.r"></div><div class="val num" x-text="KAI.fmt.n(b.n)"></div><div class="note" x-text="KAI.fmt.d1(A.n ? b.n / A.n * 100 : 0) + '% armada · ' + KAI.fmt.n(b.g) + ' gangguan 12 bulan'"></div></div></template>
                <div class="card kpi"><div class="lbl">RHI resmi</div><div class="val num" x-text="$store.rhikg.state === 'ready' ? 'Tersambung' : '–'"></div><div class="note" x-text="$store.rhikg.state === 'ready' ? 'lihat bagian RHI resmi di atas' : 'menunggu sinkron RHI kereta & gerbong'"></div></div>
              </div>
              <div class="grid g-2 mt">
                <div class="card"><div class="card-h"><div><h3>Skor turunan × laju gangguan</h3><p>Batang = unit per kelas skor (sumbu kiri) · garis = gangguan 12 bulan per 100 unit (sumbu kanan; kelompok &lt; 30 unit tidak digaris — basis kecil)</p></div></div>
                  <div class="card-b fill"><div class="chart tall" x-chart="comboScore()"></div></div></div>
                <div class="card"><div class="card-h"><div><h3>Usia armada × laju gangguan</h3><p x-text="'Unit per kelompok usia · garis = gangguan 12 bulan per 100 unit (kelompok < 30 unit tidak digaris) · ' + kind.toLowerCase()"></p></div></div>
                  <div class="card-b fill"><div class="chart tall" x-chart="comboAge()"></div></div><div x-pita="'sarana:usia'"></div></div>
              </div>
              <div class="card mt"><div class="card-h"><div><h3 x-text="'Daftar pantau ' + kind.toLowerCase() + ': skor turunan terendah'"></h3><p>Diurutkan dari skor terendah · klik untuk kartu unit</p></div></div>
                <div class="card-b tbl-wrap"><table class="tbl"><thead><tr><th>Unit</th><th>Kelas</th><th>Depo (SAP)</th><th class="num">Usia</th><th class="num">Gangguan 12 bulan</th><th class="num">Menit</th><th>GAPEKA 2025</th><th class="num">Skor</th></tr></thead><tbody>
                  <template x-for="u in watch" :key="u.no"><tr class="click" @click="$store.app.openUnit(u.no)"><td><b x-text="KAI.fmt.unit(u.no)"></b></td><td x-text="u.cls"></td><td x-text="u.depoLabel"></td><td class="num" :title="u.ageBad ? 'Tanggal mulai dinas SAP tidak wajar — periksa data' : ''" x-text="u.ageBad ? 'periksa (' + KAI.fmt.age(u.ageRaw) + ')' : KAI.fmt.age(u.age)"></td><td class="num" x-text="u.n12"></td><td class="num" x-text="KAI.fmt.n(u.m12)"></td>
                    <td x-text="u.inBY ? 'Di Balai Yasa' : u.duk ? 'Siap guna · ' + u.duk.depo : 'Tidak tercantum'"></td><td class="num"><span class="st" :class="stCls(u.status)" x-text="KAI.fmt.d1(u.health)"></span></td></tr></template>
                </tbody></table></div></div>
            </div>
          </template>
        </div>

        <!-- ================= DEPO & BALAI YASA ================= -->
        <div x-show="tab === 'depo'">
          <p class="note story">Klasemen kekuatan depo: gabungan kesehatan armada, keandalan (gangguan per 100 unit dibanding median jaringan), porsi armada ≤ 30 tahun, dan kesiapan menurut Buku Dukungan Sarana GAPEKA 2025. Depo &lt; 10 unit ditampilkan tanpa peringkat. Klik baris untuk profil kekuatan depo.</p>
          <div class="grid g-2-1">
            <div class="card"><div class="card-h"><div><h3 x-text="'Kekuatan depo ' + kind.toLowerCase()"></h3><p>Indeks kekuatan 0–100 (warna = rentang) · label = indeks · gangguan 12 bulan per 100 unit</p></div></div>
              <div class="card-b fill"><div class="chart tall" x-chart="comboDepo()"></div></div></div>
            <div class="card"><div class="card-h"><div><h3>Balai Yasa & kesiapan GAPEKA</h3><p x-text="kind + ' · Buku Dukungan Sarana GAPEKA 2025 vs Referensi Sarana SAP'"></p></div></div>
              <div class="card-b">
                <dl class="facts2">
                  <div><dt>Tercantum siap guna (GAPEKA)</dt><dd x-text="KAI.fmt.n(A.sg) + ' unit'"></dd></div>
                  <div><dt>Terdaftar di SAP</dt><dd x-text="KAI.fmt.n(A.n) + ' unit'"></dd></div>
                  <div><dt>Tidak tercantum di GAPEKA</dt><dd x-text="KAI.fmt.n(A.n - A.sg - A.by) + ' unit'"></dd></div>
                  <div><dt>Sedang di Balai Yasa (SAP)</dt><dd x-text="KAI.fmt.n(A.by) + ' unit'"></dd></div>
                </dl>
                <div class="tbl-wrap mt-s"><table class="tbl"><thead><tr><th>Wilayah buku</th><th class="num">SG</th><th class="num">SO</th><th class="num">SF</th><th class="num">Cad.</th></tr></thead><tbody>
                  <template x-for="b in bookRows" :key="b[0]"><tr><td x-text="b[0]"></td><td class="num" x-text="KAI.fmt.n(b[1][0])"></td><td class="num" x-text="KAI.fmt.n(b[1][1])"></td><td class="num" x-text="KAI.fmt.n(b[1][2])"></td><td class="num" x-text="KAI.fmt.n(b[1][3])"></td></tr></template>
                </tbody></table></div>
                <p class="note">SG = siap guna · SO = siap operasi · SF = stamformasi · Cad. = cadangan (Buku Dukungan Sarana GAPEKA 2025).</p>
                <p class="note" x-show="BY.length" x-text="'Di Balai Yasa: ' + BY.map(function (u) { return KAI.fmt.unit(u.no) + ' (' + u.depoLabel + ')'; }).join(', ')"></p>
                <p class="note" x-show="!BY.length">Tidak ada unit jenis ini yang tercatat di Balai Yasa pada SAP.</p>
              </div></div>
          </div>
          <div class="card mt">
            <div class="card-h"><div><h3 x-text="'Klasemen depo ' + kind.toLowerCase()"></h3><p x-text="'Gangguan = 12 bulan s.d. ' + KAI.fmt.day(S.end) + (kind === 'Lokomotif' ? ' · SO/SG, km & KA dilayani dari dinasan lok GAPEKA 2025' : '')"></p></div></div>
            <div class="card-b"><div x-table="depoTable" @row-click="$store.app.open('depo', $event.detail.id)"></div></div>
          </div>
        </div>

        <!-- ================= DAFTAR UNIT ================= -->
        <div x-show="tab === 'unit'">
          <div class="card">
            <div class="card-h"><div><h3 x-text="'Semua ' + kind.toLowerCase() + ' · ' + KAI.fmt.n(unitRows.length) + ' unit'"></h3><p>Cari nomor/kelas/depo · klik baris untuk kartu unit (riwayat gangguan, perawatan, dinasan, atribut)</p></div><div class="spacer"></div>
              <input class="ctl sm" type="search" placeholder="Cari unit, kelas, depo" x-model.debounce.250ms="q" aria-label="Cari unit">
              <button class="btn sm" @click="exportUnits()">Excel</button></div>
            <div class="card-b"><div x-table="unitTable" @row-click="$store.app.openUnit($event.detail.no)"></div></div>
          </div>
        </div>
        <p class="note mt">KRL, KRD, dan pembangkit belum dihitung di halaman ini (gangguannya tetap masuk Ringkasan eksekutif & Telusuri). Skor kekuatan dan skor turunan adalah indikator internal. RHI resmi: lokomotif dari tab RHI basis data utama; kereta & gerbong dari spreadsheet KAI | RHI Sarana (Agu–Okt 2026).</p>
      </div>
    </template>
  </section>
</template>
<script>
document.addEventListener('alpine:init', function () {
  var memo = { k: '', v: null };
  var ICON = { Lokomotif: 'i-loco', Kereta: 'i-coach', Gerbong: 'i-wagon' };
  Alpine.data('vSarana', function () {
    return {
      q: '',
      get kind() { return { lok: 'Lokomotif', ker: 'Kereta', ger: 'Gerbong' }[String(this.$store.app.vtab.fleet || 'lok')] || 'Lokomotif'; },
      set kind(v) { this.$store.app.vtab.fleet = { Lokomotif: 'lok', Kereta: 'ker', Gerbong: 'ger' }[v]; },
      get tab() { var t = this.$store.app.vtab.sarana; return t === 'rhi' ? 'kesehatan' : t === 'armada' || t === 'gangguan' ? (t === 'armada' ? 'depo' : 'ringkasan') : t || 'ringkasan'; },
      set tab(v) { this.$store.app.vtab.sarana = v; },
      get R() { return this.$store.app.R; },
      get regs() { return this.$store.app.f.wilayah || []; },
      /** Mesin armada — dihitung sekali per (versi data, akhir periode). Filter wilayah = lokasi depo SAP. */
      get S() {
        var app = this.$store.app; if (!app.refReady) return null;
        var end = KAIA.endOf(this.R.P), k = app.ver + '|' + end;
        if (memo.k !== k) memo = { k: k, v: KAIS.build(KAI.data.ref, KAI.data.all, end, this.R.cfg) };
        return memo.v;
      },
      inReg: function (u) { var W = this.regs; return !W.length || W.indexOf(u.region) >= 0; },
      get units() { var self = this; return this.S.byKind[this.kind].units.filter(function (u) { return self.inReg(u); }); },
      get A() { var L = this.units, S = this.S; if (!this.regs.length) return S.byKind[this.kind].all; return this.aggOf(L); },
      aggOf: function (L) {
        var ages = L.map(function (u) { return u.age; }).filter(function (a) { return a != null; }), hs = L.map(function (u) { return u.health; }), n12 = KAIA.sum(L, function (u) { return u.n12; }), aw = this.R.cfg.ageWarn;
        return { n: L.length, sg: L.filter(function (u) { return u.duk; }).length, by: L.filter(function (u) { return u.inBY; }).length, ageMed: ages.length ? KAIA.median(ages) : null, old: ages.filter(function (a) { return a > aw; }).length,
          health: hs.length ? Math.round(KAIA.sum(hs) / hs.length * 10) / 10 : null, n12: n12, m12: KAIA.sum(L, function (u) { return u.m12; }), rate: L.length ? n12 / L.length * 100 : 0, hit: L.filter(function (u) { return u.n12; }).length };
      },
      get kinds() { var self = this, S = this.S; return KAIS.KINDS.map(function (k) { var L = S.byKind[k].units.filter(function (u) { return self.inReg(u); }); return { kind: k, icon: ICON[k], A: self.regs.length ? self.aggOf(L) : S.byKind[k].all, p: KAIS.periodOf(S, self.R.L, k) }; }); },
      get Pk() { return KAIS.periodOf(this.S, this.R.L, this.kind); },
      get Pp() { return KAIS.periodOf(this.S, KAIA.sel(this.$store.app.scoped(), this.R.prevP), this.kind); },
      get story() {
        var A = this.A, P = this.Pk, f = KAI.fmt, k = this.kind.toLowerCase(), top = P.units.slice().sort(function (a, b) { return b.menit - a.menit; })[0];
        return 'Armada ' + k + ' ' + f.n(A.n) + ' unit, ' + f.d1(A.n ? A.sg / A.n * 100 : 0) + '% tercantum siap guna GAPEKA 2025. ' + this.R.label + ': ' + f.n(P.n) + ' gangguan (' + f.n(P.menit) + ' menit)' +
          (top ? '; terberat ' + f.unit(top.unit) + ' (' + f.n(top.menit) + ' menit)' : '') + '. Laju 12 bulan ' + f.d1(A.rate) + ' gangguan per 100 unit; ' + f.d1(A.n ? A.old / A.n * 100 : 0) + '% unit berusia > ' + this.R.cfg.ageWarn + ' tahun.';
      },
      get repeat() { var S = this.S, k = this.kind; return this.R.repeatUnits.filter(function (u) { return (S.U[u.unit] || {}).kind === k || (!S.U[u.unit] && u.events.some(function (e) { return S.kindOfEvent(e) === k; })); }).slice(0, 15); },
      get comp() { var k = this.kind; return this.R.comp.rows.map(function (c) { return { id: c.id, label: c.label, menit: c.menit, v: (c.byKind || {})[k] || 0 }; }).filter(function (c) { return c.v > 0; }).sort(function (a, b) { return b.v - a.v; }); },
      /** Treemap komponen: proporsi menit langsung terlihat (menggantikan tabel batang). */
      compTree: function () {
        var C = this.comp.filter(function (c) { return c.v > 0; }), T = KAIA.sum(C, function (c) { return c.v; }) || 1, pal = ['#252271', '#275BC0', '#0F766E', '#E0861A', '#B45309', '#7C3AED', '#64748B', '#C0392B'];
        return { textStyle: { fontFamily: 'Inter, Arial' }, tooltip: { formatter: function (p) { return '<b>' + p.name + '</b><br>' + KAI.fmt.n(p.value) + ' menit · ' + KAI.fmt.d1(p.value / T * 100) + '%'; } },
          series: [{ type: 'treemap', roam: false, nodeClick: false, breadcrumb: { show: false }, left: 0, right: 0, top: 0, bottom: 0, itemStyle: { borderColor: '#fff', borderWidth: 2, gapWidth: 2 },
            label: { show: true, formatter: function (p) { return p.name + '\n' + KAI.fmt.n(p.value) + ' menit · ' + KAI.fmt.d1(p.value / T * 100) + '%'; }, fontSize: 12, lineHeight: 16, color: '#fff' },
            data: C.map(function (c, i) { return { name: c.label, value: c.v, itemStyle: { color: pal[i % pal.length] } }; }) }] };
      },
      get compTot() { return KAIA.sum(this.comp, function (c) { return c.v; }); },
      get BY() { var self = this; return this.S.byKind[this.kind].by.filter(function (u) { return self.inReg(u); }); },
      get bookRows() { var D = KAI.data.ref.duksar, k = this.kind; if (!D || !D.tot) return []; return Object.keys(D.tot).filter(function (b) { return D.tot[b][k]; }).map(function (b) { return [b, D.tot[b][k]]; }); },
      get deps() { var self = this; return this.S.byKind[this.kind].depots.filter(function (d) { return !self.regs.length || self.regs.indexOf(d.region) >= 0; }); },
      get dbands() {
        var L = this.units, B = [['Baik', '≥ 80', '#1F8A2E'], ['Pantau', '60–80', '#E0861A'], ['Prioritas', '< 60', '#C0392B']];
        return B.map(function (b) { var l = L.filter(function (u) { return u.status === b[0]; }); return { k: b[0], r: b[1], c: b[2], n: l.length, g: KAIA.sum(l, function (u) { return u.n12; }) }; });
      },
