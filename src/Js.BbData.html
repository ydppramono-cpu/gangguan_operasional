<script>

window.BBK = (function () {

  /* ---------- format ---------- */
  var nf0 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }), nf1 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1, minimumFractionDigits: 1 });

    pct0: function (v) { return v == null || isNaN(v) ? '–' : nf0.format(v * 100) + '%'; },

  };

  K.tsm = function (s) { if (!s) return null; var d = Date.parse(String(s).replace(' ', 'T') + ':00+07:00'); return isNaN(d) ? null : d / 60000; }; // menit epoch
  K.esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  /* ---------- statistik ---------- */
  K.num = function (a) { return a.filter(function (x) { return x != null && !isNaN(x); }); };

    return (objCache[name] = out);

  K.cfg = function (k, d) { var r = K.rows('CONFIG').find(function (x) { return x.kunci === k; }); return r ? r.nilai : d; };

    K.rows('M_KA').forEach(function (k) {

      if (k.grup_kelka && k.grup_kelka.charAt(1) === '.' && k.mitra) ix.grupMitra[k.grup_kelka] = k.mitra;
      if (ix.versi.indexOf(k.versi) < 0) ix.versi.push(k.versi);
    });
    ix.versi.sort();
    ix.mitra = K.uniq(K.rows('M_KA').map(function (k) { return k.mitra; })).sort();
    ix.nama = K.uniq(K.rows('M_KA').map(function (k) { return k.nama_ka; })).sort();
    ix.term = K.uniq(K.rows('M_KA').filter(function (k) { return k.muatan === 'Isi'; }).map(function (k) { return k.sm; })).sort();
    ix.bongkar = K.uniq(K.rows('M_KA').filter(function (k) { return k.muatan === 'Isi'; }).map(function (k) { return k.sb; })).sort();
    ix.relasi = K.uniq(K.rows('M_KA').map(function (k) { return k.rel; })).sort();
    // SOP: relasi|lokasi|tahap -> median antar mitra/CY; lokasi|tahap -> rata-rata lokasi
    var a = {}, b = {};
    K.rows('SOP').forEach(function (s) {
      var rel = String(s.relasi_kode || '').replace(/\s/g, ''), lok = s.kode_lokasi_muat_bongkar, t = s.jenis_kegiatan, m = +s.menit;
      if (!lok || !t || isNaN(m)) return;
      (a[rel + '|' + lok + '|' + t] = a[rel + '|' + lok + '|' + t] || []).push(m); (b[lok + '|' + t] = b[lok + '|' + t] || []).push(m);
    });
    ix.sopRel = {}; ix.sopRelAda = {}; Object.keys(a).forEach(function (k) { ix.sopRel[k] = K.med(a[k]); ix.sopRelAda[k.split('|')[0]] = 1; });
    // v3.1: program per nomor KA (SOP kontrak per mitra/CY, pasangan KA isi–kosong, km)
    ix.pk = {}; ix.pkRel = {};
    (K.has('PROGRAM_KA') ? K.rows('PROGRAM_KA') : []).forEach(function (r) {
      ['dpi_menit', 'dpk_menit', 'km_isi', 'km_kosong', 'sop_muat_min', 'sop_muat_maks', 'sop_bongkar_min', 'sop_bongkar_maks', 'wpg_program_min_hari', 'wpg_program_maks_hari', 'wpg_pola_hari', 'pola_wtt_muat', 'pola_wtt_bongkar']
        .forEach(function (c) { r[c] = r[c] == null || r[c] === '' ? null : +r[c]; });
      r.tanpaSop = /^BELUM/.test(r.status_sop || ''); r.ganda = /^SOP GANDA/.test(r.status_sop || '');
      var m = ix.pk[r.versi] = ix.pk[r.versi] || {};
      [r.no_ka_isi, r.no_ka_kosong].forEach(function (no) { if (no) String(no).split('-').forEach(function (x) { m[x] = r; m[x.replace(/F$/, '')] = r; }); });
      (ix.pkRel[r.versi + '|' + r.relasi] = ix.pkRel[r.versi + '|' + r.relasi] || []).push(r);
    });
    ix.sopLok = {}; Object.keys(b).forEach(function (k) { ix.sopLok[k] = K.mean(b[k]); });
  };
  K.st = function (k) { return K.ix.st[k] || { kode: k, nama: k }; };
  K.stName = function (k) { var s = K.ix.st[k]; return s ? s.nama : k; };
  K.relName = function (r) { var p = String(r).split('-'); return p.map(K.stName).join(' – '); };
  K.ka = function (versi, no) { var v = K.ix.ka[versi] || {}; if (v[no]) return v[no]; var s = K.ix.seg[versi] || {}; return s[no] || s[String(no).split('-')[0]] || null; };
  K.sop = function (rel, lok, stageId) {
    var st = K.ST_BY[stageId]; if (!st || !st.sop) return null;
    var v = K.ix.sopRel[rel + '|' + lok + '|' + st.sop];
    // v3.1: relasi tanpa SOP kontrak tidak diberi SOP pengganti (keputusan pengguna 6 Nov 2026)

    return v == null ? null : v;
  };
  // Program per nomor KA (PROGRAM_KA). no = nomor KA isi atau kosong.
  K.progKa = function (versi, no) { var m = (K.ix.pk || {})[versi] || {}; if (no == null) return null; no = String(no); return m[no] || m[no.replace(/F$/, '')] || m[no.split('-')[0]] || null; };
  K.progRel = function (versi, rel) { return (K.ix.pkRel || {})[versi + '|' + rel] || []; };
  // Ringkasan SOP relasi dari PROGRAM_KA: {min, maks, status: 'tunggal'|'ganda'|'tanpa'}
  K.sopKa = function (versi, rel, side) {

    var a = Math.min.apply(null, mn), b = Math.max.apply(null, mx);

  };
  K.kmRel = function (versi, rel) { var R = K.progRel(versi, rel); return R.length ? K.med(R.map(function (r) { return r.km_isi; })) : null; };
  K.dist = function (a, b) { var d = K.ix.petak[a + '|' + b]; if (d != null) return d; var x = K.ix.st[a], y = K.ix.st[b]; return x && y && x.km != null && y.km != null ? Math.abs(x.km - y.km) : null; };

  /* ---------- filter global ---------- */
  K.F0 = function () { return { versi: 'GAPEKA 2025', m0: 1, m1: 9, wil: 'Sumsel', pem: 'Semua', mitra: '', nama: '', ka: '', sm: '', sb: '', mut: 'Semua', stat: 'mean' }; };
  // Statistik pusat yang dipakai seluruh halaman (rata-rata = sama dengan deck Siklus v8; median = tahan pencilan)

  K.sl = function () { return K.stat === 'median' ? 'median' : 'rata-rata'; };
  // Uji satu KA program (baris M_KA) terhadap filter (kecuali versi).
  K.kaOk = function (k, f, opt) {

  K.kaProg = function (f, versi, opt) { versi = versi || f.versi; return K.rows('M_KA').filter(function (k) { return k.versi === versi && K.kaOk(k, f, opt); }); };
  // Pemilik realisasi tanpa nomor KA (terminal): PTBA bila dimuat di Tanjungenim Baru.
  K.pemOfRel = function (rel) { return String(rel).indexOf('TMB') === 0 ? 'PTBA' : 'Swasta'; };
  K.monthOk = function (s, f) { if (!s) return false; var m = +String(s).slice(5, 7); return m >= f.m0 && m <= f.m1; };
  K.divOkSt = function (code, f) { if (f.wil === 'Sumsel') return true; var s = K.ix.st[code]; return s && s.divre === (f.wil === 'Divre III' ? 'DIVRE III' : 'DIVRE IV'); };

  /* ---------- realisasi: perjalanan (KELKA) ---------- */
  K.perjalanan = function (f) {

  };
  /* ---------- realisasi: terminal per siklus (BAM/BAB + Rolink; Tarahan dari rekon) ---------- */
  K.terminal = function (f) {

      if (k) return K.kaOk(k, f, { anyMut: true });
      if (f.pem !== 'Semua' && K.pemOfRel(rel) !== f.pem) return false;

  };
  K.thn = function (f) {

      return k ? K.kaOk(k, f, { anyMut: true }) : !(f.mitra && f.mitra !== 'PT Bukit Asam Tbk') && !f.ka && !f.nama;
    });
  };
  K.hambatan = function (f) {
    if (!K.has('REAL_HAMBATAN')) return null;

      else if (f.sm) { if (loc !== f.sm) return false; } else if (f.sb) { if (loc !== f.sb) return false; }

    }
    (K.rekomendasiGangguan ? K.rekomendasiGangguan(K.gangguan(f, { thn: '2026', coal: true }) || [], null).slice(0, 2) : []).forEach(function (r) {
