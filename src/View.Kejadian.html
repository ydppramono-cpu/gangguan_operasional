<!-- View.Kejadian — detail satu gangguan: uraian lengkap, tautan ke profil lokasi/KA/sarana/JPL, kejadian terkait, rekomendasi. -->
<template x-if="$store.app.route === 'kejadian'">
  <section class="view" x-data="vKejadian">
    <template x-if="!ev"><div class="card"><div class="card-b"><h2 style="margin-top:0">Kejadian tidak ditemukan</h2><p>Kunci asal tidak ada di snapshot saat ini.</p></div></div></template>
    <template x-if="ev">
      <div>
        <div class="phead">
          <div class="phead-ic" :style="'background:' + KAI.classColor(ev.kelas)"><svg class="i"><use href="#i-alert"/></svg></div>
          <div style="flex:1;min-width:0">
            <div class="eyebrow" x-text="'Kejadian · ' + KAI.fmt.dateTime(ev) + (ev.dow >= 0 ? ' · ' + KAIA.DOW[ev.dow] : '')"></div>
            <h2 x-text="ev.judul || ev.sub || 'Kejadian'"></h2>
            <p x-text="ev.sub"></p>
            <div class="tags">
              <span class="tag k" :style="'background:' + KAI.classColor(ev.kelas)" x-text="$store.app.classLabel(ev.kelas)"></span>
              <span class="tag" :class="ev.menit >= $store.app.config.heavy ? 'bad' : ''" x-text="KAI.fmt.n(ev.menit) + ' menit'"></span>
              <span class="tag warn" x-show="ev.cross" x-text="'Perlintasan · ' + crossLabel"></span>
              <span class="tag" x-text="ev.sumber"></span>
            </div>
          </div>
          <dl class="facts">
            <div><dt>Wilayah</dt><dd><button class="link-btn plain" @click="$store.app.open('wilayah', ev.wilayah)" x-text="ev.wilayah || KAI.NIL" :class="ev.drvSet.wilayah && 'drv'" :title="ev.drvSet.wilayah ? KAI.DRV_TIP : null"></button></dd></div>
            <div><dt>Lokasi</dt><dd><button class="link-btn plain" @click="$store.app.openLoc(ev)" x-text="ev.lokasi || KAI.NIL" :class="ev.drvSet.lokasi && 'drv'" :title="ev.drvSet.lokasi ? KAI.DRV_TIP : null"></button></dd></div>
            <div><dt>KM</dt><dd :class="ev.drvSet.km && 'drv'" :title="ev.drvSet.km ? KAI.DRV_TIP : null" x-text="ev.km || KAI.NIL"></dd></div>
            <div x-show="jpl"><dt>JPL</dt><dd><button class="link-btn plain" @click="$store.app.open('jpl', jpl.id)" x-text="jpl ? 'JPL ' + jpl.no + ' · ' + jpl.kab : ''"></button></dd></div>
            <div><dt>Kereta api</dt><dd><button class="link-btn plain" :disabled="!ev.ka" @click="ev.ka && $store.app.open('ka', ev.ka)" :class="ev.drvSet.ka && 'drv'" :title="ev.drvSet.ka ? KAI.DRV_TIP : null" x-text="ev.ka ? 'KA ' + ev.ka + (ev.kaNama ? ' ' + ev.kaNama : ' (tidak ada di LIST KA)') : KAI.NIL"></button></dd></div>
          </dl>
        </div>

        <div class="grid g-2-1 mt">
          <div class="card">
            <div class="card-h"><div><h3>Uraian kejadian</h3><p>Dari kolom "Keterangan kejadian" dan "Tindak lanjut terlapor"</p></div></div>
            <div class="card-b">
              <template x-if="$store.app.narrReady"><div class="narr" x-text="narr[0] || 'Tidak ada uraian.'"></div></template>
              <template x-if="!$store.app.narrReady"><div class="skel" style="height:160px"></div></template>
              <template x-if="$store.app.narrReady && narr[1]"><div><h3 class="h-s">Tindak lanjut terlapor</h3><div class="narr" x-text="narr[1]"></div></div></template>
            </div>
          </div>
          <div class="card">
            <div class="card-h"><div><h3>Data kejadian</h3></div></div>
            <div class="card-b">
              <dl class="kv">
                <dt>Tanggal · jam</dt><dd :class="ev.drvSet.jam && 'drv'" :title="ev.drvSet.jam ? KAI.DRV_TIP : null" x-text="(ev.date ? KAI.fmt.date(ev) : 'Tanggal ' + KAI.NIL.toLowerCase()) + (ev.hm >= 0 ? ' · ' + KAI.fmt.hm(ev.hm) : ' · jam ' + KAI.NIL.toLowerCase() + (ev.jam ? ' (isian sumber: ' + ev.jam + ')' : ''))"></dd>
                <dt>Lintas</dt><dd x-text="ev.lintas || KAI.NIL"></dd>
                <dt>Sarana</dt><dd>
                  <template x-for="u in ev.sarana" :key="u"><button class="link-btn" style="margin-right:8px" @click="$store.app.openUnit(u)" x-text="KAI.fmt.unit(u) + (age(u) ? ' (' + age(u) + ')' : '')"></button></template>
                  <span x-show="!ev.sarana.length" x-text="ev.saranaRaw || KAI.NIL"></span><span class="note" x-show="ev.drvSet.sarana"> · diturunkan dari uraian</span></dd>
                <dt>Jenis KA</dt><dd x-text="ev.kaJenis ? ev.kaJenis.toLowerCase() : KAI.NIL"></dd>
                <dt>Kategori sumber</dt><dd x-text="ev.kategori || KAI.NIL"></dd>
                <dt>Subgangguan</dt><dd x-text="ev.sub || KAI.NIL"></dd>
                <dt>Komponen</dt><dd x-text="komp || KAI.NIL"></dd>
                <dt>Penyebab terlapor</dt><dd :class="ev.drvSet.penyebab && 'drv'" :title="ev.drvSet.penyebab ? KAI.DRV_TIP : null" x-text="ev.penyebab || KAI.NIL"></dd>
                <dt>Depo induk</dt><dd :class="ev.drvSet.depo && 'drv'" :title="ev.drvSet.depo ? KAI.DRV_TIP : null" x-text="ev.depo ? KAI.tc(ev.depo) : KAI.NIL"></dd>
                <dt>Kode laporan</dt><dd x-text="ev.kode || KAI.NIL"></dd>
                <dt>Kunci asal</dt><dd><code x-text="ev.id"></code></dd>
                <dt>Isian turunan</dt><dd x-text="Object.keys(ev.drvSet).length ? Object.keys(ev.drvSet).map(function (k) { return KAI.DRV_LABEL[k] || k; }).join(', ') + ' — diturunkan dari judul/uraian' : 'Tidak ada (semua dari kolom sumber)'"></dd>
              </dl>
            </div>
          </div>
        </div>

        <div class="grid g-3 mt">
          <template x-for="g in related" :key="g.title">
            <div class="card">
              <div class="card-h"><div><h3 x-text="g.title"></h3><p x-text="g.sub"></p></div><div class="spacer"></div>
                <button class="btn sm ghost" x-show="!!g.more" @click="g.more()">Profil<svg class="i"><use href="#i-arrow"/></svg></button></div>
              <div class="card-b tbl-x">
                <table class="tbl"><thead><tr><th>Tanggal</th><th>Kejadian</th><th class="num">Menit</th></tr></thead><tbody>
                  <template x-for="r in g.items" :key="r.id"><tr class="click" @click="$store.app.openEvent(r.id)"><td class="num" style="white-space:nowrap" x-text="KAI.fmt.date(r)"></td><td class="wrap" :title="r.judul || r.sub" x-text="r.sub || r.judul"></td><td class="num" x-text="KAI.fmt.n(r.menit)"></td></tr></template>
                </tbody></table>
                <div class="empty" x-show="!g.items.length">Tidak ada kejadian lain.</div>
              </div>
            </div>
          </template>
        </div>

        <div class="card mt" x-show="IB && IB.findings.length">
          <div class="card-h"><div><h3>Temuan &amp; tindakan terkait kejadian ini</h3><p>Dipicu oleh kejadian ini dan riwayat 12 bulan di lokasi yang sama</p></div></div>
          <div class="card-b"><?!= include('Part.Insight'); ?>
</div>
        </div>
      </div>
    </template>
  </section>
</template>
<script>
document.addEventListener('alpine:init', function () {
  Alpine.data('vKejadian', function () {
    return {
      get ev() { var p = this.$store.app.params; void this.$store.app.ver; return p && p.id ? KAI.data.byId[p.id] || null : null; },
      get narr() { void this.$store.app.narrReady; var e = this.ev; return (e && KAI.data.narr[e.id]) || []; },
      get crossLabel() { var e = this.ev, c = e && this.$store.app.config.crossing.filter(function (x) { return x.id === e.cross; })[0]; return c ? c.label : ''; },
      get komp() { var e = this.ev, c = e && this.$store.app.config.components.filter(function (x) { return x.id === e.komp; })[0]; return c ? c.label : ''; },
      age: function (u) { var R = KAI.data.ref, f = R && R.fleet[u]; return f && f.age != null ? KAI.fmt.age(f.age) : ''; },
      get jpl() {
        var e = this.ev, R = KAI.data.ref; void this.$store.app.refReady;
        if (!e || !e.cross || !R) return null;
        var inv = KAIRef.crossingInventory(R, [e], this.$store.app.config), p = inv.points[0];
        return p && p.jpl ? p.jpl : null;
      },
      get related() {
        var e = this.ev, app = this.$store.app; if (!e) return [];
        var all = KAI.data.all, out = [];
        function near(list) { return list.filter(function (r) { return r.id !== e.id; }).sort(function (a, b) { return KAIA.sortKey(b).localeCompare(KAIA.sortKey(a)); }).slice(0, 6); }
        if (e.segKey || e.stCode) {
          var L = all.filter(function (r) { return e.segKey ? r.segKey === e.segKey : r.stCode === e.stCode; });
          out.push({ title: 'Di lokasi yang sama', sub: (L.length - 1) + ' kejadian lain · ' + e.lokasi, items: near(L), more: function () { app.openLoc(e); } });
        }
        if (e.ka) { var K = all.filter(function (r) { return r.ka === e.ka; }); out.push({ title: 'KA ' + e.ka + ' yang sama', sub: (K.length - 1) + ' kejadian lain', items: near(K), more: function () { app.open('ka', e.ka); } }); }
        if (e.sarana[0]) { var U = all.filter(function (r) { return r.sarana.indexOf(e.sarana[0]) >= 0; }); out.push({ title: 'Unit ' + KAI.fmt.unit(e.sarana[0]), sub: (U.length - 1) + ' kejadian lain', items: near(U), more: function () { app.openUnit(e.sarana[0]); } }); }
        if (!out.length) { var S = all.filter(function (r) { return r.sub === e.sub && r.wilayah === e.wilayah; }); out.push({ title: 'Jenis sama di ' + e.wilayah, sub: (S.length - 1) + ' kejadian lain', items: near(S) }); }
        return out;
      },
      get IB() {
        var e = this.ev, app = this.$store.app; if (!e || !app.config) return null;
        var L = [e];
        if (e.segKey || e.stCode) {
          var end = e.date || (e.ym + '-28'), from = KAIA.addDays(end, -364);
          L = KAI.data.all.filter(function (r) { return (e.segKey ? r.segKey === e.segKey : r.stCode === e.stCode) && r.date && r.date >= from && r.date <= end; });
          if (L.indexOf(e) < 0) L.push(e);
        }
        var R = KAI.data.ref;
        return KAIInsight.analyze({ L: L, cfg: app.config, R: app.refReady ? R : null, inv: app.refReady ? KAIRef.crossingInventory(R, L, app.config) : null, kind: 'kejadian' });
      }
    };
  });
});
</script>
