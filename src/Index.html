  <!-- Pustaka inti (versi dikunci) dimuat berurutan setelah halaman siap, Alpine terakhir.
       Tiap pustaka punya CDN cadangan: bila jaringan kantor memblokir satu CDN, CDN berikutnya dicoba. -->
  <script>
  (function () {
    var LIBS = [
      ['https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js', 'https://unpkg.com/echarts@5.6.0/dist/echarts.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js'],
      ['https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js', 'https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.1/js/tabulator.min.js'],
      ['https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js', 'https://unpkg.com/alpinejs@3.17.4/dist/cdn.min.js']
    ];
    function one(urls, i, done, fail) {
      if (i >= urls.length) return fail(urls[0]);
      var s = document.createElement('script'); s.src = urls[i];
      s.onload = done; s.onerror = function () { s.remove(); one(urls, i + 1, done, fail); };
      document.head.appendChild(s);
    }
    function next(k) {
      if (k >= LIBS.length) return;
      one(LIBS[k], 0, function () { next(k + 1); }, function (u) {
        var b = document.getElementById('lib-fail'); if (b) { b.style.display = 'block'; b.querySelector('code').textContent = u.split('/')[4] || u; }
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { next(0); }); else next(0);
  })();
  </script>
</head>
<body>
  <div id="lib-fail" style="display:none;margin:40px auto;max-width:640px;padding:20px 24px;border:1px solid #F6C9C4;background:#FDECEA;color:#B42318;border-radius:12px;font:15px/1.5 Arial,sans-serif">

    Kemungkinan jaringan/proxy kantor memblokir situs tersebut. Coba jaringan lain (mis. data seluler) atau minta tim TI membuka akses ke ketiga alamat itu.
  </div>
