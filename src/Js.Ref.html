<script>
/**
 * Js.Ref — data referensi (GAPEKA 2025, M_JPL, M_JADWAL, Referensi Sarana) dan turunannya:
 *  - jaringan stasiun–petak (graf) dan inferensi rute tiap KA dari "Lintas" + "Jarak" GAPEKA;
 *  - jam KA di tiap stasiun/petak: PASTI bila ada di M_JADWAL atau stasiun asal/tujuan, selain itu PERKIRAAN
 *    (interpolasi linier menurut km antara jam berangkat dan jam datang; tidak memuat waktu berhenti);
 *  - JPL → petak, kaitan kejadian perlintasan → JPL, inventaris titik perlintasan;
 *  - armada: jenis, depo, usia;
 *  - indeks pencarian.
 * Fungsi murni (tanpa DOM) agar bisa diuji di Node.
 */
(function (root) {
  var GLBL = 'GAPEKA 2025';   // label sumber jadwal aktif (switch global); diisi build()
  var tc = function (x) { return root.KAI && root.KAI.tc ? root.KAI.tc(x) : x; };
  function norm(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toMin(hhmm) { var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || ''); return m ? +m[1] * 60 + +m[2] : null; }
  function fmtMin(v) { if (v == null) return ''; v = ((Math.round(v) % 1440) + 1440) % 1440; return pad(Math.floor(v / 60)) + ':' + pad(v % 60); }
  function round5(v) { return v == null ? null : Math.round(v / 5) * 5; }
  function regionOrder(w) { var m = /^(Daop|Divre) (\d+)/.exec(w || ''); return m ? (m[1] === 'Daop' ? 0 : 100) + Number(m[2]) : 999; }

  /* ---------- Graf & jalur terpendek ---------- */
  function Heap() { this.a = []; }
  Heap.prototype.push = function (d, v) { var a = this.a; a.push([d, v]); var i = a.length - 1; while (i > 0) { var p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; var t = a[p]; a[p] = a[i]; a[i] = t; i = p; } };
  Heap.prototype.pop = function () { var a = this.a, top = a[0], last = a.pop(); if (a.length) { a[0] = last; var i = 0; for (;;) { var l = 2 * i + 1, r = l + 1, m = i; if (l < a.length && a[l][0] < a[m][0]) m = l; if (r < a.length && a[r][0] < a[m][0]) m = r; if (m === i) break; var t = a[m]; a[m] = a[i]; a[i] = t; i = m; } } return top; };
  function dijkstra(adj, src) {
    var dist = {}, prev = {}, h = new Heap(); dist[src] = 0; h.push(0, src);
    while (h.a.length) {
      var x = h.pop(), d = x[0], u = x[1]; if (d > dist[u]) continue;
      var e = adj[u] || [];
      for (var i = 0; i < e.length; i++) { var v = e[i].to, nd = d + e[i].km; if (dist[v] == null || nd < dist[v]) { dist[v] = nd; prev[v] = u; h.push(nd, v); } }
    }
    return { dist: dist, prev: prev };
  }
  function pathTo(sp, src, dst) { if (sp.dist[dst] == null) return null; var p = [dst]; while (p[p.length - 1] !== src) { p.push(sp.prev[p[p.length - 1]]); if (p.length > 5000) return null; } return p.reverse(); }

  function build(raw, opts) {
    opts = opts || {}; GLBL = raw.gapekaLabel || 'GAPEKA 2025';
    var R = { depot: {}, st: {}, stList: [], seg: {}, segList: [], adj: {}, nameIdx: {}, ka: {}, kaList: [], jpl: [], fleet: {}, fleetList: [],
      regions: {}, lintas: {}, gapekaLabel: GLBL, today: opts.today || new Date().toISOString().slice(0, 10), counts: raw.counts || {} };

    (raw.st || []).forEach(function (r) {
      var s = { code: r[0], name: tc(r[1]), region: r[2], status: r[3] ? r[3].charAt(0).toUpperCase() + r[3].slice(1) : '', deg: 0 };
      R.st[s.code] = s; R.stList.push(s);
      R.nameIdx[norm(s.name)] = s.code; if (!R.nameIdx[norm(s.code)]) R.nameIdx[norm(s.code)] = s.code;
    });
    (raw.pj || []).forEach(function (r) {
      var a = r[0], b = r[1], key = [a, b].sort().join('-');
      if (R.seg[key]) return;
      var g = { key: key, a: a, b: b, km: r[2], lintas: r[3], region: r[4], track: r[5] };
      R.seg[key] = g; R.segList.push(g);
      if (g.km != null) {
        (R.adj[a] = R.adj[a] || []).push({ to: b, km: g.km, key: key });
        (R.adj[b] = R.adj[b] || []).push({ to: a, km: g.km, key: key });
      }
      [a, b].forEach(function (c) { if (!R.st[c]) { R.st[c] = { code: c, name: c, region: g.region, status: '', deg: 0 }; R.stList.push(R.st[c]); } R.st[c].deg++; });
      if (g.lintas) { var L = R.lintas[g.lintas] = R.lintas[g.lintas] || { name: g.lintas, region: g.region, segs: [], km: 0 }; L.segs.push(key); L.km += g.km || 0; }
    });
    R.stList.forEach(function (s) { if (s.region) (R.regions[s.region] = R.regions[s.region] || { name: s.region, st: [], segs: [] }).st.push(s.code); });
    R.segList.forEach(function (g) { if (g.region) (R.regions[g.region] = R.regions[g.region] || { name: g.region, st: [], segs: [] }).segs.push(g.key); });

    (raw.ka || []).forEach(function (r) {
      var codes = String(r[4] || '').split('-').filter(Boolean);
      var k = { no: r[0], nama: tc(r[1]), kelas: tc(r[2]), jenis: r[3], lintas: r[4], codes: codes, o: codes[0] || '', d: codes[codes.length - 1] || '',
        jarak: r[5], ber: r[6], dat: r[7], layanan: tc(r[8]), regtamb: r[9], sf: r[10], kap: r[11], klas: tc(r[12]), jenisKa: r[13] || '' };
      k.reg = !k.jenisKa || k.jenisKa === 'REG';
      R.ka[norm(k.no)] = k; R.kaList.push(k);
    });
    // Nomor gabungan LIST KA ("92-93") → tiap nomor perjalanan menunjuk induknya.
    R.kaLeg = {};
    R.kaList.forEach(function (k) { var parts = String(k.no).split('-'); if (parts.length > 1) parts.forEach(function (x) { if (!R.kaLeg[norm(x)]) R.kaLeg[norm(x)] = k; }); });
    // Buku Daftar Waktu GAPEKA 2025 (tab M_JADWAL): jam PASTI per stasiun, status berhenti/langsung.
    R.tt = {}; R.ttList = [];
    (raw.jadwal || []).forEach(function (r) {
      var stops = String(r[4] || '').split('\n').filter(Boolean).map(function (l) {
        var a = l.split('|'); return { code: a[0], dat: toMin(a[1]), ber: toMin(a[2]), ket: a[3] || 'H', cat: a[4] || '' };
      });
      if (stops.length < 2) return;
      var T = { no: r[0], nama: tc(r[1]), rel: r[2], src: r[3], stops: stops };
      R.tt[norm(T.no)] = T; R.ttList.push(T);
    });
    R.ops = {};
    (raw.ops || []).forEach(function (r) { (R.ops[r[0]] = R.ops[r[0]] || []).push({ jenis: r[1], buka: r[2], tutup: r[3], src: r[4] }); });
    // Pustaka rujukan eksternal (tab M_RUJUKAN) — dipakai laporan PPT/PDF untuk konteks media & kajian ilmiah.
    R.ruj = (raw.ruj || []).map(function (r) {
      return { id: r[0], jenis: r[1] || 'Media', apa: r[2], url: r[3], tanggal: r[4], wilayah: String(r[5] || '').split(/\s*[,;]\s*/).filter(Boolean),
        topik: String(r[6] || '').split(/\s*[,;]\s*/).filter(Boolean), fakta: r[7], implikasi: r[8], verif: r[9] };
    });

    (raw.jpl || []).forEach(function (r) {
      var j = { id: 'J' + r[0], noUrut: r[0], antara: tc(r[1]), antaraRaw: r[1], no: r[2], kmText: r[3], km: r[4], prov: tc(r[5]), kab: tc(r[6]), kat: tc(r[7]), lebar: r[8],
        status: r[9], penjaga: r[10], region: r[11], p190: !!r[12], segKey: '', a: '', b: '' };
      var parts = j.antaraRaw.split(/\s*-\s*/);
      if (parts.length === 2) {
        var a = stationOf(R, parts[0]), b = stationOf(R, parts[1]);
        if (a && b) { j.a = a; j.b = b; var key = [a, b].sort().join('-'); j.segKey = R.seg[key] ? key : ''; j.pairKey = key; }
      }
      j.jaga = /TIDAK DIJAGA/.test(j.status) ? 'tidak dijaga' : /DIJAGA/.test(j.status) ? 'dijaga'
        : /^(TAK TERJAGA|TIDAK TERJAGA|TIDAK DIJAGA|TIADA|RESMI TAK TERJAGA|RESMI TIDAK TERJAGA)/.test(j.penjaga) ? 'tidak dijaga'
        : /SWADAYA|DISHUB|PEMDA|RELAWAN|DIJAGA|SWASTA|TERJAGA|^ADA$/.test(j.penjaga) ? 'dijaga' : 'tidak tercatat';
      j.registered = /^REGISTER/.test(j.status);
      j.statusTxt = tc(j.status); j.penjagaTxt = tc(j.penjaga);
      R.jpl.push(j);
    });
    jplJalan(R, raw);

    var ref = new Date(R.today + 'T00:00:00Z').getTime();
    (raw.fleet || []).forEach(function (r) {
      var f = { no: r[0], kind: r[1], cls: r[2], depo: r[3], since: r[4], manuf: r[5], kap: r[6] || '', spd: r[7] || null, bk: r[8] || null, model: r[9] || '', age: null };
      if (f.since) f.age = Math.floor((ref - Date.UTC(+f.since.slice(0, 4), +f.since.slice(5, 7) - 1, 15)) / (365.25 * 864e5) * 10) / 10;
      f.depoId = depotOf(R, f.depo).id; R.depot[f.depoId].units.push(f);
      R.fleet[f.no] = f; R.fleetList.push(f);
    });
    // Depo induk rangkaian (Buku Dukungan Sarana) → nomor KA yang dilayani.
    (raw.depo || []).forEach(function (r) {
      var code = r[1], d = null;
      Object.keys(R.depot).forEach(function (id) { var x = R.depot[id]; if (!d && x.code === code && x.type === 'Kereta') d = x; });
      if (!d) { d = R.depot['DUK:' + code] = { id: 'DUK:' + code, raw: r[0], type: 'Depo induk rangkaian', code: code, units: [], ka: [] }; finishDepot(R, d, tc(r[0])); }
      d.ka = d.ka.concat(String(r[3] || '').split(/\s*,\s*/).filter(Boolean)); d.duksar = r[0]; d.src = r[4];
    });
    R.depotList = Object.keys(R.depot).map(function (k) { return R.depot[k]; }).sort(function (a, b) { return regionOrder(a.region) - regionOrder(b.region) || b.units.length - a.units.length; });
    R.depotList.forEach(function (d) { if (d.region) { var W = R.regions[d.region] = R.regions[d.region] || { name: d.region, st: [], segs: [] }; (W.depots = W.depots || []).push(d.id); } });
    R.kaDepot = {}; R.depotList.forEach(function (d) { d.ka.forEach(function (n) { R.kaDepot[norm(n)] = d; }); });
    R.kondisi = raw.kondisi || null;
    R.prog = raw.prog || null;   // program operasi KA (25_Operasi.gs): km, status Jalan/Batal pada tanggal kejadian, pola operasi
    // Buku Dukungan Sarana GAPEKA: status SIAP GUNA per unit + depo induk GAPEKA, dinasan lok per depo.
    R.duksar = raw.duksar || null; R.dukUnit = {};
    if (R.duksar && R.duksar.units) Object.keys(R.duksar.units).forEach(function (k) { var o = R.duksar.units[k]; Object.keys(o).forEach(function (c) { String(o[c]).split(' ').forEach(function (no) { if (no) R.dukUnit[no] = { kind: k, depo: c }; }); }); });
    R.pend = raw.pend || null;
    R.peta = raw.peta || null;
    R._routes = null;
    return R;
  }

  var DEPO_TYPE = { LOK: 'Lokomotif', KRT: 'Kereta', GRB: 'Gerbong', KRL: 'KRL', LRT: 'LRT' };
  /** Depo dari dipo_name SAP ("DEPO GRB SIG", "DP LOK CPN") → { id, type, code, region }. Kode = token terakhir = kode stasiun lokasi depo. */
  function depotOf(R, name) {
    var raw = String(name || '').trim() || 'Tidak tercatat', id = norm(raw) || 'NA';
    if (R.depot[id]) return R.depot[id];
    var m = /^(?:DEPO|DP|DIPO)\s+(LOK|KRT|GRB|KRL|LRT)\s+(.+)$/i.exec(raw), d = { id: id, raw: raw, type: m ? DEPO_TYPE[m[1].toUpperCase()] : 'Lainnya', code: m ? m[2].trim().toUpperCase() : '', units: [], ka: [] };
    R.depot[id] = d; finishDepot(R, d, null);
    return d;
  }
  function finishDepot(R, d, label) {
    var st = R.st[d.code];
    d.region = st ? st.region : '';
    d.stName = st ? st.name : '';
    d.label = label ? 'Depo ' + label + (d.code ? ' (' + d.code + ')' : '') : d.type !== 'Lainnya' ? 'Depo ' + d.type + ' ' + (st ? st.name + ' (' + d.code + ')' : tc(d.code)) : tc(d.raw);
  }

  /** Nama/kode stasiun di teks bebas (mis. "LEMAHABANG", "KDG", "TANAH ABANG") → kode. */
  var ROAD = { motorway: 'jalan tol', trunk: 'jalan arteri utama', primary: 'jalan primer', secondary: 'jalan sekunder', tertiary: 'jalan tersier', unclassified: 'jalan lokal', residential: 'jalan permukiman',
    service: 'jalan akses', track: 'jalan setapak/kebun', living_street: 'jalan lingkungan', footway: 'jalan kaki', path: 'jalan setapak', cycleway: 'jalur sepeda' };
  function roadClass(h) { h = String(h || '').replace(/_link$/, ''); return ROAD[h] || (h ? 'jalan ' + h : ''); }
  /** Pengelola perlintasan sebidang menurut PM 94/2018 Pasal 2 (berdasarkan status jalan di M_JPL "Kategori jalan"). */
  function pengelola(j) {
    var k = String(j.kat || '').toUpperCase(), kab = String(j.kab || '').replace(/^(Kab\.?|Kabupaten)\s+/i, '');
    if (/NASIONAL/.test(k)) return 'Menteri Perhubungan (jalan nasional)';
    if (/PROVINSI/.test(k)) return 'Gubernur ' + (j.prov || '') + ' (jalan provinsi)';
    if (/KABUPATEN|KOTA|KECAMATAN|DESA/.test(k)) return (/^Kota\b/i.test(j.kab) ? 'Wali Kota ' + j.kab.replace(/^Kota\s+/i, '') : 'Bupati ' + kab) + ' (jalan ' + (/DESA/.test(k) ? 'desa' : /KECAMATAN/.test(k) ? 'kecamatan' : 'kabupaten/kota') + ')';
    if (/PERKEBUNAN|INDUSTRI|PRIBADI|KHUSUS/.test(k)) return 'Badan hukum/lembaga pemilik jalan khusus (' + KAI.cap(k.toLowerCase()) + ')';
    return '';
  }
  function njpl(s) { return String(s || '').toUpperCase().replace(/^JPL\s*/, '').replace(/[^0-9A-Z]/g, ''); }
  /** Indeks riset web (per petak#nomor) & perlintasan OSM (per petak), lalu isi nama jalan/pengelola tiap JPL program. */
  function jplJalan(R, raw) {
    R.jplRiset = {}; R.jplOsmSeg = {};
    (raw.jplRiset || []).forEach(function (r) {
      var pr = String(r[2] || '').split(/\s*[–-]\s*/), a = stationOf(R, pr[0]), b = stationOf(R, pr[1] || ''); if (!a || !b) return;
      R.jplRiset[[a, b].sort().join('-') + '#' + njpl(r[1])] = { region: r[0], jalan: r[4], penjaga: r[5], status: r[6], catatan: r[7], judul: r[8], url: r[9], terbit: r[10] };
    });
    (raw.jplOsm || []).forEach(function (o) { (R.jplOsmSeg[o[0]] = R.jplOsmSeg[o[0]] || []).push({ urut: o[1], t: o[2], lat: o[3], lon: o[4], jalan: o[5], ref: o[6], kelas: o[7], lain: o[8], refOsm: o[9], palang: o[10], dijaga: o[11] }); });
    var known = {}; R.jpl.forEach(function (j) { if (j.pairKey) (known[j.pairKey] = known[j.pairKey] || {})[njpl(j.no)] = 1; });
    R.jplKnown = known;
    R.jpl.forEach(function (j) {
      j.pengelola = pengelola(j);
      var L = jplLookup(R, j.pairKey, j.no);
      j.riset = L.riset; j.osm = L.osm; j.osmKandidat = L.kandidat; j.jalan = L.jalan; j.jalanSrc = L.src;
      if (j.riset && j.riset.penjaga && j.jaga === 'tidak tercatat') j.jaga = L.jaga || j.jaga;
    });
  }
  /** Nama jalan satu JPL: riset web bersumber → OSM ref sama (pasti) → satu-satunya perlintasan & satu-satunya nomor JPL di petak (perkiraan) → kandidat OSM. */
  function jplLookup(R, seg, no) {
    var out = { riset: null, osm: null, kandidat: [], jalan: '', src: '', jaga: '' }; if (!seg) return out;
    var k = njpl(no), rs = k && R.jplRiset ? R.jplRiset[seg + '#' + k] : null, C = (R.jplOsmSeg && R.jplOsmSeg[seg]) || [], kn = (R.jplKnown && R.jplKnown[seg]) || {};
    var nm = function (c) { return c.jalan || (c.ref ? 'jalan ' + c.ref : ''); };
    var byRef = k ? C.filter(function (c) { return c.refOsm && njpl(c.refOsm) === k; }) : [], o = null, how = '';
    if (byRef.length === 1) { o = byRef[0]; how = 'OSM (nomor JPL sama)'; }
    else if (C.length === 1 && Object.keys(kn).length <= 1 && (!Object.keys(kn).length || kn[k])) { o = C[0]; how = 'perkiraan (satu-satunya perlintasan di petak)'; }
    out.riset = rs; out.osm = o ? { jalan: nm(o), kelas: o.kelas, lain: o.lain, lat: o.lat, lon: o.lon, how: how } : null;
    out.kandidat = o ? [] : C.map(nm).filter(function (x, i, A) { return x && A.indexOf(x) === i; });
    if (rs && rs.jalan) { out.jalan = rs.jalan; out.src = 'riset web'; } else if (out.osm && out.osm.jalan) { out.jalan = out.osm.jalan; out.src = how; }
    if (rs && rs.penjaga) out.jaga = /tidak dijaga|tak dijaga|swadaya/i.test(rs.penjaga + ' ' + rs.status) ? 'tidak dijaga' : /dijaga/i.test(rs.penjaga) ? 'dijaga' : '';
    return out;
  }
  function stationOf(R, txt) {
    var k = norm(txt); if (!k) return '';
    if (R.st[k]) return k;
    if (R.nameIdx[k]) return R.nameIdx[k];
    return fuzzyStation(R, k);
  }
  /** Ejaan berbeda ("KEDUNGGEDE" vs "Kedunggedeh", "BASOETTA" vs "Bandara Soekarno Hatta"): awalan unik atau beda ≤ 2 huruf. */
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    var d = []; for (var i = 0; i <= a.length; i++) { d[i] = [i]; } for (var j = 1; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function fuzzyStation(R, k) {
    if (k.length < 5) return '';
    var memo = R._fz = R._fz || {}; if (memo[k] != null) return memo[k];
    var names = Object.keys(R.nameIdx), pre = names.filter(function (n) { return n.length >= 5 && (n.indexOf(k) === 0 || k.indexOf(n) === 0); });
    var hit = '';
    if (pre.length === 1) hit = R.nameIdx[pre[0]];
    else {
      var best = null, tie = false;
      names.forEach(function (n) { if (n.length < 5) return; var d = lev(k, n); if (d <= 2 && (!best || d < best.d)) { best = { n: n, d: d }; tie = false; } else if (best && d === best.d) tie = true; });
      if (best && !tie) hit = R.nameIdx[best.n];
    }
    return (memo[k] = hit);
  }

  /* ---------- Rute KA ---------- */
  function routeFor(R, k) {
    if (!k.codes.length || k.codes.some(function (c) { return !R.adj[c]; })) return { ok: false, reason: 'Kode stasiun di "Lintas" tidak ada di jaringan petak GAPEKA' };
    var cache = R._spCache = R._spCache || {};
    function sp(src) { return cache[src] || (cache[src] = dijkstra(R.adj, src)); }
    var path = [k.codes[0]];
    for (var i = 1; i < k.codes.length; i++) {
      var p = pathTo(sp(k.codes[i - 1]), k.codes[i - 1], k.codes[i]);
      if (!p) return { ok: false, reason: 'Tidak ada jalur di graf antara ' + k.codes[i - 1] + ' dan ' + k.codes[i] };
      path = path.concat(p.slice(1));
    }
    var len = plen(R, path), method = 'terpendek';
    var err = k.jarak ? Math.abs(len - k.jarak) / k.jarak : null;
    // Jalur terpendek tidak cocok dengan jarak GAPEKA (mis. KA lintas selatan): cari satu titik antara yang cocok.
    if (err != null && err > 0.015 && k.codes.length === 2) {
      var o = k.codes[0], d = k.codes[1], A = sp(o), B = sp(d), best = null;
      Object.keys(A.dist).forEach(function (w) {
        if (w === o || w === d || B.dist[w] == null) return;
        var L = A.dist[w] + B.dist[w], e = Math.abs(L - k.jarak) / k.jarak;
        if (!best || e < best.e) best = { w: w, e: e, L: L };
      });
      if (best && best.e < err) {
        var p1 = pathTo(A, o, best.w), p2 = pathTo(B, d, best.w);
        var cand = p1.concat(p2.reverse().slice(1)), seen = {}, simple = true;
        cand.forEach(function (c) { if (seen[c]) simple = false; seen[c] = 1; });
        if (simple) { path = cand; len = plen(R, path); err = Math.abs(len - k.jarak) / k.jarak; method = 'melalui ' + (R.st[best.w] ? R.st[best.w].name : best.w); }
      }
    }
    var cum = [0]; for (var j = 1; j < path.length; j++) cum.push(cum[j - 1] + segKm(R, path[j - 1], path[j]));

  }
