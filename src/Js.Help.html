  function cardInfo(root) {

    });

  /* ---- Mesin tur ---- */
  var ov = null;
  function visible(el) { if (!el) return false; var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }
  function pick(sel) { var L = document.querySelectorAll(sel); for (var i = 0; i < L.length; i++) if (visible(L[i])) return L[i]; return null; }
  function steps(route) {
    var S = (TOUR[route] || []).concat(route === 'ringkasan' ? TOUR._umum : []);
    return S.filter(function (s) { return pick(s.sel); });
  }
  function end() { if (ov) { ov.remove(); ov = null; } document.removeEventListener('keydown', key, true); }
  function key(e) { if (!ov) return; if (e.key === 'Escape') { e.preventDefault(); end(); } else if (e.key === 'ArrowRight') ov._go(1); else if (e.key === 'ArrowLeft') ov._go(-1); }
  function tour(route) {
    end();
    var S = steps(route || Alpine.store('app').route); if (!S.length) { Alpine.store('app').say('Belum ada tur untuk halaman ini.'); return; }
    try { localStorage.setItem('kai.tour.' + (route || Alpine.store('app').route), '1'); } catch (e) { /* abaikan */ }
    ov = document.createElement('div'); ov.className = 'tour'; ov.innerHTML = '<div class="tour-spot"></div><div class="tour-card" role="dialog" aria-live="polite"></div>';
    document.body.appendChild(ov);
    var i = 0, spot = ov.querySelector('.tour-spot'), card = ov.querySelector('.tour-card');
    function show() {
      var s = S[i], el = pick(s.sel); if (!el) { return go(1); }
      el.scrollIntoView({ block: 'center', behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
      setTimeout(function () {
        var r = el.getBoundingClientRect(), pad = 6;
        spot.style.cssText = 'left:' + (r.left - pad) + 'px;top:' + (r.top - pad) + 'px;width:' + (r.width + pad * 2) + 'px;height:' + Math.min(r.height + pad * 2, innerHeight - 20) + 'px';
        card.innerHTML = '<div class="tour-n">' + (i + 1) + ' / ' + S.length + '</div><h4>' + s.t + '</h4><p>' + s.d + '</p><div class="tour-a">' +
          '<button type="button" class="link-btn sm" data-x="end">Lewati</button><span class="spacer"></span>' +
          (i ? '<button type="button" class="btn sm" data-x="-1">Sebelumnya</button>' : '') +
          '<button type="button" class="btn sm primary" data-x="1">' + (i === S.length - 1 ? 'Selesai' : 'Berikutnya') + '</button></div>';
        var cw = Math.min(340, innerWidth - 24), below = r.bottom + 14 + 180 < innerHeight;
        var left = Math.max(12, Math.min(innerWidth - cw - 12, r.left));
        card.style.cssText = 'width:' + cw + 'px;left:' + left + 'px;' + (below ? 'top:' + Math.min(innerHeight - 190, r.bottom + 14) + 'px' : 'top:' + Math.max(12, r.top - 194) + 'px');
        var b = card.querySelector('[data-x="1"]'); b && b.focus();
      }, 180);
    }
    function go(d) { i += d; if (i < 0) i = 0; if (i >= S.length) return end(); show(); }
    ov._go = go;
    ov.addEventListener('click', function (e) { var b = e.target.closest('[data-x]'); if (b) { if (b.dataset.x === 'end') end(); else go(+b.dataset.x); } else if (e.target === ov) end(); });
    document.addEventListener('keydown', key, true);
    show();
  }
  function autoTour() {

    var app = Alpine.store('app'); if (app.route !== 'ringkasan' || /[?&]tur=0/.test(location.search) || navigator.webdriver) return;
    setTimeout(function () { if (app.route === 'ringkasan') tour('ringkasan'); }, 1200);
  }
