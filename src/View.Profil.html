<!-- View.Profil — profil entitas hasil pencarian: stasiun, petak, wilayah (Daop/Divre), lintas, KA, JPL, sarana. -->
<template x-if="$store.app.route === 'profil' && $store.app.R">
  <section class="view" x-data="vProfil">
    <template x-if="!$store.app.refReady"><div class="card"><div class="card-b"><div class="skel" style="height:260px"></div><p class="note">Data referensi sedang dimuat…</p></div></div></template>
    <template x-if="$store.app.refReady && !M.ok"><div class="card"><div class="card-b"><h2 style="margin-top:0">Tidak ditemukan</h2><p x-text="M.msg"></p><button class="btn" @click="$store.app.go('cari', {})">Cari lagi</button></div></div></template>
    <template x-if="$store.app.refReady && M.ok">
      <div>
        <div class="phead phero" x-show="$store.app.params.type !== 'sarana'">
          <div class="phead-ic"><svg class="i"><use :href="'#' + M.icon"/></svg></div>
          <div style="flex:1;min-width:0">
            <div class="eyebrow" x-text="M.kindLabel"></div>
            <h2 x-text="M.title"></h2>
            <p x-text="M.sub"></p>
            <div class="tags"><template x-for="t in M.tags" :key="t.t"><span class="tag" :class="t.c" x-text="t.t"></span></template></div>
          </div>
          <dl class="facts"><template x-for="f in M.facts" :key="f[0]"><div><dt x-text="f[0]"></dt><dd><span x-text="f[1]"></span><a x-show="f[2]" :href="f[2]" target="_blank" rel="noopener" class="fact-src" x-text="f[3] || 'sumber'"></a></dd></div></template></dl>
          <div class="phero-spark"><span x-text="'Menit kelambatan · 24 bulan · ' + KAI.fmt.n(M.all.length) + ' kejadian tercatat'"></span><div class="chart" x-chart="spark"></div></div>
        </div>
        <?!= include('Part.UnitCard'); ?>
      </div>
    </template>
  </section>
</template>
<script>
document.addEventListener('alpine:init', function () {
  var memo = { k: '', v: null }, invAll = { k: '', v: null };
  var ICON = { stasiun: 'i-pin', petak: 'i-route', wilayah: 'i-map', lintas: 'i-route', ka: 'i-train', jpl: 'i-cross', sarana: 'i-train', depo: 'i-depot' };
  var KIND = { stasiun: 'Stasiun', petak: 'Petak jalan', wilayah: 'Wilayah operasi', lintas: 'Lintas', ka: 'Kereta api', jpl: 'Perlintasan sebidang (JPL)', sarana: 'Sarana', depo: 'Depo sarana' };
  var norm = function (s) { return KAIRef.norm(s); };

  KAI.profileTitle = function (p) {
    var R = KAI.data.ref; if (!p || !R) return 'Profil';
    if (p.type === 'stasiun') return 'Stasiun ' + (R.st[p.id] ? R.st[p.id].name : p.id);
    if (p.type === 'petak') { var g = R.seg[p.id]; return 'Petak ' + (g ? (R.st[g.a] || {}).name + ' – ' + (R.st[g.b] || {}).name : p.id); }
    if (p.type === 'ka') return 'KA ' + p.id;
    if (p.type === 'jpl') { var j = R.jpl.filter(function (x) { return x.id === p.id; })[0]; return 'JPL ' + (j ? j.no || KAI.NIL : ''); }
    if (p.type === 'sarana') return 'Sarana ' + KAI.fmt.unit(p.id);
    if (p.type === 'depo') return R.depot[p.id] ? R.depot[p.id].label : 'Depo';
    return (KIND[p.type] || 'Profil') + ' ' + p.id;
  };

  function inventoryAll(app, cfg) {
    var k = app.ver + '|' + app.f.kelas.join(',');
    if (invAll.k !== k) invAll = { k: k, v: KAIRef.crossingInventory(KAI.data.ref, KAIA.scope(KAI.data.all, { kelas: app.f.kelas }), cfg) };
    return invAll.v;
  }
  function stName(R, c) { return R.st[c] ? R.st[c].name : c; }
  function segLabel(R, key) { var g = R.seg[key]; return g ? stName(R, g.a) + ' – ' + stName(R, g.b) : key; }
  var NUM = function (c) { return KAI.fmt.n(c.getValue()); };
  var D1 = function (c) { return c.getValue() == null ? KAI.NIL : KAI.fmt.d1(c.getValue()); };
  var BOLD = function (c) { return '<b>' + KAITable.esc(c.getValue()) + '</b>'; };
  function stat(L) { return { n: L.length, menit: KAIA.sum(L, function (r) { return r.menit; }) }; }
  /** Data KA dari LIST KA / Daftar Waktu untuk nomor dari Buku Dukungan Sarana. */
  function kaMeta(R, no) {
    var n = norm(no), k = R.ka[n] || R.kaLeg[n];
    if (k) return { no: no, nama: k.nama, relasi: k.lintas, ber: k.ber || '', dat: k.dat || '', kelas: k.kelas || '', jenis: k.jenis || '' };
    var T = R.tt[n];
    if (T) { var a = T.stops[0], b = T.stops[T.stops.length - 1]; return { no: no, nama: T.nama, relasi: T.rel, ber: a.ber != null ? KAI.fmt.hm(a.ber) : '', dat: b.dat != null ? KAI.fmt.hm(b.dat) : '', kelas: '', jenis: '' }; }
    return { no: no, nama: '(tidak ada di LIST KA)', relasi: '', ber: '', dat: '', kelas: '', jenis: '' };
  }
  /** Peta unit sarana → depo, untuk menghitung gangguan per depo. */
  function byDepot(R, all) {
    var out = {};
    all.forEach(function (r) { var seen = {}; r.sarana.forEach(function (u) { var f = R.fleet[u]; if (f && !seen[f.depoId]) { seen[f.depoId] = 1; (out[f.depoId] = out[f.depoId] || []).push(r); } }); });
    return out;
  }
  function kaRowsOfDepots(R, depots, all) {
    var byKa = {}; all.forEach(function (r) { if (r.ka) (byKa[norm(r.ka)] = byKa[norm(r.ka)] || []).push(r); });
    var rows = [];
    depots.forEach(function (d) { d.ka.forEach(function (no) {
      var m = kaMeta(R, no), L = byKa[norm(no)] || [], S = stat(L);
      rows.push({ key: d.id + '|' + no, no: no, nama: m.nama, relasi: m.relasi, ber: m.ber, dat: m.dat, kelas: m.kelas, depo: d.label, n: S.n, menit: S.menit });
    }); });
    return rows;
  }
  var KA_DEPO_COLS = [{ title: 'KA', field: 'no', width: 84, formatter: BOLD, sorter: 'alphanum' }, { title: 'Nama KA', field: 'nama', minWidth: 170 }, { title: 'Relasi', field: 'relasi', width: 120 },
    { title: 'Berangkat', field: 'ber', width: 92 }, { title: 'Tiba', field: 'dat', width: 80 }, { title: 'Depo induk rangkaian', field: 'depo', minWidth: 190 },
    { title: 'Kejadian', field: 'n', hozAlign: 'right', width: 90 }, { title: 'Menit', field: 'menit', hozAlign: 'right', width: 86, formatter: NUM }];
  var openKa = function (d, app) { app.open('ka', d.no); };

  function jplRowsFor(R, app, cfg, predJ, predP) {
    var inv = inventoryAll(app, cfg), byJ = {}, rows = [];
    inv.points.forEach(function (p) { if (p.jpl) byJ[p.jpl.id] = p; });
    R.jpl.filter(predJ).forEach(function (j) {
      var p = byJ[j.id];
      rows.push({ key: j.id, jplId: j.id, titik: 'JPL ' + (j.no || KAI.NIL) + ' · ' + (j.antara || KAI.NIL), km: j.kmText, alamat: [j.kab, j.prov].filter(Boolean).join(', '), kat: j.kat, lebar: j.lebar, jalan: j.jalan || '', jalanSrc: j.jalanSrc || '', pengelola: j.pengelola || '',
        jaga: j.jaga, status: j.status || j.penjaga || '', p190: j.p190 ? 'Ya' : '', n: p ? p.n : 0, menit: p ? p.menit : 0, last: p ? p.last : '', ids: p ? p.recs.map(function (r) { return r.id; }) : [], src: 'JPL program' });
    });
    inv.points.filter(function (p) { return !p.jpl && predP(p); }).forEach(function (p) {
      var L = KAIRef.jplLookup(R, p.segKey, p.noJpl);
      rows.push({ key: p.key, jplId: '', titik: p.label, km: p.km != null ? KAI.fmt.km(p.km) : '', alamat: '', kat: '', lebar: '', jalan: L.jalan, jalanSrc: L.src, pengelola: '', jaga: L.jaga || 'tidak tercatat', status: 'di luar daftar program', p190: '',
        n: p.n, menit: p.menit, last: p.last, ids: p.recs.map(function (r) { return r.id; }), src: 'Laporan' });
    });
    return rows.sort(function (a, b) { return b.n - a.n || String(a.km).localeCompare(String(b.km)); });
  }

  function schedRow(x, R, code) {
    var k = x.ka, f = KAI.fmt;
    var lin = (x.role === 'langsung' || x.role === 'lintas') && x.t != null ? (x.est ? '≈ ' : '') + f.hm(x.t) : '';
    return { no: k.no, nama: k.nama, kelas: k.kelas, jenis: k.jenis, relasi: k.lintas, peran: x.role, keterangan: x.ket || '', stasiun: code ? stName(R, code) : '', code: code || '',
      datang: x.dat != null ? f.hm(x.dat) : '', berangkat: x.ber != null ? f.hm(x.ber) : '', lintas: lin,
      jam: x.t, ket: x.est ? 'Perkiraan' : 'Pasti', reg: k.reg, catatan: x.cat || '', sumber: k.tt ? 'Daftar Waktu' : 'Perkiraan rute' };
  }

  function build(app) {
    var R = KAI.data.ref, p = app.params || {}, cfg = app.config, Rep = app.R, P = Rep.P, M = { ok: true, type: p.type, id: p.id, icon: ICON[p.type] || 'i-info', kindLabel: KIND[p.type] || '', tags: [], facts: [] };
    var all = KAIA.scope(KAI.data.all, { kelas: app.f.kelas }), pred = null, traffic = null;
    if (KAIA.hoursOn(P)) all = all.filter(function (r) { return KAIA.inHours(r, P); });   // filter jam berlaku juga di profil
    M.scopeNote = [app.f.kelas.length && app.f.kelas.length < 4 ? 'kelas terpilih' : '', KAIA.hoursOn(P) ? 'jam ' + P.h0 + '–' + P.h1 : ''].filter(Boolean).join(', ');
    M.scopeNote = M.scopeNote ? ' · ' + M.scopeNote : '';
    M.lists = [];
    M.tabs = [{ id: 'riwayat', label: 'Riwayat gangguan' }];
    M.sched = { title: '', sub: '', rows: [], stats: [], note: '', roles: false }; M.jplRows = []; M.net = { title: '', sub: '', rows: [], cols: [] }; M.route = []; M.comps = [];
    var routes = KAIRef.ensureRoutes(R);

    if (p.type === 'stasiun') {
      var s = R.st[p.id]; if (!s) return { ok: false, msg: 'Stasiun ' + p.id + ' tidak ada di LIST STASIUN GAPEKA 2025.' };
      M.title = s.name + ' (' + s.code + ')'; M.sub = (s.region || 'Wilayah tidak tercatat') + ' · ' + (s.status || 'status tidak tercatat');
      var adj = (R.adj[s.code] || []);
      M.facts = [['Kode', s.code], ['Wilayah', s.region || KAI.NIL], ['Status', s.status || KAI.NIL], ['Petak tersambung', String(adj.length)]];
      pred = function (r) { return r.stCode === s.code; };
      var pass = routes.stPass[s.code] || [];
      M.sched.rows = pass.map(function (x) { return schedRow(x, R, ''); });
      M.sched.roles = true;
      M.sched.title = 'Jadwal KA di ' + s.name; M.sched.sub = pass.length + ' perjalanan dalam ' + KAI.gapeka.label(R.gapeka || '2025') + ' · klik baris untuk profil KA';
      var cnt = function (r) { return pass.filter(function (x) { return x.role === r; }).length; };
      M.sched.stats = [['Berangkat (asal)', cnt('berangkat')], ['Datang (tujuan)', cnt('datang')], ['Berhenti', cnt('berhenti')], ['Langsung', cnt('langsung')], ['Perkiraan (tanpa Daftar Waktu)', cnt('lintas')], ['Reguler', pass.filter(function (x) { return x.ka.reg; }).length]];
      M.sched.note = 'Sumber: Buku Daftar Waktu ' + KAI.gapeka.label(R.gapeka || '2025') + ((R.gapeka || '2025') === '2025' ? ' (tab M_JADWAL)' : '') + ' — jam datang/berangkat, berhenti/langsung, dan catatan silang/susul tercetak apa adanya. "≈" = KA langsung yang di buku tanpa jam ("Ls -"), diisi interpolasi antar jam pasti terdekat. Baris "Perkiraan rute" = KA di LIST KA tanpa Daftar Waktu (mis. KA dinas/varian): jam antara = interpolasi menurut km, bisa meleset ±30 menit.';
      var ops = KAIRef.opsOf(R, s.code);
      ops.forEach(function (o) { M.facts.push([o.jenis + ' (PTDO)', [o.buka ? 'buka ' + o.buka : '', o.tutup ? 'tutup ' + o.tutup : ''].filter(Boolean).join(' · ')]); });
      if (ops.length) M.tags.push({ t: ops[0].jenis === 'Non operasi' ? 'Stasiun non operasi pada jam tertentu' : 'Dinas tutup pada jam tertentu', c: 'warn' });
      M.tabs.push({ id: 'jadwal', label: 'Jadwal KA (' + pass.length + ')' });
      var segs = adj.map(function (e) { return e.key; });
      M.jplRows = jplRowsFor(R, app, cfg, function (j) { return segs.indexOf(j.segKey) >= 0 || segs.indexOf(j.pairKey) >= 0; }, function (pt) { return segs.indexOf(pt.segKey) >= 0; });
      M.tabs.push({ id: 'jpl', label: 'JPL di petak sekitar (' + M.jplRows.length + ')' });
      M.net = { title: 'Petak tersambung', sub: 'Dari LIST PETAK JALAN · KA/hari = perjalanan reguler (rute GAPEKA)', rows: adj.map(function (e) {
        var g = R.seg[e.key], L = all.filter(function (r) { return r.segKey === e.key; });
        return { segKey: e.key, nama: segLabel(R, e.key), lintas: g.lintas, km: g.km, jalur: g.track, ka: KAIRef.trafficOnSeg(R, e.key), n: L.length, menit: KAIA.sum(L, function (r) { return r.menit; }) };
      }) };
      M.tabs.push({ id: 'jaringan', label: 'Petak sekitar (' + adj.length + ')' });
      traffic = pass.filter(function (x) { return x.ka.reg; }).length;
    } else if (p.type === 'petak') {
      var g = R.seg[p.id]; if (!g) return { ok: false, msg: 'Petak ' + p.id + ' tidak ada di LIST PETAK JALAN.' };
      M.title = segLabel(R, g.key); M.sub = 'Petak ' + g.a + '–' + g.b + ' · lintas ' + (g.lintas || KAI.NIL) + ' · ' + (g.region || '');
      traffic = KAIRef.trafficOnSeg(R, g.key);
      M.facts = [['Jarak', g.km != null ? KAI.fmt.d1(g.km) + ' km' : KAI.NIL], ['Jalur', g.track || KAI.NIL], ['Wilayah', g.region || KAI.NIL], ['KA reguler/hari', String(traffic)]];
      if (g.track === 'tunggal' && traffic >= 40) M.tags.push({ t: 'Jalur tunggal padat', c: 'warn' });
      pred = function (r) { return r.segKey === g.key; };
      var sp = routes.segPass[g.key] || [];
      M.sched.rows = sp.map(function (x) { var k = x.ka; return { no: k.no, nama: k.nama, kelas: k.kelas, jenis: k.jenis, relasi: k.lintas, arah: stName(R, x.from) + ' → ' + stName(R, x.to),
        tA: x.tFrom != null ? (x.est ? '≈ ' : '') + KAI.fmt.hm(x.tFrom) : '', tB: x.tTo != null ? (x.est ? '≈ ' : '') + KAI.fmt.hm(x.tTo) : '', jam: x.tFrom, ket: x.est ? 'Perkiraan' : 'Pasti', reg: k.reg }; });
      M.sched.title = 'KA yang melintas'; M.sched.sub = sp.length + ' perjalanan (' + traffic + ' reguler) · arah dan jam di kedua ujung petak';
      M.sched.stats = [['Total perjalanan', sp.length], ['Reguler', traffic], ['Penumpang', sp.filter(function (x) { return x.ka.jenis === 'PENUMPANG'; }).length], ['Barang', sp.filter(function (x) { return x.ka.jenis === 'BARANG'; }).length]];
      M.sched.note = 'Jam di kedua ujung petak dari Buku Daftar Waktu ' + KAI.gapeka.label(R.gapeka || '2025') + '. "≈" = KA langsung tanpa jam tercetak (interpolasi antar jam pasti) atau KA tanpa Daftar Waktu (perkiraan rute).';
      M.tabs.push({ id: 'jadwal', label: 'KA melintas (' + sp.length + ')' });
      M.jplRows = jplRowsFor(R, app, cfg, function (j) { return j.segKey === g.key || j.pairKey === g.key; }, function (pt) { return pt.segKey === g.key; });
      M.tabs.push({ id: 'jpl', label: 'JPL (' + M.jplRows.length + ')' });
    } else if (p.type === 'wilayah') {
      var W = R.regions[p.id]; if (!W) return { ok: false, msg: p.id + ' tidak dikenali.' };
      M.title = p.id; M.sub = W.st.length + ' stasiun · ' + W.segs.length + ' petak (GAPEKA 2025)';
      var jw = R.jpl.filter(function (j) { return j.region === p.id; });
      M.facts = [['Stasiun', String(W.st.length)], ['Petak', String(W.segs.length)], ['JPL program', String(jw.length)], ['JPL tidak dijaga', String(jw.filter(function (j) { return j.jaga === 'tidak dijaga'; }).length)]];
      pred = function (r) { return r.wilayah === p.id; };
      var rows = [];
      W.st.forEach(function (c) { (routes.stPass[c] || []).forEach(function (x) { if (x.role === 'berangkat' || x.role === 'datang') rows.push(schedRow(x, R, c)); }); });
      rows.sort(function (a, b) { return (a.jam == null ? 9999 : a.jam) - (b.jam == null ? 9999 : b.jam); });
      M.sched.rows = rows; M.sched.wil = true;
      M.sched.title = 'KA berangkat & datang di ' + p.id; M.sched.sub = rows.length + ' perjalanan berangkat/berakhir di stasiun wilayah ini (jam pasti) · klik untuk profil KA';
      M.sched.stats = [['Berangkat', rows.filter(function (r) { return r.peran === 'berangkat'; }).length], ['Datang', rows.filter(function (r) { return r.peran === 'datang'; }).length],
        ['Stasiun aktif berangkat/datang', Object.keys(rows.reduce(function (a, r) { a[r.code] = 1; return a; }, {})).length], ['Reguler', rows.filter(function (r) { return r.reg; }).length]];
      M.sched.note = 'Hanya KA yang berangkat atau berakhir di stasiun wilayah ini. KA yang sekadar melintas terlihat di profil stasiun/petak.';
      M.tabs.push({ id: 'jadwal', label: 'KA berangkat/datang (' + rows.length + ')' });
      M.jplRows = jplRowsFor(R, app, cfg, function (j) { return j.region === p.id; }, function (pt) { return pt.region === p.id; });
      M.tabs.push({ id: 'jpl', label: 'JPL (' + M.jplRows.length + ')' });
      M.net = { title: 'Stasiun di ' + p.id, sub: 'Klik untuk profil stasiun', rows: W.st.map(function (c) {
        var L = all.filter(function (r) { return r.stCode === c; }), ps = routes.stPass[c] || [];
        return { code: c, nama: stName(R, c) + ' (' + c + ')', lintas: (R.st[c] || {}).status || '', km: null, jalur: '', ka: ps.filter(function (x) { return x.ka.reg; }).length, n: L.length, menit: KAIA.sum(L, function (r) { return r.menit; }) };
      }).sort(function (a, b) { return b.n - a.n || b.ka - a.ka; }) };
      M.tabs.push({ id: 'jaringan', label: 'Stasiun (' + W.st.length + ')' });
      // Petak jalan wilayah
      var segRows = W.segs.map(function (key) {
        var g4 = R.seg[key], S = stat(all.filter(function (r) { return r.segKey === key; }));
        return { key: key, nama: segLabel(R, key), kode: g4.a + '–' + g4.b, lintas: g4.lintas || '', km: g4.km, jalur: g4.track || '', ka: KAIRef.trafficOnSeg(R, key), n: S.n, menit: S.menit };
      });
      M.lists.push({ id: 'petak', title: 'Petak jalan ' + p.id, sub: segRows.length + ' petak (LIST PETAK JALAN GAPEKA 2025) · klik untuk profil petak', rows: segRows, sort: 'n',
        cols: [{ title: 'Petak', field: 'nama', minWidth: 200, formatter: BOLD }, { title: 'Kode', field: 'kode', width: 104 }, { title: 'Lintas', field: 'lintas', minWidth: 130 },
          { title: 'Km', field: 'km', hozAlign: 'right', width: 72, formatter: D1 }, { title: 'Jalur', field: 'jalur', width: 84 }, { title: 'KA reguler/hari', field: 'ka', hozAlign: 'right', width: 118 },
          { title: 'Kejadian', field: 'n', hozAlign: 'right', width: 90 }, { title: 'Menit', field: 'menit', hozAlign: 'right', width: 86, formatter: NUM }],
        open: function (d, a) { a.open('petak', d.key); } });
      M.tabs.push({ id: 'petak', label: 'Petak (' + segRows.length + ')' });
      // Depo di wilayah (lokasi depo = kode stasiun pada nama depo SAP / Buku Dukungan Sarana)
      var deps = (W.depots || []).map(function (id) { return R.depot[id]; }).filter(function (d) { return d.units.length || d.ka.length; }), incD = byDepot(R, all), warnY = cfg.ageWarn;
      var depRows = deps.map(function (d) {
        var ages = d.units.map(function (u) { return u.age; }).filter(function (a) { return a != null; }), S = stat(incD[d.id] || []);
        return { key: d.id, depo: d.label, jenis: d.type, units: d.units.length, old: d.units.filter(function (u) { return u.age != null && u.age > warnY; }).length, med: KAIA.median(ages), ka: d.ka.length, n: S.n, menit: S.menit };
      });
      M.lists.push({ id: 'depo', title: 'Depo di ' + p.id, sub: depRows.length + ' depo · sarana dari Referensi Sarana (SAP), KA dari Buku Dukungan Sarana · klik untuk profil depo', rows: depRows, sort: 'units',
        cols: [{ title: 'Depo', field: 'depo', minWidth: 220, formatter: BOLD }, { title: 'Jenis', field: 'jenis', width: 150 }, { title: 'Sarana', field: 'units', hozAlign: 'right', width: 86, formatter: NUM },
          { title: '> ' + warnY + ' th', field: 'old', hozAlign: 'right', width: 82, formatter: function (c) { var v = c.getValue(); return v ? '<b style="color:var(--bad)">' + KAI.fmt.n(v) + '</b>' : '0'; } },
          { title: 'Median usia', field: 'med', hozAlign: 'right', width: 104, formatter: D1 }, { title: 'KA dilayani', field: 'ka', hozAlign: 'right', width: 100 },
