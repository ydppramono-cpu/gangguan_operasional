<script>
/**
 * Js.Report — Laporan Gangguan Operasional (Executive Summary) PPT & PDF dari SATU model halaman (16:9, 13,333 × 7,5 in).
 *
 * Dua alur cerita (storyline), dipilih otomatis dari filter wilayah:
 *  - KAI   (semua / beberapa wilayah): ringkasan eksekutif → perbandingan MoM/YoY/YTD → subgangguan → tren → matriks →
 *          perlintasan → peta wilayah → sarana → prasarana → eksposur → konteks eksternal → rekomendasi → lampiran.
 *  - WILAYAH (tepat satu Daop/Divre): ringkasan eksekutif → profil wilayah → tren riwayat → periode setara → lokasi →
 *          lokasi terberat → sarana → perlintasan → alam & kerawanan → konteks eksternal → rekomendasi → lampiran.
 *
 * Prinsip: setiap angka dihitung dari data (Gangguan_Induk) dan dapat dilacak; setiap fakta eksternal berasal dari tab
 * M_RUJUKAN (sudah diverifikasi) dan diberi nomor catatan kaki [n] dengan daftar sumber gaya APA 7 di akhir laporan.
 * Tidak ada angka atau kutipan yang dikarang: bila data tidak ada, laporan menuliskannya apa adanya.
 *
 * PPT: grafik = grafik PowerPoint asli (Edit Data), tabel & teks dapat disunting. PDF: posisi identik, grafik dirender ECharts.
 */
window.KAIReport = (function () {
  var W = 13.333, H = 7.5;
  var NAVY = '021D4A', NAVY2 = '1C3A6E', BRAND = '252271', ORANGE = 'F06A25', GOLD = 'F2B90F', INK = '17223B', MUTED = '5B6475', LINE = 'D8DEEA', SOFT = 'F2F2F2';
  var RED = 'B42318', GREEN = '067647', INS_BG = 'FCE9DE', REC_BG = 'EAF1E1', INS_HEAD = 'B5401B';
  var CLS = { operasional: '2E6E62', sarana: '3B5BDB', alam: 'E0861A', prasarana: '6B7A90' };
  var CLS_NAME = { operasional: 'Operasi, layanan & keamanan', sarana: 'Sarana', alam: 'Alam', prasarana: 'Prasarana' };
  var CLS_SHORT = { operasional: 'Ops/layanan/keamanan', sarana: 'Sarana', alam: 'Alam', prasarana: 'Prasarana' };
  var FONT = 'Arial', FOOT_ORG = 'Subdivision of Big Data Analytic', FOOT_UNIT = 'IOB –';
  var REGION_NAME = { 'Daop 1': 'Daop 1 Jakarta', 'Daop 2': 'Daop 2 Bandung', 'Daop 3': 'Daop 3 Cirebon', 'Daop 4': 'Daop 4 Semarang', 'Daop 5': 'Daop 5 Purwokerto',
    'Daop 6': 'Daop 6 Yogyakarta', 'Daop 7': 'Daop 7 Madiun', 'Daop 8': 'Daop 8 Surabaya', 'Daop 9': 'Daop 9 Jember', 'Divre 1': 'Divre I Sumatera Utara',
    'Divre 2': 'Divre II Sumatera Barat', 'Divre 3': 'Divre III Palembang', 'Divre 4': 'Divre IV Tanjungkarang' };
  // Kunci literatur lama (Js.Insight) → ID baris M_RUJUKAN, agar rujukan rekomendasi tercetak dalam format APA.
  var LITMAP = { morrissey1980: 'S01', evans2011: 'S02', evans2019: 'S03', singh2022: 'S04', fhwa2019: 'S05', varley2018: 'S06', kamalian2025: 'S07',
    ferranti2017: 'S08', oskouei2024: 'S09', corman2017: 'S10', liu2014: 'S11', zhou2002: 'S12', dimitrova2025: 'S13' };
  // Topik rujukan per kelas/bagian laporan.
  var TOPIC = { operasional: ['perlintasan', 'temperan', 'keamanan', 'vandalisme'], sarana: ['sarana', 'lokomotif', 'perawatan'], alam: ['alam', 'banjir', 'longsor', 'gempa', 'pohon', 'cuaca'],
    prasarana: ['prasarana', 'rel', 'persinyalan', 'wesel'], perlintasan: ['perlintasan', 'temperan'] };

  function fm() { return KAI.fmt; }
  function regionLong(w) { return REGION_NAME[w] || w; }
  function pctTxt(a, b) { return b ? KAI.fmt.pct(KAIA.pct(a, b)) : (a ? 'baru' : '0%'); }
  function pct0(a, b) { var v = KAIA.pct(a, b); return v == null ? (a ? 'baru' : '0%') : (v > 0 ? '+' : v < 0 ? '−' : '') + KAI.fmt.n(Math.abs(v * 100)) + '%'; }
  function arrow(a, b) { return a > b ? '▲' : a < b ? '▼' : '='; }
  function share(a, b) { return b ? a / b : 0; }
  function pctS(v) { return KAI.fmt.n(v * 100) + '%'; }
  function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
  function clip(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; }
  function subOf(r) { return String(r.sub || r.judul || 'Tidak tercatat').replace(/^[^-–]{2,40}\s[-–]\s/, ''); }
  function sumM(L) { return KAIA.sum(L, function (r) { return r.menit; }); }
  function byMenit(a, b) { return b.menit - a.menit || b.n - a.n; }
  function monYY(ym) { return KAI.fmt.mon(ym).replace(' ', " ‘"); }
  function dayTxt(r) { return r.date ? KAI.fmt.day(r.date) : KAI.fmt.date(r); }

  /* ======================= PUSTAKA RUJUKAN & CATATAN KAKI ======================= */
  function Sources(meta, R) {
    var list = [], idx = {};
    function add(key, o) { if (idx[key]) return idx[key]; o.n = list.length + 1; o.key = key; list.push(o); idx[key] = o.n; return o.n; }
    var api = {
      list: list,
      db: function () {
        return add('db', { jenis: 'Data internal', short: 'Gangguan_Induk, snapshot ' + meta.version,
          apa: 'PT Kereta Api Indonesia (Persero). (' + String(meta.lastYm || '').slice(0, 4) + '). Basis data gangguan dan hambatan 2025–2026: tab Gangguan_Induk [Data set; snapshot ' + meta.version +
            ', data s.d. ' + KAI.fmt.month(meta.lastYm) + ', aturan klasifikasi ' + meta.rule + ']. Data internal, tidak dipublikasikan.' });
      },
      gapeka: function () { return add('gapeka', { jenis: 'Data internal', short: 'GAPEKA 2025 (stasiun, petak, KA)', apa: 'PT Kereta Api Indonesia (Persero). (2025). Grafik perjalanan kereta api (GAPEKA) 2025: daftar stasiun, petak jalan, dan kereta api [Data set]. Data internal.' }); },
      jpl: function () { return add('jpl', { jenis: 'Data internal', short: 'Master JPL (M_JPL)', apa: 'PT Kereta Api Indonesia (Persero). (2026). Master jalan perlintasan langsung (M_JPL) [Data set]. Data internal.' }); },
      rate: function () { return add('rate', { jenis: 'Data internal', short: 'Rate pendapatan per jam (Passenger, Freight, GAPEKA 2025)', apa: 'PT Kereta Api Indonesia (Persero). (2026). Pendapatan KA penumpang (tab Passenger) dan KA barang (tab Freight) per bulan, dicocokkan dengan durasi perjalanan GAPEKA 2025 dan hari jalan Laporan KA Jalan/Batal 2026 [Data internal; pendapatan terekspos, bukan kerugian akuntansi].' }); },
      thi: function () { return add('thi', { jenis: 'Data internal', short: 'THI (Track Health Index) per UPT Resor JR', apa: 'PT Kereta Api Indonesia (Persero). (2026). Track Health Index (THI) per UPT Resor Jalan Rel, Mei–Oktober 2026: tab THI [Data set; 13 berkas THI per Daop/Divre]. Data internal.' }); },
      rhi: function () { return add('rhi', { jenis: 'Data internal', short: 'RHI (Rolling-stock Health Index) lokomotif', apa: 'PT Kereta Api Indonesia (Persero). (2026). Rolling-stock Health Index (RHI) lokomotif harian, Oktober 2026: tab RHI [Data set; RHI_Oktober sarana.xlsx; nilai desimal dipulihkan & diverifikasi rumus]. Data internal.' }); },
      wkp: function () { return add('wkp', { jenis: 'Data internal', short: 'Rekap window time pekerjaan prasarana (WKP)', apa: 'PT Kereta Api Indonesia (Persero). (2026). Rekap window time pekerjaan perawatan prasarana (WKP) Oktober 2024–November 2026: tab WKP [Data set; REKAP WINDOW TIME.xlsx]. Data internal.' }); },
      peta: function () { return add('peta', { jenis: 'Data internal', short: 'Peta Wilayah UPT Resor JR (PETA_WILAYAH)', apa: 'PT Kereta Api Indonesia (Persero). (2026). Peta wilayah Daerah Operasi 1–9 dan Divisi Regional I–IV: batas UPT Resor Jalan Rel [Peta; PETA_WILAYAH.pdf]. Data internal.' }); },
      lib: function (r) { return add('lib:' + r.id, { jenis: r.jenis, short: shortOf(r), apa: r.apa, url: r.url, user: !!r.user }); },
      cite: function (ns) { ns = (ns || []).filter(Boolean); return ns.length ? '[' + ns.filter(function (n, i) { return ns.indexOf(n) === i; }).join('][') + ']' : ''; },
      foot: function (ns) {   // "Sumber: [1] Gangguan_Induk …; [7] InfoPublik 22/09/2026"
        ns = (ns || []).filter(function (n, i, a) { return n && a.indexOf(n) === i; }).sort(function (a, b) { return a - b; });
        return ns.length ? 'Sumber: ' + ns.map(function (n) { return '[' + n + '] ' + list[n - 1].short; }).join('; ') + '.' : '';
      }
    };
    return api;
  }
  function shortOf(r) {
    var who = String(r.apa || '').split(/\.\s*\(/)[0].split(',')[0].trim();
    var d = r.tanggal && /^\d{4}-\d{2}-\d{2}$/.test(r.tanggal) ? r.tanggal.slice(8, 10) + '/' + r.tanggal.slice(5, 7) + '/' + r.tanggal.slice(0, 4) : (r.tanggal || '');
    return clip(who, 40) + (d ? ' ' + d : '') + (r.jenis === 'Ilmiah' || r.jenis === 'Pedoman' ? '' : '');
  }
  /** Pilih rujukan relevan: cocok topik, cocok wilayah (atau berlaku umum), tidak terbit setelah hari ini. Wilayah spesifik diutamakan. */
  function pickLib(lib, topics, regions, opt) {
    opt = opt || {};
    var today = new Date().toISOString().slice(0, 10), maxD = opt.maxDate && opt.maxDate < today ? opt.maxDate : (pickLib.maxDate && pickLib.maxDate < today ? pickLib.maxDate : today);
    return (lib || []).filter(function (r) {
      if (opt.jenis && opt.jenis.indexOf(r.jenis) < 0) return false;
      if (r.tanggal && /^\d{4}-\d{2}-\d{2}$/.test(r.tanggal) && r.tanggal > maxD) return false;
      var tOk = !topics || !topics.length || r.topik.some(function (t) { return topics.indexOf(t) >= 0; });
      // rujukan khusus wilayah hanya dipakai bila wilayah itu ada di cakupan laporan
      var wOk = !r.wilayah.length || (regions || []).some(function (w) { return r.wilayah.indexOf(w) >= 0; });
      if (opt.regionOnly && !r.wilayah.length) return false;
      return tOk && wOk;
    }).sort(function (a, b) {
      return (b.wilayah.length ? 1 : 0) - (a.wilayah.length ? 1 : 0) || (b.user ? 1 : 0) - (a.user ? 1 : 0) || String(b.tanggal).localeCompare(String(a.tanggal));
    }).slice(0, opt.max || 99);
  }

  /* ======================= MODEL HALAMAN ======================= */
  /**
   * ctx: { R, meta, recs (kejadian dalam cakupan filter), ref, narr, wilayah (filter), opts:{ expo, external, extraViz, appendix, notes, extraRefs } }
   * Tata letak mengikuti templat "Laporan Gangguan Operasional · Executive Summary" (koordinat inci, 13,333 × 7,5).
   * Mengembalikan { slides, sources, mode, title }.
   */
  function build(ctx) {
    var R = ctx.R, meta = ctx.meta, f = fm(), cfg = R.cfg, O = ctx.opts || {};
    var regions = (ctx.wilayah || []).slice(), mode = regions.length === 1 ? 'wilayah' : 'kai';
    var lib = ((ctx.ref && ctx.ref.ruj) || []).concat((O.extraRefs || []).map(function (r, i) {
      return { id: 'U' + (i + 1), jenis: r.jenis || 'Media', apa: r.apa, url: r.url, tanggal: r.tanggal || '', wilayah: r.wilayah ? [r.wilayah] : [], topik: (r.topik || '').split(/\s*,\s*/).filter(Boolean),
        fakta: r.fakta || '', implikasi: r.implikasi || '', verif: 'Ditambahkan pengguna', user: true };
    }));
    var SRC = Sources(meta, R), S = [], DB = SRC.db();
    pickLib.maxDate = mode === 'kai' ? KAIA.addDays(KAIA.endOf(R.P), 31) : null;
    function mName(P) { return P.kind === 'month' && P.yms.length === 1 ? KAIA.MONTHS[+P.yms[0].slice(5, 7) - 1] : P.base; }
    var sameYear = R.P.kind === 'month' && R.prevP.kind === 'month' && R.P.yms[0].slice(0, 4) === R.prevP.yms[0].slice(0, 4);

    /* ---------- primitif ---------- */
    function slide(title, o) { var s = Object.assign({ kind: 'content', title: title, items: [], cites: [DB], toc: null }, o || {}); S.push(s); return s; }
    function add(s, type, x, y, w, h, o) { s.items.push(Object.assign({ type: type, x: x, y: y, w: w, h: h }, o || {})); return s.items[s.items.length - 1]; }
    function text(s, x, y, w, h, t, o) { return add(s, 'text', x, y, w, h, Object.assign({ text: t, size: 10.5 }, o || {})); }
    function note(s, x, y, w, h, t, size) { return text(s, x, y, w, h, t, { size: size || 7.5, color: MUTED, italic: true }); }
    function sub(s, t, o) { return text(s, 0.45, 0.88, 12.4, 0.3, t, Object.assign({ size: 12, bold: true, color: NAVY }, o || {})); }
    function band(s, x, y, w, h, t, o) { return add(s, 'band', x, y, w, h, Object.assign({ text: t, fill: NAVY, size: 11 }, o || {})); }
    function card(s, x, y, w, h, label, value, subT, color, o) { return add(s, 'card', x, y, w, h, Object.assign({ label: label, value: value, sub: subT, color: color || NAVY }, o || {})); }
    function tbl(s, x, y, w, h, rows, o) { return add(s, 'table', x, y, w, h, Object.assign({ rows: rows }, o || {})); }
    function chart(s, x, y, w, h, spec) { return add(s, 'chart', x, y, w, h, spec); }
    /** Baris Insight + Rekomendasi gaya templat (label kiri). */
    function insrec(s, ins, rec, y, hi, hr, label1) { add(s, 'insrec', 0.6, y, 12.1, hi + hr + 0.05, { ins: ins, rec: rec, hi: hi, hr: hr, label1: label1 || 'Insight' }); }
    function cite(s, ns) { ns = [].concat(ns || []).filter(Boolean); s.cites = s.cites.concat(ns); return SRC.cite(ns); }
    function libCite(s, r) { if (!r || !r.apa) return ''; var n = SRC.lib(r); s.cites.push(n); return '[' + n + ']'; }
    function recText(list) { list = list.filter(Boolean).map(function (t) { return String(t).replace(/\s+$/, '').replace(/\.$/, ''); }); return list.map(function (t, i) { return '(' + (i + 1) + ') ' + t; }).join('; ') + (list.length ? '.' : ''); }
    function V(x, s) { return typeof x === 'function' ? x(s) : x; }

    /* ---------- data dasar ---------- */
    var recs = ctx.recs, L = R.L, K = R.kpi, Kp = R.kpiPrev, Ky = R.kpiYoy, end = KAIA.endOf(R.P);
    var recsToEnd = recs.filter(function (r) { return r.date ? r.date <= end : r.ym <= R.ym; });
    var pairs = (R.insight && R.insight.pairs) || [];
    function pairCites(s, p) { return (p.rec.lit || []).map(function (k) { var id = LITMAP[k], r = id && lib.filter(function (x) { return x.id === id; })[0]; return r ? libCite(s, r) : ''; }).join(''); }
    function pairFor(areas) { return pairs.filter(function (p) { return areas.indexOf(p.area) >= 0 || areas.indexOf(p.rec.area) >= 0; }); }
    function recFrom(s, areas, extra, max) {
      var ps = pairFor(areas).slice(0, 2), out = (extra || []).slice();
      ps.forEach(function (p) { out.push(p.rec.title + ' — ' + p.rec.actions[0] + ' ' + pairCites(s, p)); });
      return out.length ? recText(out.slice(0, max || 3)) : 'Tidak ada temuan yang memicu tindakan khusus pada bagian ini; pantau pada periode berikutnya.';
    }
    function kindKey(r) { return (KAIA.baseSub(r.sub || r.judul || '') || r.sub || r.judul || 'Tidak tercatat'); }
    function topKinds(LL, c, n) { return KAIA.topOf(LL.filter(function (r) { return !c || r.kelas === c; }), c, cfg, n || 3); }
    function statKind(LL, c, label) { return KAIA.stat(LL.filter(function (r) { return (!c || r.kelas === c) && kindKey(r).toLowerCase() === String(label).toLowerCase(); })); }
    function isLoco(r) { return r.kelas === 'sarana' && (/lok/i.test(r.jenis || '') || /lokomotif|\blok\b/i.test((r.sub || '') + ' ' + (r.judul || '')) || (r.sarana || []).some(function (n) { return /^(CC|BB)\d/.test(n); })); }

    /* ======================= SAMPUL & DAFTAR ISI ======================= */
    var chip = mode === 'wilayah' ? regionLong(regions[0]) + ' · ' + monYY(R.ym) : R.P.base + (regions.length ? ' · ' + (regions.length > 3 ? regions.length + ' wilayah' : regions.join(', ')) : '');
    S.push({ kind: 'cover', chip: chip, items: [], cites: [] });
    var TOC = { kind: 'toc', sub: 'Laporan Gangguan Operasional · ' + (mode === 'wilayah' ? regionLong(regions[0]) : R.P.base + (R.scopeLabel ? ' · ' + R.scopeLabel : '')), entries: [], items: [], cites: [] };
    S.push(TOC);
    var KREP = {};

    if (mode === 'kai') kaiStory(); else regionStory();
    if (O.extraViz) extraVizSlides(mode === 'wilayah' ? recsToEnd : L, mode === 'wilayah' ? regions[0] + ' s.d. ' + f.mon(R.ym) : R.P.base);
    if (O.external === true) { externalSlide(); recSlide(); }
    if (O.notes && String(O.notes).trim()) notesSlide();
    S.push({ kind: 'closing', chip: chip.length > 30 ? (mode === 'wilayah' ? chip : R.P.base) : chip, items: [], cites: [] });
    S.push({ kind: 'section', title: 'Lampiran', sub: 'Data pendukung, profil wilayah, kondisi sarana & prasarana, dan sumber', items: [], cites: [], toc: 'Lampiran' });
    if (O.appendix !== false) { if (mode === 'kai') kaiAppendix(); else regionAppendix(); }
    sourcesSlides();

    var no = 0, rom = 0, inApp = false, APX = null;
    S.forEach(function (s) {
      if (s.kind === 'section') { inApp = true; APX = s; s.list = []; }
      if (s.kind === 'content') s.no = inApp ? roman(++rom) : String(++no);
      if (s.appx && APX) APX.list.push({ no: s.no, title: s.appx });
      var le = TOC.entries[TOC.entries.length - 1];
      if (s.toc) { TOC.entries.push({ title: s.toc, no: s.kind === 'section' ? 'i' : s.no, first: s.no, group: s.tocGroup || null, hot: !!s.tocHot }); }
      else if (s.tocGroup && le && le.group === s.tocGroup && s.no) le.no = le.first + '–' + s.no;
      if (s.kind === 'section') { TOC.entries[TOC.entries.length - 1].group = 'appx'; }
      else if (inApp && s.no && TOC.entries.length && TOC.entries[TOC.entries.length - 1].group === 'appx') TOC.entries[TOC.entries.length - 1].no = 'i–' + s.no;
      s.foot = s.kind === 'content' ? SRC.foot(s.cites) : '';
      s.stamp = 'Data s.d. ' + f.month(meta.lastYm) + ' · snapshot ' + meta.version + ' · aturan ' + meta.rule;
    });
    return { slides: S, sources: SRC.list, mode: mode, title: 'Laporan Gangguan Operasional · ' + (mode === 'wilayah' ? regionLong(regions[0]) : R.P.base) };

    /* =====================================================================================
     *                         KOMPONEN SLIDE BERSAMA (pola templat)
     * ===================================================================================== */
    /** Ringkasan eksekutif: 4 kartu, 3 temuan bernomor, scorecard, langkah segera. */
    function execSlide(title, toc, leadLabel, leadRest, cards, fHead, findings, scHead, scRows, scColW, scNote, actions) {
      var s = slide(title, { toc: toc });
      text(s, 0.45, 0.86, 12.4, 0.42, [{ text: leadLabel + '   |   ', bold: true, color: ORANGE }, { text: leadRest, bold: true, color: INK }], { size: 10.5, runs: true });
      var cw = 2.86, gap = 0.22; cards.forEach(function (k, i) { card(s, 0.6 + i * (cw + gap), 1.41, cw, 1.1, k[0], k[1], k[2], k[3], { subColor: k[4] }); });
      add(s, 'findings', 0.6, 2.68, 7.35, 3.13, { head: fHead, list: findings });
      band(s, 8.15, 2.93, 4.6, 0.39, scHead, { fill: NAVY2, size: 14 });
      tbl(s, 8.17, 3.41, 4.5, 2.2, scRows, { fs: 10, colW: scColW, arrows: [scRows[0].length - 1], hiCol: scRows[0].length === 5 && /vs/.test(scRows[0][4]) ? 1 : 2, delta: scRows[0][3] === 'Δ' ? [3] : [] });
      note(s, 8.17, 5.64, 4.5, 0.3, scNote, 7);
      add(s, 'action', 0.6, 6.06, 12.15, 0.72, { head: 'Langkah yang perlu ditindaklanjuti segera:', body: actions });
      return s;
    }
    /** Matriks kuadran frekuensi × kelambatan (dua panel) + kartu Top 3 di kanan — digambar dengan bentuk seperti templat. */
    function matrixSlide(title, toc, A, B, labA, labB, rightHead, lists, insT, recT) {
      var s = slide(title, { toc: toc });
      var all = A.points.concat(B.points), xMax = Math.max.apply(null, all.map(function (p) { return p.n; }).concat([1])) * 1.12, yMax = Math.max.apply(null, all.map(function (p) { return p.menit; }).concat([1])) * 1.12;
      [[A, labA, 0.47], [B, labB, 4.6]].forEach(function (m) {
        band(s, m[2], 1.1, 3.7, 0.25, m[1]);
        add(s, 'matrix', m[2], 1.62, 3.7, 2.68, { pts: m[0].points.map(function (p) { return { c: p.kelas, n: p.n, m: p.menit }; }), xMax: xMax, yMax: yMax, medN: m[0].medN, medM: m[0].medMenit });
      });
      add(s, 'legend', 0.47, 4.6, 7.83, 0.22, { kind: 'dot', items: KAIA.CLASSES.map(function (c) { return { name: CLS_NAME[c], color: CLS[c] }; }) });
      note(s, 0.47, 4.86, 7.9, 0.2, 'Catatan: garis putus = median 4 jenis gangguan di panel; label gelembung = total menit kelambatan. Median membagi tinggi/rendah secara relatif, bukan target kinerja.', 7.5);
      band(s, 8.65, 1.1, 4.08, 0.25, rightHead);
      var y = 1.45;
      lists.forEach(function (Lz, k) {
        add(s, 'listcards', 8.65, y, 4.08, 0.38 + 0.45 * 3, { head: Lz.head, color: Lz.color, headSize: k ? 12 : 10.5, items: Lz.items, itemH: 0.43, step: 0.45 });
