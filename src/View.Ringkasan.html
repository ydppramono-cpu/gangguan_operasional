<!-- View.Ringkasan — layar pertama eksekutif: jawaban dulu, perbandingan MoM/YoY/YTD, insight & rekomendasi, rincian sesudahnya. -->
<template x-if="$store.app.route === 'ringkasan' && $store.app.R">
  <section class="view" x-data="vRingkasan">
    <div class="headline">
      <div style="flex:1">
        <h2 x-text="R.highlightsText[0] || 'Tidak ada kejadian pada periode ini.'"></h2>
        <p x-text="'Ringkasan ' + R.label + (R.scopeLabel ? ' · ' + R.scopeLabel : ' · seluruh wilayah Jawa–Sumatera')"></p>
      </div>
      <span class="tag" x-show="R.partial">Bulan berjalan · belum lengkap</span>
    </div>

    <div class="grid g-4 mt">
      <template x-for="c in cards" :key="c.id">
        <button class="card kpi" :style="'--kpi-c:' + c.color" @click="c.go()">
          <div class="lbl" x-text="c.label"></div>
          <div class="val num"><span x-effect="KAI.countUp($el, c.value, c.fmt)"></span><small x-text="c.unit"></small></div>
          <div class="deltas">
            <span class="delta" :class="KAI.delta(c.value, c.prev, c.small).cls" :title="'MoM vs ' + R.prevLabel"><span x-text="'MoM ' + KAI.delta(c.value, c.prev, c.small).text"></span></span>
            <span class="delta" :class="KAI.delta(c.value, c.yoy, c.small).cls" :title="'YoY vs ' + R.yoyLabel"><span x-text="'YoY ' + KAI.delta(c.value, c.yoy, c.small).text"></span></span>
          </div>
          <div class="note" style="margin-top:6px" x-show="c.note" x-text="c.note"></div>
        </button>
      </template>
    </div>

    <div class="grid g-2-1 mt">
      <div class="card">
        <div class="card-h"><div><h3>Perbandingan MoM · YoY · YTD</h3>
          <p x-text="'MoM = vs ' + R.prevLabel + ' · YoY = vs ' + R.yoyLabel + ' · YTD = ' + R.ytdP.label + ' vs ' + R.cmp.ytdPrevP.label"></p></div></div>
        <div class="card-b tbl-wrap" style="max-height:none">
          <table class="tbl cmp nopg">
            <thead><tr><th>Indikator</th><th class="num" x-text="R.P.short"></th><th class="num">MoM</th><th class="num">YoY</th><th class="num" x-text="'YTD ' + R.ytdP.short"></th><th class="num">Δ YTD</th></tr></thead>
            <tbody>
              <template x-for="r in R.cmp.rows.concat(R.cmp.cls)" :key="r.key">
                <tr :class="/^cls-/.test(r.key) && 'sub click'" @click="/^cls-/.test(r.key) && $store.app.go('telusuri', { kelas: r.label })" :title="/^cls-/.test(r.key) ? 'Telusuri kejadian kelas ini' : null">
                  <td><i class="cdot" x-show="/^cls-/.test(r.key)" :style="'background:' + KAI.classColor(r.label)"></i>
                    <span x-text="/^cls-/.test(r.key) ? 'Menit ' + $store.app.classLabel(r.label).split(',')[0] : r.label"></span></td>
                  <td class="num"><b x-text="r.key === 'avg' ? KAI.fmt.d1(r.cur) : KAI.fmt.n(r.cur)"></b></td>
                  <td class="num"><span class="delta" :class="KAI.delta(r.cur, r.prev).cls" :title="R.prevLabel + ': ' + KAI.fmt.n(r.prev)" x-text="KAI.delta(r.cur, r.prev).text"></span></td>
                  <td class="num"><span class="delta" :class="KAI.delta(r.cur, r.yoy).cls" :title="R.yoyLabel + ': ' + KAI.fmt.n(r.yoy)" x-text="KAI.delta(r.cur, r.yoy).text"></span></td>
                  <td class="num" x-text="r.key === 'avg' ? KAI.fmt.d1(r.ytd) : KAI.fmt.n(r.ytd)"></td>
                  <td class="num"><span class="delta" :class="KAI.delta(r.ytd, r.ytdPrev).cls" :title="R.cmp.ytdPrevP.label + ': ' + KAI.fmt.n(r.ytdPrev)" x-text="KAI.delta(r.ytd, r.ytdPrev).text"></span></td>
                </tr>
              </template>
            </tbody>
          </table>
          <p class="note" style="margin:10px 0 0">Merah = memburuk (naik), hijau = membaik (turun). Arahkan kursor ke persentase untuk melihat angka pembanding.</p>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><div><h3>Matriks prioritas</h3><p x-text="'Frekuensi × kelambatan per kelas · area oranye = sering & dampak tinggi (di atas kedua median) · klik gelembung untuk menelusuri'"></p></div></div>
        <div class="card-b fill"><div class="chart" x-chart="KAIChart.matrix(R.mat)" @chart-click="$store.app.go('telusuri', { kelas: $event.detail.data.kelas })"></div></div>
      </div>
    </div>

    <!-- Kartu per kelas dihapus (v3.17): angkanya sama dengan baris "Menit …" pada tabel di atas; baris itu kini dapat diklik. -->
    <p class="note mt-s" x-show="R.cls.belum && R.cls.belum.n" x-text="'Data belum lengkap (kelas belum diisi): ' + KAI.fmt.n(R.cls.belum ? R.cls.belum.n : 0) + ' kejadian · ' + KAI.fmt.n(R.cls.belum ? R.cls.belum.menit : 0) + ' menit — termasuk dalam total, tidak masuk baris “Menit …” per kelas.'"></p>

    <div class="card mt" x-data="{ get IB() { return $store.app.R && $store.app.R.insight; } }">
      <div class="card-b"><?!= include('Part.Insight'); ?>
</div>
      <div class="card-f" x-show="!$store.app.refReady">Temuan usia sarana &amp; JPL muncul setelah data referensi termuat.</div>
    </div>

    <div class="card mt">
      <div class="card-h"><div><h3>Kejadian terbesar</h3><p x-text="'50 kejadian dengan kelambatan terlama · ' + R.label + ' · klik baris untuk detail'"></p></div>
        <button class="btn sm" @click="$store.app.go('telusuri', {})">Semua kejadian<svg class="i"><use href="#i-arrow"/></svg></button></div>
      <div class="card-b"><div x-table="KAITable.eventSpec('ring-big', biggest, { sort: [{ column: 'menit', dir: 'desc' }] })" @row-click="$store.app.openEvent($event.detail.id)"></div></div>
    </div>
  </section>
</template>
<script>
document.addEventListener('alpine:init', function () {
  Alpine.data('vRingkasan', function () {
    return {
      get R() { return this.$store.app.R; },
      get cards() {
        var R = this.R, A = this.$store.app, f = KAI.fmt;
        return [
          { id: 'menit', label: 'Total kelambatan', value: R.kpi.menit, prev: R.kpiPrev.menit, yoy: R.kpiYoy.menit, unit: 'menit', fmt: f.n, color: 'var(--kai-navy)',
            note: 'Rerata ' + f.n(R.kpi.avg) + ' menit per kejadian', go: function () { A.go('tren'); } },
          { id: 'n', label: 'Frekuensi gangguan', value: R.kpi.n, prev: R.kpiPrev.n, yoy: R.kpiYoy.n, unit: 'kali', fmt: f.n, color: 'var(--c-sarana)', small: R.cfg.smallBase,
            note: f.n(R.kpi.heavy) + ' kejadian ≥ ' + R.cfg.heavy + ' menit', go: function () { A.go('telusuri', {}); } },
          { id: 'cross', label: 'Kelambatan perlintasan sebidang', value: R.kpi.crossMenit, prev: R.kpiPrev.crossMenit, yoy: R.kpiYoy.crossMenit, unit: 'menit', fmt: f.n, color: 'var(--kai-orange)',
            note: f.n(R.kpi.crossN) + ' kejadian perlintasan', go: function () { A.go('perlintasan'); } },
          { id: 'rp', label: 'Eksposur pendapatan (indikatif)', value: R.kpi.exposure, prev: R.kpiPrev.exposure, yoy: R.kpiYoy.exposure, unit: '', fmt: f.rp, color: 'var(--c-alam)',
            note: 'Indikatif · klik untuk rincian & catatan', go: function () { A.go('eksposur'); } }
        ];
      },
      get biggest() { return this.R.L.slice().sort(function (a, b) { return b.menit - a.menit; }).slice(0, 50); }
    };
  });
});
</script>
